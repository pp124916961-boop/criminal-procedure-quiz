name: Import exam note image

on:
  push:
    paths:
      - 'exam-notes/.note-import/ready.env'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode uploaded note image
        shell: bash
        run: |
          set -euo pipefail
          READY='exam-notes/.note-import/ready.env'
          if [ ! -f "$READY" ]; then
            echo 'No pending note import.'
            exit 0
          fi
          set -a
          . "$READY"
          set +a
          mkdir -p "$(dirname "$TARGET")"
          cat exam-notes/.note-import/chunk-*.b64 | tr -d '\r\n' | base64 -d > "$TARGET"
          python - <<'PY'
          import os, re
          from pathlib import Path
          subject = os.environ['SUBJECT']
          total = int(os.environ['TOTAL'])
          p = Path('exam-notes/config.js')
          s = p.read_text(encoding='utf-8')
          pat = rf"({re.escape(subject)}:\s*Object\.freeze\(\{{.*?\btotal:\s*)\d+"
          s2, n = re.subn(pat, lambda m: m.group(1) + str(total), s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Could not update total for {subject}')
          p.write_text(s2, encoding='utf-8')
          PY
          rm -rf exam-notes/.note-import
      - name: Commit imported note
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A exam-notes
          if git diff --cached --quiet; then
            echo 'No import changes.'
          else
            git commit -m 'Import exam note image [skip ci]'
            git push
          fi
