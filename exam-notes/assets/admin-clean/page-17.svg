="3"/><line x1="260" y1="920" x2="282" y2="920" class="l" stroke-width="3"/><text x="295" y="805" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">負擔處分</text><text x="505" y="805" font-size="34" class="r" text-anchor="start" dominant-baseline="hanging">✓</text><text x="295" y="900" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">授益處分</text><text x="505" y="900" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">仍要 ✓</text><text x="660" y="900" font-size="27" class="r" text-anchor="start" dominant-baseline="hanging">（專利核准架）</text><text x="130" y="1010" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">☆ 3、口頭 VA 也要救濟教示 ✓</text><text x="690" y="1010" font-size="26" class="r" text-anchor="start" dominant-baseline="hanging">（112大法庭）</text><text x="330" y="1055" font-size="25" class="t" text-anchor="start" dominant-baseline="hanging">（但沒說一般 VA）</text><text x="180" y="1130" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">4、其他法特設的救濟途徑 ✓</text><text x="690" y="1130" font-size="26" class="r" text-anchor="start" dominant-baseline="hanging">（112大法庭）</text><text x="330" y="1180" font-size="26" class="t" text-anchor="start" dominant-baseline="hanging">ex：政府採購法「異議 → 申訴」</text><text x="80" y="1275" font-size="35" class="t" text-anchor="start" dominant-baseline="hanging">（二）教示欠缺處理</text><text x="390" y="1280" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">（錯誤教示的信賴保護）</text><text x="180" y="1350" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">1、教示錯誤更正：</text><text x="495" y="1350" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">應以通知送達</text></svg>