name: Build Admin Procedure 54-91 102-109 Quiz

on:
  push:
    paths:
      - '.github/workflows/build-admin-54-109.yml'
      - 'scripts/build_admin_54_109.py'
      - 'scripts/audit_admin_54_109.py'
      - 'scripts/reuse_criminal_quiz_template.py'
      - 'scripts/inspect_criminal_template_dom.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q pandas pyarrow
      - name: Build 100-question quiz
        run: python scripts/build_admin_54_109.py
      - name: Audit legal basis and replace out-of-scope items
        run: python scripts/audit_admin_54_109.py
      - name: Inspect Criminal Law template DOM
        run: python scripts/inspect_criminal_template_dom.py
      - name: Reuse Criminal Law quiz program
        run: python scripts/reuse_criminal_quiz_template.py
      - name: Verify output
        run: |
          python - <<'PY'
          import json, pathlib
          q=json.load(open('admin-procedure-54-91-102-109/questions.json',encoding='utf-8'))
          r=json.load(open('admin-procedure-54-91-102-109/template-reuse-summary.json',encoding='utf-8'))
          assert len(q)==100
          assert all(len(x['options'])==4 and x['answer'] in 'ABCD' and x['source'] and x['basis']!='OUT' for x in q)
          assert r['program_reused'] is True and r['template']=='criminal-general-attempt'
          assert r['source_in_explanation'] is False
          for name in ['p1.txt','p2.txt','p2b.txt','p3.txt','p4.txt','p5.txt','p6.txt']:
              assert pathlib.Path('admin-procedure-54-91-102-109',name).exists()
          print('verified Criminal Law template with dedicated source only', len(q), 'questions')
          PY
      - name: Commit generated quiz
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-procedure-54-91-102-109
          git diff --cached --quiet && exit 0
          git commit -m 'Use Criminal Law quiz template for admin procedure 54-91 102-109'
          git push
