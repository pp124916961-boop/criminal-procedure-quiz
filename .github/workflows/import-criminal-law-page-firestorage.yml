name: Import criminal law note page from Firestorage

on:
  push:
    paths:
      - '.github/workflows/import-criminal-law-page-firestorage.yml'

permissions:
  contents: write

jobs:
  import-criminal-law-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser downloader
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Download exact criminal law PNG from Firestorage
        env:
          SHARE_URL: 'https://firestorage.ai/ja/f/-9luY_qV5dX0'
          EXPECTED_NAME: '9bbf7a42-a85e-4b5d-b23e-f821e9dba9ce.png'
          EXPECTED_SIZE: '3311992'
          EXPECTED_SHA256: 'd22b7ed346c3402bdcafb2f1ccb0bcf74352eb6e4d6e832673b69e22fffe30b9'
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright
          share = os.environ['SHARE_URL']
          name = os.environ['EXPECTED_NAME']
          out = Path('/tmp/criminal-law-page.png')
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(accept_downloads=True)
              page.goto(share, wait_until='domcontentloaded', timeout=120000)
              try:
                  page.wait_for_load_state('networkidle', timeout=30000)
              except Exception:
                  pass
              candidates = [page.get_by_text(name, exact=True), page.locator(f'a:has-text("{name}")'), page.locator(f'text={name}')]
              locator = None
              for c in candidates:
                  try:
                      if c.count() > 0:
                          locator = c.first
                          locator.wait_for(state='visible', timeout=10000)
                          break
                  except Exception:
                      continue
              if locator is None:
                  raise RuntimeError(f'Could not find file link: {name}')
              href = None
              try:
                  href = locator.get_attribute('href')
              except Exception:
                  pass
              if not href:
                  try:
                      href = locator.locator('xpath=ancestor-or-self::a[1]').get_attribute('href')
                  except Exception:
                      pass
              downloaded = False
              try:
                  with page.expect_download(timeout=120000) as di:
                      locator.click()
                  di.value.save_as(str(out))
                  downloaded = True
              except Exception as first_error:
                  if href:
                      target = page.url if href == '#' else href
                      if not target.startswith('http'):
                          target = urljoin(page.url, target)
                      r = page.request.get(target, timeout=120000)
                      if r.ok:
                          out.write_bytes(r.body())
                          downloaded = True
                  if not downloaded:
                      raise first_error
              browser.close()
          data = out.read_bytes()
          size = len(data)
          sha = hashlib.sha256(data).hexdigest()
          print('Downloaded size:', size)
          print('Downloaded sha256:', sha)
          assert size == int(os.environ['EXPECTED_SIZE']), (size, os.environ['EXPECTED_SIZE'])
          assert sha == os.environ['EXPECTED_SHA256'], (sha, os.environ['EXPECTED_SHA256'])
          assert data[:8] == bytes.fromhex('89504e470d0a1a0a'), 'Not a PNG file'
          PY

      - name: Add original PNG as criminal law page 99
        run: |
          mkdir -p exam-notes/assets/criminal-law
          cp /tmp/criminal-law-page.png exam-notes/assets/criminal-law/page-99.png

      - name: Update Criminal Law total and PNG override
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('exam-notes/config.js')
          s = p.read_text(encoding='utf-8')
          start = s.index("    criminalLaw: Object.freeze({")
          end = s.index("    admin: Object.freeze({", start)
          block = s[start:end]
          if "total: 99" not in block:
              block = block.replace("total: 98", "total: 99", 1)
          if "99: 'page-99.png'" not in block:
              block = block.replace("overrides: Object.freeze({})", "overrides: Object.freeze({\\n        99: 'page-99.png'\\n      })", 1)
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify criminal law page 99
        env:
          EXPECTED_SIZE: '3311992'
          EXPECTED_SHA256: 'd22b7ed346c3402bdcafb2f1ccb0bcf74352eb6e4d6e832673b69e22fffe30b9'
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          p = Path('exam-notes/assets/criminal-law/page-99.png')
          data = p.read_bytes()
          assert len(data) == int(os.environ['EXPECTED_SIZE'])
          assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_SHA256']
          print('Verified exact original PNG for criminal law page 99.')
          PY

      - name: Remove one-time import workflow
        run: |
          rm -f .github/workflows/import-criminal-law-page-firestorage.yml

      - name: Commit criminal law page 99 and configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Add criminal law note page 99 from original PNG'
          git push
