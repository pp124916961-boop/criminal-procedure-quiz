<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402"><rect width="100%" height="100%" fill="#fff"/><style>.t{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#121212;font-weight:400}.r{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#e71c1c;font-weight:400}.l{stroke:#121212;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}.rl{stroke:#e71c1c;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="70" y="35" font-size="17" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">No.</text><line x1="110" y1="50" x2="265" y2="50" class="l" stroke-width="1"/><text x="70" y="68" font-size="17" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">Date</text><line x1="120" y1="83" x2="265" y2="83" class="l" stroke-width="1"/><text x="85" y="120" font-size="40" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（三）代理人</text><text x="285" y="124" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">（本人可不到）</text><path d="M175 230 V760 H200" class="l" stroke-width="3"/><line x1="175" y1="230" x2="200" y2="230" class="l" stroke-width="3"/><text x="195" y="236" font-size="34" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">程序</text><path d="M310 210 V405" class="l" stroke-width="3"/><line x1="310" y1="210" x2="334" y2="210" class="l" stroke-width="3"/><line x1="310" y1="298" x2="334" y2="298" class="l" stroke-width="3"/><line x1="310" y1="390" x2="334" y2="390" class="l" stroke-width="3"/><text x="350" y="190" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">一當事人，不得請逾3人</text><text x="350" y="278" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">委任書（無口頭）</text><text x="700" y="278" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">→ 最初行政程序時</text><text x="350" y="370" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">法規 or 程序禁止</text><text x="715" y="370" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">→ 就不能委任</text><text x="195" y="520" font-size="34" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">效力</text><path d="M295 505 V830" class="l" stroke-width="3"/><line x1="295" y1="505" x2="320" y2="505" class="l" stroke-width="3"/><line x1="295" y1="585" x2="320" y2="585" class="l" stroke-width="3"/><line x1="295" y1="665" x2="320" y2="665" class="l" stroke-width="3"/><line x1="295" y1="750" x2="320" y2="750" class="l" stroke-width="3"/><line x1="295" y1="825" x2="320" y2="825" class="l" stroke-width="3"/><text x="335" y="486" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">單獨代理權：</text><text x="585" y="486" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">2代理人，得單獨代理</text><text x="335" y="566" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">再委任權：</text><text x="585" y="566" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">本人同意、代理人</text><text x="825" y="558" font-size="26" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">委</text><text x="825" y="585" font-size="26" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">任</text><text x="865" y="566" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">→ 複代理人</text><text x="335" y="646" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">代理權授受：</text><path d="M585 640 V715" class="l" stroke-width="3"/><line x1="585" y1="640" x2="607" y2="640" class="l" stroke-width="3"/><line x1="585" y1="700" x2="607" y2="700" class="l" stroke-width="3"/><text x="615" y="626" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">原：</text><text x="670" y="626" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">全部權利</text><text x="615" y="686" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">例：</text><text x="670" y="686" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">申請撤回權、要本人特別授權</text><text x="335" y="732" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">代理授受撤回：</text><text x="610" y="732" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">要通知 H</text><text x="335" y="805" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">代理權存續：本人死亡、能力消滅、變更代理規定……</text><text x="520" y="850" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">均不改變代理權。</text><text x="70" y="935" font-size="36" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（四）選定 or 指定當事人</text><text x="475" y="940" font-size="27" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">（當事人太多挑數個當代表）</text><text x="185" y="1020" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">程序</text><path d="M300 1000 V1115" class="l" stroke-width="3"/><line x1="300" y1="1000" x2="323" y2="1000" class="l" stroke-width="3"/><line x1="300" y1="1105" x2="323" y2="1105" class="l" stroke-width="3"/><text x="340" y="985" font-size="32" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">1～5人</text><text x="340" y="1065" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">選任</text><path d="M450 1050 V1150" class="l" stroke-width="3"/><line x1="450" y1="1050" x2="473" y2="1050" class="l" stroke-width="3"/><line x1="450" y1="1135" x2="473" y2="1135" class="l" stroke-width="3"/><text x="490" y="1037" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">人民自主選</text><text x="490" y="1120" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">H認妨礙程序</text><text x="700" y="1120" font-size="27" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">得命其選 → 逾未選 → 職權指定</text><text x="185" y="1200" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">效力</text><path d="M300 1185 V1380" class="l" stroke-width="3"/><line x1="300" y1="1185" x2="323" y2="1185" class="l" stroke-width="3"/><line x1="300" y1="1260" x2="323" y2="1260" class="l" stroke-width="3"/><line x1="300" y1="1365" x2="323" y2="1365" class="l" stroke-width="3"/><text x="340" y="1170" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">單獨代理權</text><text x="340" y="1245" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">代理權授受</text><path d="M575 1238 V1315" class="l" stroke-width="3"/><line x1="575" y1="1238" x2="598" y2="1238" class="l" stroke-width="3"/><line x1="575" y1="1302" x2="598" y2="1302" class="l" stroke-width="3"/><text x="610" y="1222" font-size="26" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">原：</text><text x="665" y="1222" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">全部權利</text><text x="610" y="1288" font-size="26" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">例：</text><text x="665" y="1288" font-size="27" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">申請撤回、權利拋棄、全體同意</text><text x="340" y="1345" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">代理權撤回</text><rect x="585" y="1334" width="70" height="38" fill="none" stroke="#e71c1c" stroke-width="2"/><text x="594" y="1338" font-size="25" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">書面</text><text x="665" y="1343" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">通知 H</text></svg>