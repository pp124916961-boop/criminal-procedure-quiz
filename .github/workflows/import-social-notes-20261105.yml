name: Import social order notes once
on:
  push:
    paths:
      - '.github/workflows/import-social-notes-20261105.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify original three images
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          base='https://api.firestorage.ai/dev/file/shares/clfFuFWbpOCd'
          listing_url=base+'/files?maxResults=1000'
          with urllib.request.urlopen(urllib.request.Request(listing_url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as resp:
              listing=json.load(resp)
          print('Available files:', [(x.get('fileId'),x.get('fileName')) for x in listing.get('files',[])])
          output=pathlib.Path('exam-notes/assets/police-law')
          output.mkdir(parents=True, exist_ok=True)
          expected=[
              ('01a1a75451ca74648c8ae2329e970aa6','page-01.png'),
              ('01a1a7560e43765d91e1f8426cceb3b9','page-02.png'),
              ('01a1a756236d7763bc975b1a498a47da','page-03.png')
          ]
          for fid,filename in expected:
              request=urllib.request.Request(base+'/files/'+fid+'/download',data=b'',headers={'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=60) as resp:
                  result=json.load(resp)
              signed_url=result.get('downloadUrl')
              if not signed_url: raise RuntimeError('No download URL for '+fid)
              with urllib.request.urlopen(urllib.request.Request(signed_url,headers={'User-Agent':'Mozilla/5.0'}),timeout=120) as resp:
                  blob=resp.read()
              if len(blob)<1000000 or not blob.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise RuntimeError('Image invalid for '+filename+' len='+str(len(blob)))
              (output/filename).write_bytes(blob)
              print(filename,len(blob),'bytes, PNG verified')
          config=pathlib.Path('exam-notes/config.js')
          txt=config.read_text()
          needle="""policeLaw: Object.freeze({
                name: '警察法規',
                total: 0,
                directory: 'assets/police-law',
                prefix: 'page-',
                defaultExtension: 'jpg',"""
          replacement=needle.replace('total: 0','total: 3').replace("defaultExtension: 'jpg'","defaultExtension: 'png'")
          if needle not in txt: raise RuntimeError('Unexpected notes configuration; refusing unsafe edit')
          config.write_text(txt.replace(needle,replacement,1))
          PY
      - name: Commit imported note images and activate police-law section
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-notes/config.js exam-notes/assets/police-law/page-0{1,2,3}.png
          git commit -m 'Add three social-order time-limit note images [skip ci]'
          git push
