<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754" role="img" aria-label="憲法考試口訣筆記第3頁 行政 × 立法｜議決與覆議">
<style>
text{font-family:'YuanSui','芫荽','PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif;letter-spacing:.2px}
.head{fill:#282928;font-size:52px;font-weight:800}
.sub{fill:#746a65;font-size:25px;font-weight:500}
.cardTitle{font-size:36px;font-weight:850;fill:#713e43}
.ref{font-size:21px;fill:#9a706b}
</style>
<rect width="1240" height="1754" fill="#faf4ec"/>
<rect x="34" y="34" width="1172" height="1686" fill="none" stroke="#e5d7c7" stroke-width="2"/>
<rect x="74" y="62" width="354" height="50" rx="16" fill="#f1dad7"/>
<text x="97" y="97" font-size="25" font-weight="800" fill="#94565c">憲法國考必備口訣 · 現行法</text>
<text x="74" y="172" class="head">行政 × 立法｜議決與覆議</text>
<text x="76" y="212" class="sub">行政院會議、覆議、不信任案一頁記</text>
<rect x="74" y="250" width="1092" height="429" rx="23" fill="#fffdf9" stroke="#e8d8c9" stroke-width="2"/><rect x="100" y="275" width="314" height="52" rx="18" fill="#f3d8d6"/><text x="125" y="312" class="cardTitle">耶和華宣戒大蒜</text><text x="117" y="380" fill="#34302f" font-size="29" font-weight="600">耶＝條約案　　和＝媾和案</text><text x="117" y="432" fill="#34302f" font-size="29" font-weight="500">華（法）＝法律案　　宣＝宣戰案</text><text x="117" y="484" fill="#34302f" font-size="29" font-weight="500">戒＝戒嚴案　　大＝大赦案</text><text x="117" y="536" fill="#34302f" font-size="29" font-weight="500">蒜（算）＝預算案</text><text x="117" y="588" fill="#34302f" font-size="29" font-weight="500">以上須提行政院會議議決；尚有其他事項。</text><text x="119" y="654" class="ref">憲法 §58</text><rect x="74" y="705" width="1092" height="429" rx="23" fill="#fffdf9" stroke="#e8d8c9" stroke-width="2"/><rect x="100" y="730" width="170" height="52" rx="18" fill="#f3d8d6"/><text x="125" y="767" class="cardTitle">法預約</text><text x="117" y="835" fill="#34302f" font-size="29" font-weight="600">法＝法律案　預＝預算案　約＝條約案</text><text x="117" y="887" fill="#34302f" font-size="29" font-weight="500">行政院認為窒礙難行，經總統核可覆議。</text><text x="117" y="939" fill="#34302f" font-size="29" font-weight="500">議案送達行政院 10 日內移請覆議。</text><text x="117" y="991" fill="#34302f" font-size="29" font-weight="500">立院原則 15 日內決議；全體立委 1/2 以上</text><text x="117" y="1043" fill="#34302f" font-size="29" font-weight="500">維持原案，行政院長即應接受。</text><text x="119" y="1109" class="ref">增修條文 §3 第2項第2款</text><rect x="74" y="1160" width="1092" height="429" rx="23" fill="#fffdf9" stroke="#e8d8c9" stroke-width="2"/><rect x="100" y="1185" width="602" height="52" rx="18" fill="#f3d8d6"/><text x="125" y="1222" class="cardTitle">三一提・七二等・四八決・二一過</text><text x="117" y="1290" fill="#34302f" font-size="29" font-weight="600">全體立委 1/3 以上連署，提不信任案。</text><text x="117" y="1342" fill="#34302f" font-size="29" font-weight="500">提出 72 小時後，48 小時內記名表決。</text><text x="117" y="1394" fill="#34302f" font-size="29" font-weight="500">全體立委 1/2 以上贊成，即通過。</text><text x="117" y="1446" fill="#34302f" font-size="29" font-weight="500">通過：院長 10 日內辭職，得呈請解散立院。</text><text x="117" y="1498" fill="#a44746" font-size="29" font-weight="500">未通過：1 年內不得對同一院長再提。</text><text x="119" y="1564" class="ref">增修條文 §3 第2項第3款</text>
<line x1="74" y1="1684" x2="1166" y2="1684" stroke="#decfc1" stroke-width="2"/>
<text x="76" y="1712" font-size="18" fill="#85746b">依憲法、增修條文及相關現行法規整理｜115.11.20 查核</text>
<text x="1143" y="1712" font-size="20" fill="#8d6c67" text-anchor="end">3 / 6</text>
</svg>