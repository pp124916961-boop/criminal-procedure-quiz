</style><text x="80" y="85" font-size="43" class="t" text-anchor="start" dominant-baseline="hanging">九、費用</text><text x="115" y="195" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">（一）</text><line x1="220" y1="205" x2="220" y2="410" class="l" stroke-width="3"/><line x1="220" y1="205" x2="245" y2="205" class="l" stroke-width="3"/><line x1="220" y1="410" x2="245" y2="410" class="l" stroke-width="3"/><text x="250" y="185" font-size="32" class="t" text-anchor="start" dominant-baseline="hanging">程序所生：</text><text x="455" y="185" font-size="36" class="r" text-anchor="start" dominant-baseline="hanging">H</text><text x="250" y="280" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">專為人民利益所支出</text><text x="250" y="360" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">可歸責人民之延滯費</text><text x="670" y="315" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">＝人民自行負擔</text><text x="115" y="500" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">（二）</text><line x1="205" y1="500" x2="205" y2="610" class="l" stroke-width="3"/><line x1="205" y1="500" x2="228" y2="500" class="l" stroke-width="3"/><line x1="205" y1="610" x2="228" y2="610" class="l" stroke-width="3"/><text x="238" y="480" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">證</text><text x="238" y="575" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">鑑</text><text x="365" y="520" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">日費＋旅費</text><text x="610" y="560" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">＋報酬</text><text x="790" y="535" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">→ 標準行政院定</text><text x="75" y="710" font-size="40" class="t" text-anchor="start" dominant-baseline="hanging">十、聽證</text><text x="285" y="712" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">（處分前 最嚴密調查程序）</text><text x="120" y="805" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">（一）</text><text x="235" y="798" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">當事人：其他已知利害關係人</text><text x="120" y="895" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">（二）</text><text x="235" y="888" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">書面通知：必要公告（若要預先公告，登報）</text><text x="120" y="985" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">（三）</text><text x="235" y="978" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">主持人：H首長 or 其指定／必要律師專業人員協助</text><text x="120" y="1075" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">（四）</text><text x="235" y="1068" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">H得預備聽證，</text><text x="490" y="1068" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">應作紀錄</text><text x="120" y="1165" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">（五）</text><text x="235" y="1158" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">聽證</text><line x1="355" y1="1140" x2="355" y2="1315" class="l" stroke-width="3"/><line x1="355" y1="1140" x2="380" y2="1140" class="l" stroke-width="3"/><line x1="355" y1="1265" x2="380" y2="1265" class="l" stroke-width="3"/><text x="390" y="1128" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">原：</text><text x="455" y="1128" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">公開、言詞為之</text><text x="390" y="1240" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">例：全 or 一部 不公開</text><line x1="760" y1="1230" x2="760" y2="1345" class="l" stroke-width="3"/><line x1="760" y1="1230" x2="782" y2="1230" class="l" stroke-width="3"/><line x1="760" y1="1320" x2="782" y2="1320" class="l" stroke-width="3"/><text x="795" y="1215" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">違公益</text><text x="795" y="1305" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">當事人利益重大損害</text></svg>