<svg xmlns="http://www.w3.org/2000/svg" width="1432" height="2023" viewBox="0 0 1432 2023">
<rect width="100%" height="100%" fill="#fffdfa"/>
<style>text{font-family:'Noto Sans CJK TC','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;dominant-baseline:hanging} .b{font-weight:700} .r{fill:#c83333} .k{fill:#1e1d1b} .g{fill:#766f67}</style>
<text x="130" y="150" font-size="42" fill="#1e1d1b" text-anchor="start">（五）輔佐人</text>
<text x="385" y="150" font-size="34" fill="#c83333" text-anchor="start">（本人要到－偕同）</text>
<line x1="300" y1="285" x2="300" y2="420" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="300" y1="285" x2="328" y2="285" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="300" y1="420" x2="328" y2="420" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="345" y="265" font-size="34" fill="#1e1d1b" text-anchor="start">當事人 or 代理人 經 H 同意</text>
<text x="345" y="360" font-size="34" fill="#1e1d1b" text-anchor="start">H 認有必要</text>
<line x1="930" y1="250" x2="930" y2="430" stroke="#c83333" stroke-width="4" stroke-linecap="round"/>
<line x1="930" y1="250" x2="902" y2="250" stroke="#c83333" stroke-width="4" stroke-linecap="round"/>
<line x1="930" y1="430" x2="902" y2="430" stroke="#c83333" stroke-width="4" stroke-linecap="round"/>
<text x="970" y="300" font-size="34" fill="#c83333" text-anchor="start">偕同輔佐人到場</text>
<text x="125" y="600" font-size="44" fill="#1e1d1b" text-anchor="start">四、迴避</text>
<text x="250" y="735" font-size="36" fill="#1e1d1b" text-anchor="start">應自行</text>
<line x1="470" y1="700" x2="470" y2="950" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="470" y1="700" x2="498" y2="700" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="470" y1="950" x2="498" y2="950" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="515" y="685" font-size="32" fill="#1e1d1b" text-anchor="start">配、前配、</text>
<text x="685" y="685" font-size="32" fill="#c83333" text-anchor="start">四血三姻</text>
<text x="850" y="685" font-size="28" fill="#1e1d1b" text-anchor="start">（當事人 or 當事共同權利義務）</text>
<text x="515" y="775" font-size="32" fill="#c83333" text-anchor="start">現曾</text>
<text x="610" y="775" font-size="32" fill="#1e1d1b" text-anchor="start">代理、輔佐人</text>
<text x="515" y="865" font-size="32" fill="#c83333" text-anchor="start">曾</text>
<text x="580" y="865" font-size="32" fill="#1e1d1b" text-anchor="start">證人、鑑定人</text>
<text x="250" y="1060" font-size="36" fill="#1e1d1b" text-anchor="start">申請</text>
<line x1="470" y1="1030" x2="470" y2="1200" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="470" y1="1030" x2="498" y2="1030" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="470" y1="1200" x2="498" y2="1200" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="515" y="1015" font-size="32" fill="#1e1d1b" text-anchor="start">應自行不自行</text>
<rect x="515" y="1090" width="185" height="50" rx="0" fill="none" stroke="#c83333" stroke-width="2"/>
<text x="530" y="1095" font-size="32" fill="#1e1d1b" text-anchor="start">事實偏頗</text>
<text x="515" y="1150" font-size="27" fill="#c83333" text-anchor="start">（抗議這個不應自行）</text>
<line x1="760" y1="1105" x2="840" y2="1105" stroke="#1e1d1b" stroke-width="3" stroke-linecap="round"/>
<line x1="840" y1="1105" x2="826.7191434362364" y2="1113.9229394782626" stroke="#1e1d1b" stroke-width="3" stroke-linecap="round"/>
<line x1="840" y1="1105" x2="826.7191434362364" y2="1096.0770605217374" stroke="#1e1d1b" stroke-width="3" stroke-linecap="round"/>
<line x1="860" y1="1020" x2="860" y2="1210" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="860" y1="1020" x2="888" y2="1020" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="860" y1="1210" x2="888" y2="1210" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="905" y="1005" font-size="31" fill="#1e1d1b" text-anchor="start">向原 H 申請，應釋明</text>
<text x="905" y="1085" font-size="29" fill="#c83333" text-anchor="start">不服 5 日提上級覆決，10 日處置</text>
<text x="905" y="1165" font-size="28" fill="#1e1d1b" text-anchor="start">程序停止（除似要處置）</text>
<text x="250" y="1305" font-size="32" fill="#1e1d1b" text-anchor="start">職權：應自行不自行 ＋ 未申請 → H 即職權迴避</text>
<text x="165" y="1530" font-size="33" fill="#1e1d1b" text-anchor="start">※ 現為證人、鑑定人不用迴避</text>
<text x="250" y="1605" font-size="34" fill="#c83333" text-anchor="start">若現為證、鑑，代表必不為 H</text>
</svg>