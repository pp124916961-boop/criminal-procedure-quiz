<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402"><rect width="100%" height="100%" fill="#fff"/><style>.t{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#121212;font-weight:400}.r{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#e71c1c;font-weight:400}.l{stroke:#121212;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}.rl{stroke:#e71c1c;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="70" y="42" font-size="17" class="t" dominant-baseline="hanging">No.</text><line x1="110" y1="57" x2="260" y2="57" class="l" stroke-width="1"/><text x="70" y="73" font-size="17" class="t" dominant-baseline="hanging">Date</text><line x1="120" y1="88" x2="260" y2="88" class="l" stroke-width="1"/><text x="145" y="125" font-size="41" class="t" dominant-baseline="hanging">（七）職務協助</text><text x="90" y="305" font-size="30" class="t" dominant-baseline="hanging">1.</text><text x="155" y="260" font-size="31" class="t" dominant-baseline="hanging">得</text><text x="155" y="300" font-size="31" class="t" dominant-baseline="hanging">請</text><text x="155" y="340" font-size="31" class="t" dominant-baseline="hanging">求</text><path d="M245 190 C210 250 210 420 245 500" class="rl" stroke-width="3"/><text x="270" y="180" font-size="31" class="r" dominant-baseline="hanging">法律不能</text><text x="270" y="238" font-size="31" class="r" dominant-baseline="hanging">事實不能</text><text x="270" y="296" font-size="31" class="r" dominant-baseline="hanging">不能調查</text><text x="270" y="354" font-size="31" class="r" dominant-baseline="hanging">資料被持</text><text x="270" y="412" font-size="31" class="r" dominant-baseline="hanging">較經濟</text><text x="270" y="470" font-size="31" class="r" dominant-baseline="hanging">其他</text><path d="M575 245 V405" class="l"/><line x1="575" y1="245" x2="600" y2="245" class="l"/><line x1="575" y1="405" x2="600" y2="405" class="l"/><text x="615" y="228" font-size="31" class="t" dominant-baseline="hanging">原則：書面</text><text x="615" y="382" font-size="31" class="t" dominant-baseline="hanging">例外：口頭</text><text x="110" y="575" font-size="38" class="t" dominant-baseline="hanging">2. 拒絕</text><path d="M245 555 V745" class="l"/><line x1="245" y1="555" x2="270" y2="555" class="l"/><line x1="245" y1="675" x2="270" y2="675" class="l"/><circle cx="305" cy="545" r="27" fill="none" stroke="#e71c1c" stroke-width="2"/><text x="292" y="527" font-size="28" class="t" dominant-baseline="hanging">得</text><text x="350" y="525" font-size="31" class="r" dominant-baseline="hanging">：有正當理由不能</text><circle cx="305" cy="665" r="27" fill="none" stroke="#e71c1c" stroke-width="2"/><text x="292" y="647" font-size="28" class="t" dominant-baseline="hanging">應</text><text x="350" y="640" font-size="30" class="t" dominant-baseline="hanging">：</text><path d="M400 640 V745" class="l"/><line x1="400" y1="640" x2="425" y2="640" class="l"/><line x1="400" y1="720" x2="425" y2="720" class="l"/><text x="435" y="620" font-size="30" class="r" dominant-baseline="hanging">非權限 or 依法不得為</text><text x="435" y="700" font-size="30" class="r" dominant-baseline="hanging">妨害自身職務</text><text x="90" y="835" font-size="33" class="t" dominant-baseline="hanging">3. 拒絕</text><text x="240" y="835" font-size="32" class="t" dominant-baseline="hanging">→</text><text x="300" y="810" font-size="29" class="t" dominant-baseline="hanging">請求</text><text x="310" y="845" font-size="29" class="t" dominant-baseline="hanging">的 H</text><text x="295" y="880" font-size="29" class="t" dominant-baseline="hanging">異議</text><text x="410" y="835" font-size="32" class="t" dominant-baseline="hanging">→</text><text x="480" y="810" font-size="29" class="t" dominant-baseline="hanging">共同上級</text><text x="520" y="847" font-size="29" class="t" dominant-baseline="hanging">決定</text><text x="670" y="835" font-size="32" class="t" dominant-baseline="hanging">→</text><text x="730" y="805" font-size="29" class="t" dominant-baseline="hanging">被求上級 H</text><text x="775" y="845" font-size="29" class="t" dominant-baseline="hanging">決定</text><text x="90" y="1025" font-size="38" class="t" dominant-baseline="hanging">4. 錢：</text><path d="M235 1028 V1255" class="l"/><line x1="235" y1="1028" x2="260" y2="1028" class="l"/><line x1="235" y1="1235" x2="260" y2="1235" class="l"/><text x="275" y="1008" font-size="30" class="t" dominant-baseline="hanging">被請</text><text x="360" y="995" font-size="31" class="r" dominant-baseline="hanging">要</text><text x="360" y="1030" font-size="31" class="r" dominant-baseline="hanging">錢</text><text x="405" y="1012" font-size="30" class="t" dominant-baseline="hanging">→ 請求</text><text x="275" y="1210" font-size="30" class="t" dominant-baseline="hanging">金額爭議：雙 H 協議 → 共同上級 H 定之</text></svg>