name: Build Administrative Penalty Act Full Quiz

on:
  push:
    paths:
      - '.github/workflows/build-administrative-penalty-act-full.yml'
      - 'scripts/build_administrative_penalty_act_full.py'
      - 'scripts/audit_administrative_penalty_act_full.py'
      - 'scripts/reuse_current_template_administrative_penalty_act_full.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q pandas pyarrow
      - name: Build 100 original Administrative Penalty Act questions
        run: python scripts/build_administrative_penalty_act_full.py
      - name: Audit legal basis and remedies
        run: python scripts/audit_administrative_penalty_act_full.py
      - name: Reuse current quiz program exactly
        run: python scripts/reuse_current_template_administrative_penalty_act_full.py
      - name: Verify final output
        run: |
          python - <<'PY'
          import json,pathlib,base64,gzip,re
          root=pathlib.Path('administrative-penalty-act-full')
          q=json.load(open(root/'questions.json',encoding='utf-8'))
          b=json.load(open(root/'build-summary.json',encoding='utf-8'))
          r=json.load(open(root/'template-reuse-summary.json',encoding='utf-8'))
          assert len(q)==100
          assert len({x['question']+'|'.join(x['options']) for x in q})==100
          assert all(len(x['options'])==4 and x['answer'] in 'ABCD' and x['source'] and x['basis'] for x in q)
          assert b['original_questions_unedited'] is True and b['source_required'] is True
          assert b['scope']=='行政罰法第1條至第46條（全法）'
          assert r['program_reused'] is True and r['source_position']=='above_question' and r['source_in_explanation'] is False
          assert r['storage_namespaced'] is True and r['cache_busted'] is True
          def qt(x): return x['question']+' '+x['options']['ABCD'.index(x['answer'])]
          q41=[x for x in q if '不得對裁處案件之實體決定聲明不服' in qt(x) or '單獨對扣留' in qt(x)]
          q35=[x for x in q if '強制其到指定處所查證身分不服' in qt(x)]
          assert q41 and all(x['basis']=='第41條' for x in q41)
          assert q35 and all(x['basis']=='第35條' for x in q35)
          parts=['p1.txt','p2.txt','p2b.txt','p3.txt','p4.txt','p5.txt','p6.txt']
          for n in ['index.html',*parts]: assert (root/n).exists()
          html=gzip.decompress(base64.b64decode(''.join((root/n).read_text() for n in parts))).decode()
          arrays=[]
          for mm in re.finditer(r'((?:const|let|var)\s+[A-Za-z_$][\w$]*\s*=\s*)(\[.*?\])(?=\s*;)',html,re.S):
              try:a=json.loads(mm.group(2))
              except:continue
              if isinstance(a,list) and len(a)==100 and a and isinstance(a[0],dict) and 'opts' in a[0]: arrays.append(a)
          assert arrays and arrays[0][0]['q']==q[0]['question']
          final=arrays[0]
          def ft(x): return x['q']+' '+x['opts'][x['ans']]
          f41=[x for x in final if '不得對裁處案件之實體決定聲明不服' in ft(x) or '單獨對扣留' in ft(x)]
          f35=[x for x in final if '強制其到指定處所查證身分不服' in ft(x)]
          assert f41 and all(x['basis']=='第41條' for x in f41)
          assert f35 and all(x['basis']=='第35條' for x in f35)
          print('verified',b,r)
          PY
      - name: Commit generated quiz
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add administrative-penalty-act-full
          git diff --cached --quiet && exit 0
          git commit -m 'Build Administrative Penalty Act full original-question quiz'
          git push
