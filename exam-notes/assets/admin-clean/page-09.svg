<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402"><rect width="100%" height="100%" fill="#fff"/><style>.t{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#121212;font-weight:400}.r{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#e71c1c;font-weight:400}.l{stroke:#121212;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}.rl{stroke:#e71c1c;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="855" y="35" font-size="17" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">No.</text><line x1="895" y1="50" x2="1050" y2="50" class="l" stroke-width="1"/><text x="855" y="68" font-size="17" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">Date</text><line x1="905" y1="83" x2="1050" y2="83" class="l" stroke-width="1"/><text x="75" y="115" font-size="42" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">七、資訊公開</text><line x1="285" y1="190" x2="285" y2="900" class="l" stroke-width="2"/><line x1="650" y1="190" x2="650" y2="900" class="l" stroke-width="2"/><line x1="1075" y1="190" x2="1075" y2="900" class="l" stroke-width="2"/><line x1="55" y1="205" x2="1075" y2="205" class="l" stroke-width="2"/><line x1="55" y1="285" x2="1075" y2="285" class="l" stroke-width="2"/><line x1="55" y1="375" x2="1075" y2="375" class="l" stroke-width="2"/><line x1="55" y1="495" x2="1075" y2="495" class="l" stroke-width="2"/><line x1="55" y1="580" x2="1075" y2="580" class="l" stroke-width="2"/><line x1="55" y1="665" x2="1075" y2="665" class="l" stroke-width="2"/><line x1="55" y1="755" x2="1075" y2="755" class="l" stroke-width="2"/><line x1="55" y1="900" x2="1075" y2="900" class="l" stroke-width="2"/><text x="400" y="215" font-size="34" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">行程法</text><text x="715" y="215" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">政府資訊公開法</text><text x="75" y="305" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">核心性質</text><text x="75" y="395" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">誰申請</text><text x="75" y="505" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">目的</text><text x="75" y="590" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">時點</text><text x="75" y="675" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">更正請求</text><text x="75" y="765" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">處理期限</text><text x="75" y="845" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">救濟</text><text x="355" y="305" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">閱卷權</text><text x="735" y="305" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">人民資訊請求</text><text x="330" y="395" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">當事人 or 利害關係人</text><text x="735" y="395" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">一般人民、法人、團體</text><text x="325" y="500" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">主張維護其法律</text><text x="365" y="535" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">利益之必要</text><text x="735" y="515" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">不用證明其法律利益</text><text x="350" y="590" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">程序進行中</text><text x="775" y="590" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">不限</text><text x="330" y="675" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">只能更正自己的</text><text x="735" y="675" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">更正 or 補充資訊</text><text x="325" y="760" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">無，</text><text x="380" y="760" font-size="27" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">但注意程序中</text><text x="755" y="760" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">15日 ＋ 15日（延）</text><text x="325" y="840" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">§174 不能單獨</text><text x="390" y="875" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">要併實體</text><text x="735" y="855" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">不服，直接行政救濟</text><text x="100" y="965" font-size="35" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">得拒絕公開</text><path d="M330 960 V1288" class="l" stroke-width="3"/><line x1="330" y1="960" x2="355" y2="960" class="l" stroke-width="3"/><line x1="330" y1="1030" x2="355" y2="1030" class="l" stroke-width="3"/><line x1="330" y1="1100" x2="355" y2="1100" class="l" stroke-width="3"/><line x1="330" y1="1170" x2="355" y2="1170" class="l" stroke-width="3"/><line x1="330" y1="1240" x2="355" y2="1240" class="l" stroke-width="3"/><text x="375" y="945" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">擬稿、準備文件</text><text x="375" y="1015" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">國防、軍事、公務秘密</text><text x="375" y="1085" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">個人、職業、營業秘密</text><path d="M720 1005 C765 1020 765 1125 720 1140" class="rl" stroke-width="2"/><text x="795" y="1015" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">無保密必要</text><text x="820" y="1065" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">仍要給閱</text><text x="375" y="1155" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">侵害第三人權益</text><text x="375" y="1225" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">妨礙 社治公安職務</text></svg>