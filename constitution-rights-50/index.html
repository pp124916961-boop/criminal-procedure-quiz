<script>const QUESTIONS=[{"source":"114年律師考試－綜合法學（一）第1題","chapter":"憲法基本原則","q":"憲法本文及增修條文之下列何種規定，得導出我國有民主國之性質？","opts":["總統及立法院均由人民直接選舉產生","總統公布法律、發布命令，須經行政院院長之副署","國家重要事項須經行政院院會議決","國家權力劃分為五權，分設五院行使之"],"ans":0,"law":"民主原則","exp":"人民定期以選舉形成國家權力，是民主正當性的核心。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第3題","chapter":"結社自由／政黨","q":"依司法院解釋意旨及憲法法庭裁判，關於政黨之敘述，下列何者錯誤？","opts":["政黨應服膺自由民主憲政秩序","政黨與其他團體受憲法保障與限制之程度無平等原則之適用","國家應致力於建立並確保複數政黨得以自由形成發展與公平參與選舉之法治環境","國家得對政黨之財產權加以更多限制或給予政黨補助金"],"ans":1,"law":"憲法第7條、第14條；政黨自由","exp":"政黨與其他團體之差別待遇仍受平等原則審查。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第4題","chapter":"人身自由","q":"有關家庭暴力防治法中之保護令，依司法院解釋意旨及憲法法庭裁判，下列敘述何者錯誤？","opts":["涉及人身自由之限制，應以法律定之","法律已就人身之處置為明文規定者，得透過具體明確之授權，委由主管機關執行之","有關人身自由限制之決定，得由法院依法定程序以裁定為之","民事保護令並不涉及人身自由之限制"],"ans":3,"law":"憲法第8條、法律保留","exp":"保護令可能限制接近、聯絡或活動，因此仍涉及人身自由。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第5題","chapter":"宗教自由","q":"下列何者非屬釋憲實務對於宗教自由保障之意旨？","opts":["宗教結社屬宗教自由之絕對保障","國家考試不得基於人民之特定信仰給與加分優待","國家不得基於人民之特定信仰為理由予以不利益","不許人民以宗教理由免除服兵役義務"],"ans":0,"law":"憲法第13條","exp":"宗教自由並非所有外部行為均受絕對保障。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第6題","chapter":"講學自由／大學自治","q":"依司法院解釋意旨及憲法法庭裁判，關於大學自治之敘述，下列何者錯誤？","opts":["為避免學術自由受國家不當干預，立法機關僅得在合理之範圍內對大學事務加以規範","大學為確保學位之授予具備一定之水準，得於合理及必要之範圍內，訂定有關取得學位之資格條件","審理大學學生提起行政爭訟事件，應本於維護大學自治之原則，對大學之專業判斷予以適度之尊重","大學法明定大學應設教務處、學生事務處、總務處之內部組織，限制大學之自主組織權而與保障大學自治之意旨相牴觸"],"ans":3,"law":"憲法第11條、大學自治","exp":"大學自治受憲法保障，但立法者仍得在合理範圍規範大學組織。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第7題","chapter":"生命權","q":"關於生命權保障，下列敘述何者錯誤？","opts":["我國憲法對生命權之保障依據，依司法院解釋意旨及憲法法庭裁判，應係憲法第22條其他自由權利的保障範圍","公民及政治權利國際公約規定，任何被判處死刑的人應有權請求赦免或減刑，但赦免法未有類似規定，使被判處死刑的人有權請求獲得赦免","法律規定不得對未滿18歲之人處以死刑，符合兒童權利公約之精神","公民及政治權利國際公約規定，未廢除死刑之國家，非犯情節最重大之罪，不得科處死刑"],"ans":0,"law":"生命權、憲法第15條","exp":"憲法法庭近年已明確認生命權受憲法第15條保障，故A錯。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第8題","chapter":"平等權","q":"有關平等原則，下列敘述何者錯誤？","opts":["人民無權主張不法之平等","行政機關依裁量基準而形成之慣例，發生間接對外效力，屬於平等原則之內涵","平等原則可以導出行政機關須受行政慣例之自我拘束","夜市攤販甲因逃漏營業稅而應予補稅，甲有權請求稅務機關要求其他夜市攤販補稅"],"ans":3,"law":"憲法第7條","exp":"平等原則不能作為主張他人也應受同樣違法待遇的依據。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第9題","chapter":"訴訟權","q":"關於訴訟權保障，下列敘述何者錯誤？","opts":["訴訟救濟由何種法院審理，為訴訟權保障之核心內容，非屬立法形成自由","受刑事有罪判決之被告，應有上訴救濟之機會，屬於訴訟權保障之核心內容","直接審理、言詞辯論、對審及辯護制度係本於正當法律程序之原則","有權利即有救濟，權利受公權力侵害者，皆享有訴訟救濟之基本權"],"ans":0,"law":"憲法第16條","exp":"法院種類、審級與程序原則上有立法形成空間，並非全部屬訴訟權核心。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第10題","chapter":"工作權／職業自由","q":"計程車駕駛人觸犯法定之罪，經法院判決有期徒刑以上之刑，吊扣或廢止其執業登記，依司法院解釋意旨及憲法法庭裁判，係對於何種自由之限制？","opts":["遷徙自由","職業選擇自由之主觀條件","職業選擇自由之客觀條件","職業自由之執行方式"],"ans":1,"law":"憲法第15條工作權","exp":"以個人資格、能力或品行作為准入條件，屬職業選擇之主觀條件。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第11題","chapter":"平等權／宗教自由","q":"關於服兵役之義務，下列敘述何者錯誤？","opts":["甲男因宗教信仰而不願使用武器，向主管機關申請獲准服替代役，故甲男因此免除服兵役之義務","中華民國男子依法有服兵役之義務，係立法者鑒於男女之生理上差異，所為之合理差別待遇","為防衛國家之安全，在實施徵兵制之國家，即規定人民有服兵役之義務","因有痼疾不堪服役者，得依法律規定免除服兵役之義務"],"ans":0,"law":"憲法第13條、第20條","exp":"服替代役仍屬履行兵役義務，並非免除兵役義務。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第12題","chapter":"概括基本權","q":"依司法院解釋意旨及憲法法庭裁判，憲法第22條規定之基本權利，下列何者受絕對保障？","opts":["原住民之身分認同權","原住民依循文化傳承從事狩獵活動","個人自主控制其個人資料之資訊隱私權","人民內在精神活動之思想自由"],"ans":3,"law":"憲法第22條、思想自由","exp":"內在思想自由屬人性尊嚴核心，國家不得強制形成或改變人民內在思想。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第13題","chapter":"健康權","q":"依司法院解釋意旨及憲法法庭裁判，關於人民健康權之敘述，下列何者錯誤？","opts":["國家對於健康權負有最低限度之保護義務","公務員之值勤與健康權無涉","旨在保障人民生理及心理機能之完整性，不受任意侵害","健康權為憲法第22條所保障之基本權利"],"ans":1,"law":"憲法第22條健康權","exp":"公務員服勤制度若危及身心健康，仍涉及健康權保障。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"114年律師考試－綜合法學（一）第14題","chapter":"基本權總論","q":"依司法院解釋意旨及憲法法庭裁判，何者非屬憲法上之制度性保障？","opts":["學術自由","人身自由","地方自治","一般行動自由"],"ans":3,"law":"制度性保障與基本權","exp":"一般行動自由是個人基本權，不是制度性保障。","url":"https://kaonow.com/paper/lawyer-moex-114-daceb9ea/"},{"source":"112年原住民族特考四等－測量製圖第1題","chapter":"憲法基本原則","q":"重要憲政機關之職位任期必須有所限制，以便人民有機會於一定時間內，重新決定對這些機關之授權。此為何種憲法原則之內涵？","opts":["多黨競爭原則","民主正當性原則","權力分立原則","法治國原則"],"ans":1,"law":"民主原則","exp":"定期改選使國家權力持續回溯至人民授權。","url":"https://kaonow.com/paper/aboriginal-014e6a52-moex-112-6ed013db/"},{"source":"112年原住民族特考四等－測量製圖第3題","chapter":"表現自由","q":"依司法院釋字第445號解釋意旨，集會自由與言論、講學、著作及出版自由，同屬下列何者之範疇？","opts":["表演自由","表現自由","人身自由","行為自由"],"ans":1,"law":"憲法第11條、第14條","exp":"集會與言論等皆是人民表達、形成與交換意見的表現自由。","url":"https://kaonow.com/paper/aboriginal-014e6a52-moex-112-6ed013db/"},{"source":"112年原住民族特考四等－測量製圖第4題","chapter":"結社自由","q":"關於結社自由之限制，下列敘述何者錯誤？","opts":["人民團體之命名及更名權，屬結社自由保障範圍","主管機關命令人民團體限期整理並停止理事、監事職權，涉及結社自由而受法律保留拘束","基於國家安全，主張共產主義或分裂國土之結社一律不受憲法保障","人民團體法對理事長產生方式之強制規定，可能涉及比例原則審查"],"ans":2,"law":"憲法第14條","exp":"對結社自由的限制仍須依具體目的、手段及比例原則審查，不能概括宣告不受保障。","url":"https://kaonow.com/paper/aboriginal-014e6a52-moex-112-6ed013db/"},{"source":"112年原住民族特考四等－測量製圖第5題","chapter":"工作權／職業自由","q":"依司法院大法官解釋，關於職業自由，下列敘述何者錯誤？","opts":["對醫師、中醫師及牙醫師之資格限制，原則上得以法律為合理規範","航空人員體格標準屬職業選擇之客觀條件，且當然違反比例原則而違憲","藥事法對醫師調劑藥品之限制，未必違反工作權","計程車駕駛人之犯罪與執業風險欠缺實質關聯時，一律吊扣或廢止執業登記可能違反比例原則"],"ans":1,"law":"憲法第15條工作權","exp":"與個人資格、能力有關者通常屬主觀條件；限制是否違憲仍須具體審查比例。","url":"https://kaonow.com/paper/aboriginal-014e6a52-moex-112-6ed013db/"},{"source":"112年原住民族特考四等－測量製圖第6題","chapter":"訴訟權","q":"訴訟救濟之審級、程序及要件，原則上應由何機關衡量案件性質、訴訟政策等因素作成規定？","opts":["法院","行政院","立法院","憲法法庭"],"ans":2,"law":"憲法第16條","exp":"訴訟制度在不侵害核心保障的前提下，原則上屬立法形成空間。","url":"https://kaonow.com/paper/aboriginal-014e6a52-moex-112-6ed013db/"},{"source":"112年原住民族特考四等－測量製圖第7題","chapter":"受教權","q":"依憲法及司法院釋字第626號解釋意旨，因人民有受國民教育之權利，國家有何種義務？","opts":["保障受教育後之就業","免費提供所有教育階段之書籍","對逾學齡未受基本教育之人民提供補習教育","保障人民得任意選擇是否接受國民教育"],"ans":2,"law":"憲法第21條","exp":"國家應建立基本教育制度，並對失學者提供補習教育。","url":"https://kaonow.com/paper/aboriginal-014e6a52-moex-112-6ed013db/"},{"source":"112年原住民族特考四等－測量製圖第8題","chapter":"工作權／一般行為自由","q":"依司法院解釋，有關道路交通管理處罰條例限制計程車駕駛人執業之規定，下列敘述何者錯誤？","opts":["欠缺實質關聯之資格限制可能違反比例原則並侵害工作權","相關規定主要侵害人身自由","吊銷執業所必要之駕駛執照可能涉及工作權","吊銷駕駛執照亦可能涉及一般行為自由"],"ans":1,"law":"憲法第15條、第22條","exp":"此類規範核心涉及工作權及一般行為自由，而非憲法第8條人身自由。","url":"https://kaonow.com/paper/aboriginal-014e6a52-moex-112-6ed013db/"},{"source":"110年一般警察人員特考－行政警察第4題","chapter":"講學自由／大學自治","q":"依司法院大法官解釋意旨，有關大學自治，下列敘述何者錯誤？","opts":["大學自治係憲法第11條講學自由之保障範圍","大學之入學資格與畢業條件均應由主管機關統一規定","大學自治包含教師之教學研究自由及學生之學習自由","大學對內部組織、課程、研究、學力與考試規則享有一定自治空間"],"ans":1,"law":"憲法第11條","exp":"入學與畢業條件並非均須由主管機關統一決定，大學自治有一定自主形成空間。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-110-3d2b73b6/"},{"source":"110年一般警察人員特考－行政警察第5題","chapter":"宗教自由","q":"下列何者非屬憲法第13條宗教自由保障之範圍？","opts":["設立國教","寺廟財產之管理處分","宗教團體之組織自主","創立新宗教或教派"],"ans":0,"law":"憲法第13條","exp":"宗教自由包含信仰、傳教、結社及宗教組織自主，但國家不得設立國教。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-110-3d2b73b6/"},{"source":"110年一般警察人員特考－行政警察第9題","chapter":"訴訟權","q":"依司法院大法官解釋意旨，下列何者不屬於訴訟權保障之內容？","opts":["刑事被告與辯護人自由溝通","民事與行政訴訟採二元審判制度","法官迴避制度","刑事被告獲知案件卷證資訊之權利"],"ans":1,"law":"憲法第16條","exp":"採何種法院體系與審判制度有較大立法形成空間，並非訴訟權核心內容。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-110-3d2b73b6/"},{"source":"110年一般警察人員特考－行政警察第10題","chapter":"受教權","q":"依憲法有關國民教育之規定，下列敘述何者正確？","opts":["凡滿6歲至15歲之學齡兒童皆負接受基本教育之義務，毫無例外","國民教育所需之全部書籍一律由政府免費供給","逾學齡未受基本教育之人民，應受補習教育","補習教育一律須由受教者繳納學費"],"ans":2,"law":"憲法第21條、基本國民教育","exp":"憲法及相關制度要求對失學國民提供補習教育。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-110-3d2b73b6/"},{"source":"110年一般警察人員特考－行政警察第13題","chapter":"集會結社自由","q":"依司法院大法官解釋意旨，有關集會結社自由，下列敘述何者正確？","opts":["集會遊行禁制區制度一律違憲","偶發性集會遊行仍要求事前申請許可，違反憲法保障集會自由之意旨","室外集會採許可制當然違憲","人民團體設立採許可制必然是最輕微的限制手段"],"ans":1,"law":"憲法第14條、釋字第445號等","exp":"偶發性集會因事前無從預見，仍要求事前申請許可會形成不合理限制。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-110-3d2b73b6/"},{"source":"110年一般警察人員特考－行政警察第15題","chapter":"基本權救濟","q":"下列何者得作為司法院大法官違憲審查之客體？","opts":["學校對學生所為退學處分本身","限制特定職業之法律","總統之統治行為本身","普通法院之個案事實認定"],"ans":1,"law":"憲法基本權與違憲審查","exp":"限制人民基本權之法律規範可成為規範違憲審查的客體。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-110-3d2b73b6/"},{"source":"110年一般警察人員特考－行政警察第20題","chapter":"法律保留","q":"關於憲法第23條法律保留原則，下列敘述何者正確？","opts":["法律保留是要求立法者將所有事項留給行政機關裁量","涉及生命、身體自由或其他重要自由權利之限制，原則上應以國會法律規定","多種手段中選擇侵害最小手段，是法律保留原則而非比例原則","法律救濟中使人民保持有利地位，即屬法律保留原則"],"ans":1,"law":"憲法第23條、法律保留","exp":"基本權重要事項原則上須由法律規定；侵害最小則屬比例原則。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-110-3d2b73b6/"},{"source":"110年一般警察人員特考－行政警察第21題","chapter":"比例原則","q":"依司法院大法官解釋意旨，下列何項基本權限制尚未違反比例原則？","opts":["公職人員違反利益迴避規定一律處新臺幣100萬元以上罰鍰","駕駛人闖越鐵路平交道肇事，依法吊銷駕駛執照","計程車駕駛人曾犯竊盜罪即永久廢止執業登記並吊銷駕照","已有子女之臺灣地區人民一律不得認可收養大陸地區配偶之子女"],"ans":1,"law":"憲法第23條比例原則","exp":"闖越平交道肇事與交通安全具有高度關聯，吊照規範曾獲認定尚屬合比例限制。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-110-3d2b73b6/"},{"source":"110年一般警察人員特考－行政警察第23題","chapter":"契約自由","q":"依司法院大法官解釋意旨，下列何者非屬契約自由之主要內容？","opts":["是否締約之自由","撤銷契約之自由","契約內容之自由","選擇契約相對人之自由"],"ans":1,"law":"憲法第22條契約自由","exp":"契約自由通常包含締約、相對人、內容及方式等自由；撤銷權是法律效果制度問題。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-110-3d2b73b6/"},{"source":"113年一般警察人員特考－行政警察第1題","chapter":"工作權／財產權","q":"依司法院大法官解釋，有關人民工作權、財產權，下列敘述何者錯誤？","opts":["基於憲法工作權之保障，人民得自由選擇從事特定職業","航空人員之技能、體格或性行，經檢查不合標準時，得限制、暫停或終止其執業，並未侵害其工作權","公務員服務法規定，公務員於其離職後3年內，不得擔任與其離職前5年內之職務直接相關之營利事業董事，侵害其工作權","道路交通管理處罰條例規定，曾犯故意殺人罪，經判決罪刑確定者，不准辦理營業小客車駕駛人執業登記，並未侵害其工作權"],"ans":2,"law":"憲法第15條","exp":"旋轉門規範雖限制工作權，但有防止利益衝突之重要公益，並非當然違憲。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-113-3d2b73b6/"},{"source":"113年一般警察人員特考－行政警察第2題","chapter":"權力分立","q":"司法院釋字第585號解釋指出，國家機關獨立行使職權受憲法保障者，非屬立法院調查權所得調查之範圍。此主要涉及何項憲法原則？","opts":["權力分立原則","依法行政原則","民主原則","比例原則"],"ans":0,"law":"權力分立原則","exp":"國會調查權仍受其他憲法機關核心職權與權力分立界限拘束。","url":"https://kaonow.com/paper/generalpolice-8b7f1efc-moex-113-3d2b73b6/"},{"source"
