<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402"><rect width="100%" height="100%" fill="#fff"/><style>.t{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#121212;font-weight:400}.r{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#e71c1c;font-weight:400}.l{stroke:#121212;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}.rl{stroke:#e71c1c;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="855" y="35" font-size="17" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">No.</text><line x1="895" y1="50" x2="1050" y2="50" class="l" stroke-width="1"/><text x="855" y="68" font-size="17" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">Date</text><line x1="905" y1="83" x2="1050" y2="83" class="l" stroke-width="1"/><text x="90" y="125" font-size="39" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（五）輔佐人</text><text x="315" y="130" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">（本人要到－偕同）</text><path d="M220 225 V380" class="l" stroke-width="3"/><line x1="220" y1="225" x2="245" y2="225" class="l" stroke-width="3"/><line x1="220" y1="360" x2="245" y2="360" class="l" stroke-width="3"/><text x="265" y="208" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">當事人 or 代理人 經 H 同意</text><text x="265" y="342" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">H 認有必要</text><path d="M710 210 C760 230 760 355 710 375" class="rl" stroke-width="2.5"/><text x="785" y="265" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">偕同輔佐人到場</text><text x="85" y="470" font-size="42" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">四、迴避</text><path d="M170 565 V1000 H195" class="l" stroke-width="3"/><line x1="170" y1="565" x2="195" y2="565" class="l" stroke-width="3"/><text x="195" y="548" font-size="34" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">應自行</text><path d="M335 535 V720" class="l" stroke-width="3"/><line x1="335" y1="535" x2="360" y2="535" class="l" stroke-width="3"/><line x1="335" y1="620" x2="360" y2="620" class="l" stroke-width="3"/><line x1="335" y1="705" x2="360" y2="705" class="l" stroke-width="3"/><text x="370" y="520" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">配、前配、</text><text x="555" y="520" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">四血三姻</text><text x="715" y="520" font-size="24" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（當事人 or 當事共同權利義務）</text><text x="370" y="605" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">現曾</text><text x="470" y="605" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">代理、輔佐人</text><text x="370" y="690" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">曾</text><text x="470" y="690" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">證人、鑑定人</text><text x="195" y="780" font-size="34" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">申請</text><path d="M330 755 V895" class="l" stroke-width="3"/><line x1="330" y1="755" x2="355" y2="755" class="l" stroke-width="3"/><line x1="330" y1="875" x2="355" y2="875" class="l" stroke-width="3"/><text x="370" y="738" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">應自行不自行</text><rect x="365" y="815" width="210" height="48" fill="none" stroke="#e71c1c" stroke-width="2"/><text x="380" y="820" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">事實偏頗</text><text x="350" y="875" font-size="25" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">（雖這個不應自行）</text><text x="620" y="790" font-size="48" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">⇒</text><path d="M735 700 V930" class="l" stroke-width="3"/><line x1="735" y1="700" x2="760" y2="700" class="l" stroke-width="3"/><line x1="735" y1="800" x2="760" y2="800" class="l" stroke-width="3"/><line x1="735" y1="900" x2="760" y2="900" class="l" stroke-width="3"/><text x="775" y="682" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">向原 H 申請，應釋明</text><text x="775" y="782" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">不服</text><text x="820" y="782" font-size="24" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">5日提上級覆決，10日處置</text><text x="775" y="882" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">程序</text><text x="850" y="882" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">停止</text><text x="925" y="882" font-size="25" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（除必要處置）</text><text x="195" y="968" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">職權：應自行不自行 ＋ 未申請</text><text x="680" y="968" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">→ H職權命迴避</text><text x="105" y="1130" font-size="32" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">※ 現為證人、鑑定人不用迴避</text><text x="185" y="1215" font-size="32" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">若現為證、鑑，代表必不為 H</text></svg>