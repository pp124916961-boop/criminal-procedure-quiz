<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="1376" viewBox="0 0 1104 1376">
  <rect width="1104" height="1376" fill="#ffffff"/>
  <style>
    .t{font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#111;font-size:31px;font-weight:500}
    .r{fill:#e11;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:31px;font-weight:500}
    .s{font-size:24px}.sm{font-size:20px}.ttl{font-size:42px;font-weight:500}.sec{font-size:34px;font-weight:500}
    .line{stroke:#111;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}.rline{stroke:#e11;stroke-width:2.5;fill:none}
  </style>
  <text x="552" y="68" text-anchor="middle" class="t ttl">行政法 NO1</text>
  <text x="855" y="37" class="t sm">No.</text><line x1="900" y1="35" x2="1040" y2="35" class="line" stroke-width="1.5"/>
  <text x="855" y="72" class="t sm">Date</text><line x1="910" y1="70" x2="1040" y2="70" class="line" stroke-width="1.5"/>
  <text x="72" y="132" class="t sec">＊行程法</text>
  <text x="76" y="192" class="t sec">一、法例</text>
  <text x="118" y="252" class="t">（一）本法功能：</text>
  <text x="327" y="252" class="r">公公民法人效信</text>
  <text x="118" y="316" class="t">（二）</text>
  <path d="M190 299 H210 V370 H229" class="line"/>
  <text x="226" y="317" class="t">行政程序：</text>
  <text x="377" y="317" class="r">VA、V.V、法規命令、行政規則、行政計畫、行政指導、陳情</text>
  <text x="390" y="350" class="t s">①</text><text x="456" y="350" class="t s">②</text><text x="636" y="350" class="t s">③</text><text x="777" y="350" class="t s">④</text><text x="900" y="350" class="t s">⑤</text><text x="1010" y="350" class="t s">⑥</text>
  <text x="226" y="394" class="t">行政H</text>
  <path d="M337 375 H356 V577 H371" class="line"/>
  <path d="M356 394 H374 M356 450 H374 M356 506 H374 M356 575 H374" class="line"/>
  <text x="379" y="404" class="r">國家</text>
  <text x="379" y="460" class="r">地治團體</text>
  <text x="379" y="516" class="r">其他行政主體</text><text x="566" y="516" class="t">（公法人、行政法人）</text>
  <text x="309" y="588" class="r">☆</text><text x="379" y="588" class="r">準行政H：受託行使公權力之個人 or 團體</text>
  <text x="118" y="682" class="t">（三）H 排除</text>
  <path d="M305 655 H328 V728 H348" class="line"/>
  <text x="359" y="665" class="t">民意</text><text x="359" y="697" class="t">司</text><text x="359" y="729" class="t">監</text>
  <path d="M159 696 V806 H180" class="line"/>
  <text x="183" y="795" class="t">事項排除：</text><text x="349" y="795" class="r">外外刑矯私</text>
  <circle cx="558" cy="785" r="24" fill="none" stroke="#e11" stroke-width="2.5"/><text x="558" y="795" text-anchor="middle" class="r s">學</text>
  <circle cx="610" cy="785" r="24" fill="none" stroke="#e11" stroke-width="2.5"/><text x="610" y="795" text-anchor="middle" class="r s">公</text><text x="637" y="795" class="r">考</text>
  <path d="M578 814 H600 V903 H620" class="line"/><path d="M600 836 H620 M600 892 H620" class="line"/>
  <text x="627" y="846" class="t">改變其身分 or 處分</text>
  <text x="627" y="902" class="t">人事改變身分 or 重大利益</text>
  <path d="M915 815 C952 815 950 900 915 912" class="rline"/><text x="963" y="832" class="r">例外要</text><text x="963" y="875" class="r">適用本法</text>
  <text x="118" y="1002" class="t">（四）原則：</text>
  <text x="137" y="1068" class="r">☆</text><text x="174" y="1068" class="t">裁量目的性原則</text>
  <text x="184" y="1178" class="t">瑕疵</text>
  <path d="M284 1160 H329 V1259 H348" class="line"/><path d="M329 1127 H348 M329 1223 H348" class="line"/>
  <circle cx="382" cy="1128" r="28" fill="none" stroke="#111" stroke-width="2.5"/><text x="382" y="1140" text-anchor="middle" class="t">外</text><text x="431" y="1141" class="r">→ 裁量逾越</text>
  <circle cx="382" cy="1224" r="28" fill="none" stroke="#111" stroke-width="2.5"/><text x="382" y="1236" text-anchor="middle" class="t">內</text>
  <path d="M414 1224 H451 V1296 H470" class="line"/><path d="M451 1240 H470 M451 1287 H470" class="line"/>
  <text x="477" y="1252" class="t">考量不必要因素：</text><text x="731" y="1252" class="r">裁量濫用</text><text x="876" y="1252" class="t">（事實錯誤）</text>
  <text x="477" y="1304" class="t">怠惰</text><text x="707" y="1304" class="t">：</text><text x="740" y="1304" class="r">裁量怠惰</text>
</svg>