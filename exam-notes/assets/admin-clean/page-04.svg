<svg xmlns="http://www.w3.org/2000/svg" width="1432" height="2023" viewBox="0 0 1432 2023">
<rect width="100%" height="100%" fill="#fffdfa"/>
<style>text{font-family:'Noto Sans CJK TC','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;dominant-baseline:hanging} .b{font-weight:700} .r{fill:#c83333} .k{fill:#1e1d1b} .g{fill:#766f67}</style>
<text x="155" y="150" font-size="43" fill="#1e1d1b" text-anchor="start">（七）職務協助</text>
<text x="190" y="330" font-size="36" fill="#1e1d1b" text-anchor="start">1. 得請求</text>
<line x1="280" y1="290" x2="280" y2="675" stroke="#c83333" stroke-width="4" stroke-linecap="round"/>
<line x1="280" y1="290" x2="310" y2="290" stroke="#c83333" stroke-width="4" stroke-linecap="round"/>
<line x1="280" y1="675" x2="310" y2="675" stroke="#c83333" stroke-width="4" stroke-linecap="round"/>
<text x="335" y="275" font-size="34" fill="#c83333" text-anchor="start">法律不能</text>
<text x="335" y="337" font-size="34" fill="#c83333" text-anchor="start">事實不能</text>
<text x="335" y="399" font-size="34" fill="#c83333" text-anchor="start">不能調查</text>
<text x="335" y="461" font-size="34" fill="#c83333" text-anchor="start">資料被持</text>
<text x="335" y="523" font-size="34" fill="#c83333" text-anchor="start">較經濟</text>
<text x="335" y="585" font-size="34" fill="#c83333" text-anchor="start">其他</text>
<line x1="695" y1="365" x2="695" y2="540" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="695" y1="365" x2="723" y2="365" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="695" y1="540" x2="723" y2="540" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="740" y="345" font-size="32" fill="#1e1d1b" text-anchor="start">原則：書面</text>
<text x="740" y="465" font-size="32" fill="#1e1d1b" text-anchor="start">例外：口頭</text>
<text x="175" y="780" font-size="40" fill="#1e1d1b" text-anchor="start">2. 拒絕</text>
<text x="390" y="760" font-size="34" fill="#c83333" text-anchor="start">得</text>
<circle cx="407.0" cy="778.7" r="22.1" fill="none" stroke="#c83333" stroke-width="3"/>
<text x="455" y="760" font-size="34" fill="#c83333" text-anchor="start">有正當理由不能</text>
<text x="390" y="865" font-size="34" fill="#c83333" text-anchor="start">應</text>
<circle cx="407.0" cy="883.7" r="22.1" fill="none" stroke="#c83333" stroke-width="3"/>
<line x1="520" y1="850" x2="520" y2="990" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="520" y1="850" x2="548" y2="850" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="520" y1="990" x2="548" y2="990" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="565" y="835" font-size="34" fill="#c83333" text-anchor="start">非權限 or 依法不得為</text>
<text x="565" y="925" font-size="34" fill="#c83333" text-anchor="start">妨害自身職務</text>
<text x="175" y="1150" font-size="32" fill="#1e1d1b" text-anchor="start">3. 拒絕 → 請求的 H 異議 → 共同上級決定 → 被求上級 H 決定</text>
<text x="175" y="1410" font-size="40" fill="#1e1d1b" text-anchor="start">4. 錢：</text>
<line x1="340" y1="1390" x2="340" y2="1640" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="340" y1="1390" x2="368" y2="1390" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="340" y1="1640" x2="368" y2="1640" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="390" y="1375" font-size="34" fill="#1e1d1b" text-anchor="start">被請</text>
<text x="485" y="1375" font-size="34" fill="#c83333" text-anchor="start">要錢</text>
<text x="570" y="1375" font-size="34" fill="#1e1d1b" text-anchor="start">→ 請求</text>
<text x="390" y="1540" font-size="34" fill="#1e1d1b" text-anchor="start">金額爭議：雙 H 協議 → 共同上級 H 定之</text>
</svg>