name: Import police duty notes from Firestorage

on:
  push:
    paths:
      - '.github/workflows/import-police-duty-firestorage.yml'

permissions:
  contents: write

jobs:
  import-police-duty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser downloader
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Download exact police duty ZIP from Firestorage
        env:
          SHARE_URL: 'https://firestorage.ai/ja/f/Oph_fKUr04br'
          EXPECTED_NAME: '警勤.zip'
          EXPECTED_SIZE: '24721369'
          EXPECTED_SHA256: '05208ebe0507933dbc32804619c21673ab43db7047f08c1179e3bb5741b6ebaa'
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright

          share = os.environ['SHARE_URL']
          name = os.environ['EXPECTED_NAME']
          out = Path('/tmp/police-duty.zip')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(accept_downloads=True)
              page.goto(share, wait_until='domcontentloaded', timeout=120000)
              try:
                  page.wait_for_load_state('networkidle', timeout=30000)
              except Exception:
                  pass

              candidates = [
                  page.get_by_text(name, exact=True),
                  page.locator(f'a:has-text("{name}")'),
                  page.locator(f'text={name}')
              ]
              locator = None
              for c in candidates:
                  try:
                      if c.count() > 0:
                          locator = c.first
                          locator.wait_for(state='visible', timeout=10000)
                          break
                  except Exception:
                      continue
              if locator is None:
                  print('PAGE TITLE:', page.title())
                  print('PAGE URL:', page.url)
                  print('BODY PREVIEW:', page.locator('body').inner_text()[:5000])
                  raise RuntimeError(f'Could not find file link: {name}')

              href = None
              try:
                  href = locator.get_attribute('href')
              except Exception:
                  pass
              if not href:
                  try:
                      href = locator.locator('xpath=ancestor-or-self::a[1]').get_attribute('href')
                  except Exception:
                      pass

              downloaded = False
              try:
                  with page.expect_download(timeout=120000) as di:
                      locator.click()
                  di.value.save_as(str(out))
                  downloaded = True
              except Exception as first_error:
                  if href:
                      target = page.url if href == '#' else href
                      if not target.startswith('http'):
                          target = urljoin(page.url, target)
                      r = page.request.get(target, timeout=120000)
                      if r.ok:
                          body = r.body()
                          if body[:2] == b'PK':
                              out.write_bytes(body)
                              downloaded = True
                  if not downloaded:
                      print('PAGE TITLE:', page.title())
                      print('PAGE URL:', page.url)
                      print('CANDIDATE HREF:', href)
                      print('BODY PREVIEW:', page.locator('body').inner_text()[:5000])
                      raise first_error
              browser.close()

          data = out.read_bytes()
          size = len(data)
          sha = hashlib.sha256(data).hexdigest()
          print('Downloaded size:', size)
          print('Downloaded sha256:', sha)
          assert size == int(os.environ['EXPECTED_SIZE']), (size, os.environ['EXPECTED_SIZE'])
          assert sha == os.environ['EXPECTED_SHA256'], (sha, os.environ['EXPECTED_SHA256'])
          assert data[:2] == b'PK', 'Not a ZIP file'
          PY

      - name: Extract 78 original JPG pages without re-encoding
        run: |
          python - <<'PY'
          import re, zipfile
          from pathlib import Path

          src = Path('/tmp/police-duty.zip')
          outdir = Path('exam-notes/assets/police-duty')
          outdir.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(src) as z:
              names = [n for n in z.namelist() if not n.endswith('/')]
              jpgs = [n for n in names if Path(n).suffix.lower() in {'.jpg', '.jpeg'}]
              assert len(jpgs) == 78, f'Expected 78 JPGs, found {len(jpgs)}: {names}'

              def sort_key(name):
                  m = re.search(r'(\d+)(?=\.[^.]+$)', Path(name).name)
                  if not m:
                      raise RuntimeError(f'No numeric suffix in filename: {name}')
                  return int(m.group(1))

              jpgs.sort(key=sort_key)
              nums = [sort_key(n) for n in jpgs]
              assert len(nums) == len(set(nums)), 'Duplicate numeric suffixes in ZIP filenames'

              existing = list(outdir.glob('page-*.jpg'))
              assert not existing, f'Police Duty directory already has pages: {[p.name for p in existing[:10]]}'

              for idx, name in enumerate(jpgs, 1):
                  data = z.read(name)
                  assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9', f'Incomplete JPEG: {name}'
                  target = outdir / f'page-{idx:02d}.jpg'
                  target.write_bytes(data)
                  print(f'{idx:02d}: {name} -> {target} ({len(data)} bytes)')

          final = sorted(outdir.glob('page-*.jpg'))
          assert len(final) == 78, len(final)
          PY

      - name: Update Police Duty total to 78
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('exam-notes/config.js')
          s = p.read_text(encoding='utf-8')
          anchor = "    policeDuty: Object.freeze({\n      name: '警察勤務',\n      total: 0,"
          replacement = "    policeDuty: Object.freeze({\n      name: '警察勤務',\n      total: 78,"
          if anchor not in s:
              if replacement in s:
                  print('Police Duty total is already 78.')
              else:
                  raise SystemExit('Could not safely locate Police Duty total 0.')
          else:
              s = s.replace(anchor, replacement, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify final police duty pages
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [Path(f'exam-notes/assets/police-duty/page-{i:02d}.jpg') for i in range(1,79)]
          missing = [str(p) for p in pages if not p.is_file()]
          assert not missing, missing
          assert all(p.stat().st_size > 0 for p in pages)
          print('Verified 78 police duty JPG pages.')
          PY

      - name: Remove one-time import workflow
        run: |
          rm -f .github/workflows/import-police-duty-firestorage.yml

      - name: Commit police duty notes and configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Add 78 police duty note pages from original JPGs'
          git push
