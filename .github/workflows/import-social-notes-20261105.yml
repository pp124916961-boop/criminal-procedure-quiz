name: Import social order notes (diagnostic)
on:
  push:
    paths:
      - '.github/workflows/import-social-notes-20261105.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect share page client API
        run: |
          set -euo pipefail
          curl -LsS 'https://firestorage.ai/_next/static/chunks/app/%28files%29/ja/f/page-4d19ae0a4ce39d79.js' -o /tmp/page.js
          python3 - <<'PY' > exam-notes/assets/social-transfer-diagnostic.txt
          import re
          s=open('/tmp/page.js').read()
          print('size',len(s))
          for pat in ['api/','fetch(','download','share','getShared','publicId','fileId','slug','signed','folder','storage','/f/']:
              print('\n===',pat,'===\n')
              occ=list(re.finditer(re.escape(pat),s,re.I))
              print('matches',len(occ))
              for m in occ[:20]:
                  print(s[max(0,m.start()-260):m.end()+350])
                  print('---')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-notes/assets/social-transfer-diagnostic.txt
          git commit -m 'Inspect temporary share download API [skip ci]'
          git push
