e="hanging" font-weight="400">始日一日論，末日遇假照計</text><text x="65" y="1135" font-size="32" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（二）掛號郵寄給 H：</text><text x="390" y="1135" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">交郵當日郵戳為準</text><text x="65" y="1215" font-size="34" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（三）回復原則</text><path d="M320 1200 V1345" class="l" stroke-width="3"/><line x1="320" y1="1200" x2="345" y2="1200" class="l" stroke-width="3"/><line x1="320" y1="1255" x2="345" y2="1255" class="l" stroke-width="3"/><line x1="320" y1="1315" x2="345" y2="1315" class="l" stroke-width="3"/><text x="365" y="1185" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">10日內</text><text x="365" y="1240" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">其他行政行為 一併補</text><text x="365" y="1300" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">逾一年不得申</text><text x="625" y="1303" font-size="25" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（刑訴沒有）</text><text x="65" y="1360" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（四）未規定的公法處理期間</text><text x="650" y="1360" font-size="20" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">2月＋2月（延）｜延前通知申請人｜天災等不可歸責，處理期間停止</text></svg>