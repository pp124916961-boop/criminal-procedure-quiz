</style><text x="70" y="95" font-size="42" class="t" text-anchor="start" dominant-baseline="hanging">十一、陳述意見</text><text x="365" y="100" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">（較弱的聽證之調查程序）</text><text x="120" y="235" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">（一）</text><text x="240" y="228" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">被處分相對人；利害關係人</text><text x="120" y="350" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">（二）</text><text x="240" y="345" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">H作限制剝奪人民自由權利</text><circle cx="710" cy="372" r="28" fill="none" stroke="#e71c1c" stroke-width="2"/><text x="690" y="350" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">應</text><text x="745" y="350" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">通知相對人陳述意見</text><text x="255" y="430" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">孫</text><line x1="345" y1="430" x2="345" y2="530" class="l" stroke-width="3"/><line x1="345" y1="430" x2="367" y2="430" class="l" stroke-width="3"/><line x1="345" y1="515" x2="367" y2="515" class="l" stroke-width="3"/><text x="380" y="412" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">得陳述意見（關係人的）</text><text x="380" y="495" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">聽證</text><text x="120" y="610" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">（三）</text><text x="240" y="605" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">H得不給陳述：§103</text><text x="120" y="770" font-size="35" class="t" text-anchor="start" dominant-baseline="hanging">（四）提出方式</text><line x1="390" y1="755" x2="390" y2="930" class="l" stroke-width="3"/><line x1="390" y1="755" x2="414" y2="755" class="l" stroke-width="3"/><line x1="390" y1="900" x2="414" y2="900" class="l" stroke-width="3"/><text x="425" y="735" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">書面：</text><text x="535" y="735" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">陳述書</text><text x="425" y="875" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">言詞：</text><text x="535" y="875" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">陳述書期間內提，H應紀錄供簽</text><text x="120" y="1035" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">（五）</text><text x="240" y="1030" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">H應通知相對人可提出陳述書</text><line x1="310" y1="1110" x2="310" y2="1320" class="l" stroke-width="3"/><line x1="310" y1="1110" x2="334" y2="1110" class="l" stroke-width="3"/><line x1="310" y1="1200" x2="334" y2="1200" class="l" stroke-width="3"/><line x1="310" y1="1290" x2="334" y2="1290" class="l" stroke-width="3"/><text x="350" y="1090" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">書面</text><text x="350" y="1180" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">口頭告知相對人，</text><text x="620" y="1180" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">要作成紀錄供簽</text><text x="350" y="1270" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">必要時公告</text></svg>