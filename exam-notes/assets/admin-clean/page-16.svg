<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402"><rect width="100%" height="100%" fill="#fff"/><style>.t{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#121212;font-weight:400}.r{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#e71c1c;font-weight:400}.l{stroke:#121212;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}.rl{stroke:#e71c1c;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="80" y="100" font-size="39" class="t" text-anchor="start" dominant-baseline="hanging">（五）時間限制</text><line x1="220" y1="185" x2="220" y2="360" class="l" stroke-width="3"/><line x1="220" y1="185" x2="244" y2="185" class="l" stroke-width="3"/><line x1="220" y1="340" x2="244" y2="340" class="l" stroke-width="3"/><text x="255" y="165" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">星期六、日</text><text x="480" y="165" font-size="32" class="r" text-anchor="start" dominant-baseline="hanging">→</text><text x="535" y="150" font-size="50" class="r" text-anchor="start" dominant-baseline="hanging">×</text><text x="640" y="165" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">受送人同意就OK</text><text x="255" y="320" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">日出前、日沒後</text><text x="80" y="470" font-size="36" class="t" text-anchor="start" dominant-baseline="hanging">（六）公示送達 vs 公告</text><line x1="160" y1="560" x2="160" y2="760" class="l" stroke-width="3"/><line x1="160" y1="560" x2="182" y2="560" class="l" stroke-width="3"/><line x1="160" y1="730" x2="182" y2="730" class="l" stroke-width="3"/><text x="195" y="540" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">公示：特定人、貼H公告欄，</text><circle cx="700" cy="560" r="26" fill="none" stroke="#e71c1c" stroke-width="2"/><text x="682" y="542" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">得</text><text x="735" y="540" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">加公告方式</text><text x="195" y="710" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">公告：不特定人、刊登政府公報 or 新聞紙</text><text x="260" y="805" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">所以 公示 ≠ 公告</text><text x="80" y="905" font-size="36" class="t" text-anchor="start" dominant-baseline="hanging">（七）送達證書</text><line x1="315" y1="900" x2="315" y2="1080" class="l" stroke-width="3"/><line x1="315" y1="900" x2="337" y2="900" class="l" stroke-width="3"/><line x1="315" y1="1040" x2="337" y2="1040" class="l" stroke-width="3"/><circle cx="375" cy="920" r="24" fill="none" stroke="#e71c1c" stroke-width="2"/><text x="359" y="902" font-size="27" class="r" text-anchor="start" dominant-baseline="hanging">得</text><text x="415" y="900" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">製作，沒作不影響送達效力</text><text x="760" y="885" font-size="25" class="t" text-anchor="start" dominant-baseline="hanging">（但有作應附卷）</text><text x="350" y="1025" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">公示送達：</text><circle cx="540" cy="1045" r="24" fill="none" stroke="#e71c1c" stroke-width="2"/><text x="524" y="1027" font-size="27" class="r" text-anchor="start" dominant-baseline="hanging">應</text><text x="575" y="1025" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">作書面證書附卷</text><text x="80" y="1160" font-size="36" class="t" text-anchor="start" dominant-baseline="hanging">（八）送達生效日</text><line x1="300" y1="1145" x2="300" y2="1290" class="l" stroke-width="3"/><line x1="300" y1="1145" x2="322" y2="1145" class="l" stroke-width="3"/><line x1="300" y1="1260" x2="322" y2="1260" class="l" stroke-width="3"/><text x="335" y="1128" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">當日：</text><text x="450" y="1128" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">效力看當日</text><text x="335" y="1242" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">始日不算：</text><text x="505" y="1242" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">期間看翌日</text><text x="130" y="1330" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">☆ ex：8/10 收 VA 則</text><line x1="500" y1="1320" x2="500" y2="1390" class="l" stroke-width="3"/><line x1="500" y1="1320" x2="518" y2="1320" class="l" stroke-width="3"/><line x1="500" y1="1370" x2="518" y2="1370" class="l" stroke-width="3"/><text x="530" y="1308" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging">8/10 生效</text><text x="530" y="1358" font-size="25" class="t" text-anchor="start" dominant-baseline="hanging">8/11 算訴願期限第一天</text></svg>