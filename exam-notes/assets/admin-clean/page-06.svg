<svg xmlns="http://www.w3.org/2000/svg" width="1432" height="2023" viewBox="0 0 1432 2023">
<rect width="100%" height="100%" fill="#fffdfa"/>
<style>text{font-family:'Noto Sans CJK TC','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;dominant-baseline:hanging} .b{font-weight:700} .r{fill:#c83333} .k{fill:#1e1d1b} .g{fill:#766f67}</style>
<text x="120" y="150" font-size="43" fill="#1e1d1b" text-anchor="start">（三）代理人</text>
<text x="360" y="150" font-size="34" fill="#c83333" text-anchor="start">（本人不到）</text>
<text x="220" y="290" font-size="36" fill="#1e1d1b" text-anchor="start">程序</text>
<line x1="400" y1="260" x2="400" y2="520" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="400" y1="260" x2="428" y2="260" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="400" y1="520" x2="428" y2="520" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="445" y="245" font-size="34" fill="#c83333" text-anchor="start">當事人，不得超過 3 人</text>
<text x="445" y="335" font-size="34" fill="#c83333" text-anchor="start">委任書（無口頭） → 最初行政程序時</text>
<text x="445" y="425" font-size="34" fill="#c83333" text-anchor="start">法規 or 程序禁止 → 就不能委任</text>
<text x="220" y="660" font-size="36" fill="#1e1d1b" text-anchor="start">效力</text>
<line x1="400" y1="620" x2="400" y2="1210" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="400" y1="620" x2="428" y2="620" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="400" y1="1210" x2="428" y2="1210" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="445" y="610" font-size="33" fill="#1e1d1b" text-anchor="start">單獨代理權：2 代理人，得單獨代理</text>
<text x="445" y="710" font-size="33" fill="#1e1d1b" text-anchor="start">再委任權：本人同意，代理人</text>
<text x="955" y="710" font-size="33" fill="#c83333" text-anchor="start">委任</text>
<text x="1040" y="710" font-size="33" fill="#1e1d1b" text-anchor="start">→ 複代理人</text>
<text x="445" y="810" font-size="33" fill="#1e1d1b" text-anchor="start">代理權授受：</text>
<line x1="700" y1="800" x2="700" y2="930" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="700" y1="800" x2="728" y2="800" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="700" y1="930" x2="728" y2="930" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="745" y="785" font-size="32" fill="#1e1d1b" text-anchor="start">原：</text>
<text x="830" y="785" font-size="32" fill="#c83333" text-anchor="start">全部權利</text>
<text x="745" y="865" font-size="32" fill="#1e1d1b" text-anchor="start">例：</text>
<text x="830" y="865" font-size="32" fill="#c83333" text-anchor="start">申請撤回權，要本人特別授權</text>
<text x="445" y="980" font-size="33" fill="#1e1d1b" text-anchor="start">代理權撤回：</text>
<text x="700" y="980" font-size="33" fill="#c83333" text-anchor="start">要通知 H</text>
<text x="445" y="1080" font-size="31" fill="#1e1d1b" text-anchor="start">代理權存續：本人死亡、能力消滅、變更代理規定……</text>
<text x="715" y="1140" font-size="34" fill="#c83333" text-anchor="start">均不改變代理權。</text>
<text x="120" y="1320" font-size="40" fill="#1e1d1b" text-anchor="start">（四）選定 or 指定當事人</text>
<text x="590" y="1320" font-size="32" fill="#c83333" text-anchor="start">（當事人多挑幾個當代表）</text>
<text x="220" y="1430" font-size="35" fill="#1e1d1b" text-anchor="start">程序</text>
<line x1="400" y1="1410" x2="400" y2="1585" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="400" y1="1410" x2="428" y2="1410" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="400" y1="1585" x2="428" y2="1585" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="445" y="1395" font-size="34" fill="#c83333" text-anchor="start">1～5 人</text>
<text x="445" y="1470" font-size="34" fill="#1e1d1b" text-anchor="start">選任</text>
<line x1="560" y1="1460" x2="560" y2="1590" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="560" y1="1460" x2="588" y2="1460" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="560" y1="1590" x2="588" y2="1590" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="605" y="1445" font-size="31" fill="#1e1d1b" text-anchor="start">人民自選</text>
<text x="605" y="1520" font-size="31" fill="#1e1d1b" text-anchor="start">H 認為協程序，</text>
<text x="840" y="1520" font-size="31" fill="#c83333" text-anchor="start">得命其選 → 逾期未選 → 職權指定</text>
<text x="220" y="1690" font-size="35" fill="#1e1d1b" text-anchor="start">效力</text>
<line x1="400" y1="1670" x2="400" y2="1900" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="400" y1="1670" x2="428" y2="1670" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="400" y1="1900" x2="428" y2="1900" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="445" y="1655" font-size="31" fill="#1e1d1b" text-anchor="start">單獨代理權</text>
<text x="445" y="1725" font-size="31" fill="#1e1d1b" text-anchor="start">代理權授受</text>
<line x1="650" y1="1715" x2="650" y2="1820" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="650" y1="1715" x2="678" y2="1715" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="650" y1="1820" x2="678" y2="1820" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="690" y="1705" font-size="29" fill="#c83333" text-anchor="start">原：全部權利</text>
<text x="690" y="1765" font-size="29" fill="#c83333" text-anchor="start">例：申請撤回、權利拋棄、全體同意</text>
<text x="445" y="1850" font-size="31" fill="#c83333" text-anchor="start">代理權撤回：書面通知 H</text>
</svg>