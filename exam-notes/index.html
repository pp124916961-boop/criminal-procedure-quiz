<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#f1ece4">
<title>考試筆記</title>
<style>
:root{--ink:#1e1d1b;--red:#c83333;--desk:#d3cabc;--border:#d7ccbf;--muted:#71695f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;color:var(--ink);background:#eee8de;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}button,input{font:inherit}.hidden{display:none!important}
#home{height:100dvh;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));display:grid;place-items:center;background:radial-gradient(circle at 15% 8%,#fff 0,transparent 27%),linear-gradient(145deg,#f6f0e6,#e7dccd)}
.home-card{width:min(520px,100%);height:min(740px,100%);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(8px,1.7vh,15px)}.brand{display:flex;align-items:center;gap:13px}.mark{width:50px;height:50px;border-radius:16px;background:#292622;color:#fff;display:grid;place-items:center;font-size:27px;font-weight:900;box-shadow:0 10px 24px #544b4030}.eyebrow{margin:0;color:var(--red);font:900 10px/1.2 system-ui;letter-spacing:.16em}.brand h1{margin:3px 0 0;font-size:clamp(30px,5.3vh,44px);line-height:1}.subjects{display:grid;grid-template-rows:repeat(6,minmax(42px,1fr));gap:clamp(6px,1vh,10px);min-height:0}.subject{border:1px solid var(--border);border-radius:16px;background:#fffdf9e8;padding:0 18px;display:flex;align-items:center;text-align:left;font-size:clamp(17px,2.45vh,21px);font-weight:700;color:var(--ink);box-shadow:0 6px 18px #3a2c2110;cursor:pointer}.subject:active{transform:scale(.987)}.subject.ready{border-color:#c7a89b;background:#fff8f3}.arrow{margin-left:auto;color:#9c9084;font-size:27px}.tag{margin-left:auto;background:#ecd9d1;color:var(--red);font:800 11px system-ui;border-radius:99px;padding:4px 8px}.subject.ready .arrow{margin-left:8px}.foot{text-align:center;color:var(--muted);font-size:11px;margin:0}
#viewer{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--desk)}.viewer-head{height:62px;padding:max(7px,env(safe-area-inset-top)) 10px 6px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:#fffdf9fa;border-bottom:1px solid var(--border);z-index:4}.viewer-title{text-align:center}.viewer-title p{margin:0;color:var(--red);font:900 9px system-ui;letter-spacing:.14em}.viewer-title h2{margin:2px 0 0;font-size:22px;line-height:1}.icon{width:40px;height:40px;border:1px solid var(--border);border-radius:13px;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:27px;cursor:pointer}
.stage{position:relative;min-height:0;overflow:hidden;padding:9px;background:linear-gradient(#d8d0c5,#c8bcac);display:flex;align-items:center;justify-content:center}.page-image{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;background:#fffdfa;box-shadow:0 9px 30px #372b2030;user-select:none;-webkit-user-drag:none}.page-image.loading{opacity:.35}.load-msg{position:absolute;inset:auto 20px 20px;text-align:center;color:#5f574f;font-size:13px;pointer-events:none}
.controls{background:#fffdf9fc;border-top:1px solid var(--border);padding:8px 11px calc(8px + env(safe-area-inset-bottom));z-index:4}.pager{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center}.nav{height:39px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}.nav:disabled{opacity:.34}.counter{min-width:80px;text-align:center;color:var(--muted);font:500 13px system-ui}.counter strong{color:var(--ink);font-size:18px}.slide{display:grid;grid-template-columns:22px 1fr 28px;align-items:center;gap:7px;margin-top:7px}.edge{font:700 10px system-ui;text-align:center;color:var(--muted)}#pageSlider{appearance:none;-webkit-appearance:none;width:100%;height:23px;background:transparent;margin:0}#pageSlider::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:#d9cfc4}#pageSlider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--red);border:2px solid white;margin-top:-7.5px;box-shadow:0 2px 7px #0003}#pageSlider::-moz-range-track{height:5px;border-radius:99px;background:#d9cfc4}#pageSlider::-moz-range-thumb{width:18px;height:18px;border:2px solid white;border-radius:50%;background:var(--red)}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#1f1b187f;padding:22px;backdrop-filter:blur(5px)}.modal-card{width:min(340px,100%);background:#fffdf9;border-radius:22px;padding:24px;text-align:center;box-shadow:0 18px 55px #42302422}.modal-card h3{margin:0 0 8px;font-size:21px}.modal-card p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.55}.ok{width:100%;height:44px;border:0;border-radius:13px;background:var(--ink);color:#fff;font-weight:700}
#zoom{position:fixed;inset:0;z-index:30;background:#171615;display:grid;grid-template-rows:50px minmax(0,1fr)}.zoom-bar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;background:#201f1e}.zoom-label{font:700 12px system-ui}.close{width:38px;height:38px;border:0;border-radius:11px;background:#353331;color:#fff;font-size:26px}.zoom-area{overflow:auto;-webkit-overflow-scrolling:touch;padding:16px;touch-action:pan-x pan-y pinch-zoom}.zoom-image{display:block;width:900px;height:auto;max-width:none;margin:0 auto;background:#fffdfa;box-shadow:0 8px 28px #0008}
@media(max-height:610px){.home-card{gap:6px}.mark{width:42px;height:42px}.brand h1{font-size:28px}.subjects{gap:5px}.subject{font-size:15px;border-radius:13px}.foot{display:none}.viewer-head{height:54px}.controls{padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom))}.nav{height:34px}.slide{margin-top:3px}}
</style>
</head>
<body>
<main id="home"><section class="home-card">
<header class="brand"><div class="mark">筆</div><div><p class="eyebrow">EXAM NOTES</p><h1>考試筆記</h1></div></header>
<nav class="subjects" aria-label="科目">
<button class="subject" data-subject="憲法">憲法<span class="arrow">›</span></button>
<button class="subject" data-subject="警察法規">警察法規<span class="arrow">›</span></button>
<button class="subject" data-subject="警察勤務">警察勤務<span class="arrow">›</span></button>
<button class="subject" data-subject="刑事訴訟法">刑事訴訟法<span class="arrow">›</span></button>
<button class="subject" data-subject="刑法">刑法<span class="arrow">›</span></button>
<button class="subject ready" id="adminBtn">行政法<span class="tag">30 頁</span><span class="arrow">›</span></button>
</nav><p class="foot">行政法 30 頁依原稿逐頁固定版面重建。</p>
</section></main>
<main id="viewer" class="hidden">
<header class="viewer-head"><button id="back" class="icon" aria-label="返回首頁">‹</button><div class="viewer-title"><p>考試筆記</p><h2>行政法</h2></div><button id="zoomBtn" class="icon" aria-label="放大閱讀">＋</button></header>
<section class="stage" id="stage"><img id="pageImage" class="page-image" alt="行政法筆記第 1 頁" draggable="false"><div id="loadMsg" class="load-msg hidden">載入中…</div></section>
<section class="controls"><div class="pager"><button id="prev" class="nav">上一頁</button><div class="counter"><strong id="cur">1</strong> / 30</div><button id="next" class="nav">下一頁</button></div><div class="slide"><span class="edge">1</span><input id="pageSlider" type="range" min="1" max="30" value="1" step="1" aria-label="快速跳頁"><span class="edge">30</span></div></section>
</main>
<div id="empty" class="modal hidden"><div class="modal-card"><h3 id="emptyTitle">筆記尚未上傳</h3><p>這個科目的筆記之後上傳後，可以直接接進來。</p><button id="emptyClose" class="ok">知道了</button></div></div>
<div id="zoom" class="hidden"><div class="zoom-bar"><span id="zoomLabel" class="zoom-label">第 1 / 30 頁</span><button id="zoomClose" class="close">×</button></div><div class="zoom-area" id="zoomArea"><img id="zoomImage" class="zoom-image" alt="放大筆記"></div></div>
<script>
(()=>{
const TOTAL=30,V='clean30-20260902b',$=id=>document.getElementById(id),cache={},home=$('home'),viewer=$('viewer'),slider=$('pageSlider'),img=$('pageImage'),zimg=$('zoomImage'),stage=$('stage');
let pageNum=Math.min(TOTAL,Math.max(1,Number(localStorage.getItem('exam-notes:admin:page'))||1)),touchX=null,loadToken=0;
const nn=n=>String(n).padStart(2,'0');
async function pageSrc(n){
 if(cache[n])return cache[n];
 if(n<=8)return cache[n]=`assets/admin-clean/page-${nn(n)}.svg?v=${V}`;
 const r=await fetch(`assets/admin-clean/page-${nn(n)}.b64?v=${V}`,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
 const b64=(await r.text()).trim();if(!b64.startsWith('UklG'))throw new Error('invalid page');
 return cache[n]=`data:image/webp;base64,${b64}`;
}
async function preload(n){if(n<1||n>TOTAL||cache[n])return;try{await pageSrc(n)}catch(_){}}
async function showPage(n){
 pageNum=Math.min(TOTAL,Math.max(1,Number(n)||1));const token=++loadToken;
 $('cur').textContent=pageNum;slider.value=pageNum;$('prev').disabled=pageNum===1;$('next').disabled=pageNum===TOTAL;$('zoomLabel').textContent=`第 ${pageNum} / ${TOTAL} 頁`;localStorage.setItem('exam-notes:admin:page',pageNum);
 img.classList.add('loading');$('loadMsg').textContent='載入中…';$('loadMsg').classList.remove('hidden');
 try{const src=await pageSrc(pageNum);if(token!==loadToken)return;img.src=src;img.alt=`行政法筆記第 ${pageNum} 頁`;await img.decode().catch(()=>{});$('loadMsg').classList.add('hidden');}
 catch(e){if(token!==loadToken)return;$('loadMsg').textContent='這一頁載入失敗，請重新整理後再試。';}
 finally{if(token===loadToken)img.classList.remove('loading')}
 preload(pageNum-1);preload(pageNum+1);
}
function openAdmin(){home.classList.add('hidden');viewer.classList.remove('hidden');showPage(pageNum)}
function showHome(){viewer.classList.add('hidden');home.classList.remove('hidden');$('zoom').classList.add('hidden')}
async function openZoom(){try{zimg.src=await pageSrc(pageNum);zimg.alt=`行政法筆記第 ${pageNum} 頁放大圖`;$('zoom').classList.remove('hidden');$('zoomArea').scrollTo({top:0,left:0})}catch(_){}}
$('adminBtn').addEventListener('click',openAdmin);$('back').addEventListener('click',showHome);$('prev').addEventListener('click',()=>showPage(pageNum-1));$('next').addEventListener('click',()=>showPage(pageNum+1));slider.addEventListener('input',e=>showPage(e.target.value));$('zoomBtn').addEventListener('click',openZoom);$('zoomClose').addEventListener('click',()=>$('zoom').classList.add('hidden'));
document.querySelectorAll('.subject:not(.ready)').forEach(b=>b.addEventListener('click',()=>{$('emptyTitle').textContent=b.dataset.subject+'筆記尚未上傳';$('empty').classList.remove('hidden')}));$('emptyClose').addEventListener('click',()=>$('empty').classList.add('hidden'));
stage.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{if(touchX===null)return;const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>55)showPage(pageNum+(d<0?1:-1));touchX=null},{passive:true});
window.addEventListener('keydown',e=>{if(viewer.classList.contains('hidden'))return;if(e.key==='ArrowLeft')showPage(pageNum-1);if(e.key==='ArrowRight')showPage(pageNum+1);if(e.key==='Escape')$('zoom').classList.add('hidden')});
})();
</script>
</body></html>
