name: Import original criminal law note page 100

on:
  push:
    paths:
      - '.github/workflows/import-criminal-law-page100.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser downloader
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Download original JPEG from Firestorage and verify
        env:
          SHARE_URL: 'https://firestorage.ai/ja/f/h0OSNMpaf4ka'
          EXPECTED_NAME: 'IMG_2048.jpeg'
          EXPECTED_SIZE: '463055'
          EXPECTED_SHA256: 'b9e48c73052be14fe8c56286fa0dccec0edc05025d093e25382ff43ee3651ee3'
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright

          share = os.environ['SHARE_URL']
          name = os.environ['EXPECTED_NAME']
          out = Path('/tmp/note-original.jpeg')
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(accept_downloads=True)
              page.goto(share, wait_until='domcontentloaded', timeout=120000)
              try:
                  page.wait_for_load_state('networkidle', timeout=30000)
              except Exception:
                  pass
              candidates = [
                  page.get_by_text(name, exact=True),
                  page.locator(f'a:has-text("{name}")'),
                  page.locator(f'text={name}')
              ]
              locator = None
              for candidate in candidates:
                  try:
                      if candidate.count() > 0:
                          locator = candidate.first
                          locator.wait_for(state='visible', timeout=10000)
                          break
                  except Exception:
                      continue
              if locator is None:
                  raise RuntimeError(f'File link not found: {name}')
              href = locator.get_attribute('href')
              if not href:
                  try:
                      href = locator.locator('xpath=ancestor-or-self::a[1]').get_attribute('href')
                  except Exception:
                      pass
              downloaded = False
              try:
                  with page.expect_download(timeout=120000) as d:
                      locator.click()
                  d.value.save_as(str(out))
                  downloaded = True
              except Exception as first_error:
                  if href:
                      target = page.url if href == '#' else urljoin(page.url, href)
                      r = page.request.get(target, timeout=120000)
                      if r.ok:
                          out.write_bytes(r.body())
                          downloaded = True
                  if not downloaded:
                      raise first_error
              browser.close()
          data = out.read_bytes()
          assert len(data) == int(os.environ['EXPECTED_SIZE']), len(data)
          assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_SHA256']
          assert data.startswith(bytes.fromhex('ffd8')) and data.endswith(bytes.fromhex('ffd9'))
          print('Verified original JPEG:', len(data), hashlib.sha256(data).hexdigest())
          PY

      - name: Add original JPEG and update only criminal law total
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/note-original.jpeg')
          destination = Path('exam-notes/assets/criminal-law/page-100.jpg')
          assert not destination.exists(), 'Page 100 already exists; refusing overwrite'
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(source.read_bytes())
          cfg_path = Path('exam-notes/config.js')
          s = cfg_path.read_text(encoding='utf-8')
          anchor = "    criminalLaw: Object.freeze({\n      name: '刑法',\n      total: 99,"
          assert s.count(anchor) == 1, 'Expected existing criminal law total 99'
          updated = s.replace(anchor, anchor.replace('total: 99', 'total: 100'), 1)
          assert "99: 'page-99.png'" in updated
          cfg_path.write_text(updated, encoding='utf-8')
          print('Added page-100.jpg and changed criminal law total 99 to 100')
          PY

      - name: Verify exact source file and total
        env:
          EXPECTED_SIZE: '463055'
          EXPECTED_SHA256: 'b9e48c73052be14fe8c56286fa0dccec0edc05025d093e25382ff43ee3651ee3'
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          data = Path('exam-notes/assets/criminal-law/page-100.jpg').read_bytes()
          assert len(data) == int(os.environ['EXPECTED_SIZE'])
          assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_SHA256']
          s = Path('exam-notes/config.js').read_text(encoding='utf-8')
          assert "    criminalLaw: Object.freeze({\n      name: '刑法',\n      total: 100," in s
          assert "99: 'page-99.png'" in s
          print('Confirmed page 100 original bytes and valid configuration')
          PY

      - name: Delete one-time importer and commit
        run: |
          rm -f .github/workflows/import-criminal-law-page100.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Append original criminal law note page 100'
          git push
