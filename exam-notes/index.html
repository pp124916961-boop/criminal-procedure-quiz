<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#f4efe7">
  <title>考試筆記</title>
  <style>
    :root{--paper:#f4efe7;--paper2:#e9e0d4;--card:#fffdf9;--ink:#211e1b;--muted:#746d65;--line:#d8cec1;--accent:#7d3d30;--shadow:0 18px 55px rgba(66,48,36,.13)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--paper);overscroll-behavior:none}button,input{font:inherit}.hidden{display:none!important}button{touch-action:manipulation}
    #home{height:100dvh;overflow:hidden;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));background:radial-gradient(circle at 15% 8%,#fff 0,transparent 26%),linear-gradient(145deg,var(--paper),var(--paper2))}
    .home-card{width:min(520px,100%);height:min(740px,100%);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(8px,1.8vh,16px)}
    .brand{display:flex;align-items:center;gap:13px;padding:2px 3px}.mark{width:50px;height:50px;border-radius:16px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:serif;font-size:27px;box-shadow:0 10px 25px rgba(0,0,0,.13)}.eyebrow{margin:0 0 3px;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.16em}.brand h1{margin:0;font-family:serif;font-size:clamp(30px,5.3vh,44px);line-height:1.04;letter-spacing:.05em}
    .subjects{display:grid;grid-template-rows:repeat(6,minmax(42px,1fr));gap:clamp(6px,1vh,10px);min-height:0}.subject{border:1px solid var(--line);border-radius:16px;background:rgba(255,253,249,.9);padding:0 18px;display:flex;align-items:center;text-align:left;font-size:clamp(16px,2.35vh,20px);font-weight:850;color:var(--ink);box-shadow:0 6px 18px rgba(58,44,33,.055);cursor:pointer}.subject:active{transform:scale(.987)}.subject.ready{border-color:#c9ae9d;background:#fff9f4}.arrow{margin-left:auto;color:#a1978d;font-size:27px;font-weight:400}.tag{margin-left:auto;background:#eadbd0;color:var(--accent);font-size:11px;font-weight:900;border-radius:999px;padding:4px 8px}.subject.ready .arrow{margin-left:8px}.foot{text-align:center;color:var(--muted);font-size:10px;margin:0}
    #viewer{height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#ccc7c0}.viewer-head{height:62px;padding:max(7px,env(safe-area-inset-top)) 10px 6px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:rgba(255,253,249,.98);border-bottom:1px solid var(--line);z-index:4}.viewer-title{text-align:center}.viewer-title p{margin:0 0 2px;font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--accent)}.viewer-title h2{margin:0;font-family:serif;font-size:21px;line-height:1}.icon{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);display:grid;place-items:center;font-size:27px;cursor:pointer}.plus{font-size:23px}
    .stage{position:relative;min-height:0;overflow:hidden;display:grid;place-items:center;padding:7px;background:linear-gradient(180deg,#d7d3cd,#c8c2ba)}#noteImage{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.18);border-radius:2px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(205,200,193,.72);z-index:3}.load-card{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:var(--shadow);text-align:center;min-width:180px}.spinner{width:28px;height:28px;border:3px solid #ddd2c7;border-top-color:var(--accent);border-radius:50%;animation:spin .72s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}.load-title{font-weight:900;font-size:14px}.load-sub{margin-top:4px;color:var(--muted);font-size:11px}
    .controls{background:rgba(255,253,249,.99);border-top:1px solid var(--line);padding:8px 11px calc(8px + env(safe-area-inset-bottom));z-index:4}.pager{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center}.nav{height:39px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:850;cursor:pointer}.nav:disabled{opacity:.34}.counter{min-width:76px;text-align:center;color:var(--muted);font-size:13px}.counter strong{color:var(--ink);font-size:18px}.slide{display:grid;grid-template-columns:22px 1fr 28px;align-items:center;gap:7px;margin-top:7px}.edge{font-size:10px;text-align:center;color:var(--muted);font-weight:800}#pageSlider{appearance:none;-webkit-appearance:none;width:100%;height:23px;background:transparent;margin:0}#pageSlider::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:#d9cfc4}#pageSlider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:2px solid white;margin-top:-7.5px;box-shadow:0 2px 7px rgba(0,0,0,.2)}#pageSlider::-moz-range-track{height:5px;border-radius:99px;background:#d9cfc4}#pageSlider::-moz-range-thumb{width:18px;height:18px;border:2px solid white;border-radius:50%;background:var(--accent)}
    .modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(31,27,24,.5);padding:22px;backdrop-filter:blur(5px)}.modal-card{width:min(340px,100%);background:var(--card);border-radius:22px;padding:24px;text-align:center;box-shadow:var(--shadow)}.modal-card h3{margin:0 0 8px;font-size:20px}.modal-card p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.55}.ok{width:100%;height:44px;border:0;border-radius:13px;background:var(--ink);color:#fff;font-weight:900}
    #zoom{position:fixed;inset:0;z-index:30;background:#171615;display:grid;grid-template-rows:50px minmax(0,1fr)}.zoom-bar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;background:#201f1e}.zoom-label{font-size:12px;font-weight:850}.close{width:38px;height:38px;border:0;border-radius:11px;background:#353331;color:#fff;font-size:26px}.zoom-area{overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;touch-action:pan-x pan-y pinch-zoom}.zoom-area img{display:block;width:1432px;max-width:none;height:auto;margin:0 auto;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.4)}
    @media(max-height:610px){.home-card{gap:6px}.mark{width:42px;height:42px;border-radius:13px;font-size:23px}.brand h1{font-size:28px}.subjects{gap:5px}.subject{font-size:15px;border-radius:13px}.foot{display:none}.viewer-head{height:54px}.controls{padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom))}.nav{height:34px}.slide{margin-top:3px}}
  </style>
</head>
<body>
  <main id="home">
    <section class="home-card">
      <header class="brand"><div class="mark">筆</div><div><p class="eyebrow">EXAM NOTES</p><h1>考試筆記</h1></div></header>
      <nav class="subjects" aria-label="科目">
        <button class="subject" data-subject="憲法">憲法<span class="arrow">›</span></button>
        <button class="subject" data-subject="警察法規">警察法規<span class="arrow">›</span></button>
        <button class="subject" data-subject="警察勤務">警察勤務<span class="arrow">›</span></button>
        <button class="subject" data-subject="刑事訴訟法">刑事訴訟法<span class="arrow">›</span></button>
        <button class="subject" data-subject="刑法">刑法<span class="arrow">›</span></button>
        <button class="subject ready" id="adminBtn">行政法<span class="tag">30 頁</span><span class="arrow">›</span></button>
      </nav>
      <p class="foot">其他科目之後上傳筆記即可直接加入。</p>
    </section>
  </main>

  <main id="viewer" class="hidden">
    <header class="viewer-head">
      <button id="back" class="icon" aria-label="返回首頁">‹</button>
      <div class="viewer-title"><p>考試筆記</p><h2>行政法</h2></div>
      <button id="zoomBtn" class="icon plus" aria-label="放大">＋</button>
    </header>
    <section class="stage" id="stage">
      <img id="noteImage" alt="行政法筆記第 1 頁">
      <div id="loading" class="loading"><div class="load-card"><div class="spinner"></div><div class="load-title">載入行政法筆記</div><div id="loadSub" class="load-sub">正在準備第 1 頁…</div></div></div>
    </section>
    <section class="controls">
      <div class="pager"><button id="prev" class="nav">上一頁</button><div class="counter"><strong id="cur">1</strong> / <span>30</span></div><button id="next" class="nav">下一頁</button></div>
      <div class="slide"><span class="edge">1</span><input id="pageSlider" type="range" min="1" max="30" value="1" step="1" aria-label="快速跳頁"><span class="edge">30</span></div>
    </section>
  </main>

  <div id="empty" class="modal hidden"><div class="modal-card"><h3 id="emptyTitle">筆記尚未上傳</h3><p>這個科目的筆記之後上傳後，我可以直接接進來。</p><button id="emptyClose" class="ok">知道了</button></div></div>
  <div id="zoom" class="hidden"><div class="zoom-bar"><span id="zoomLabel" class="zoom-label">第 1 / 30 頁</span><button id="zoomClose" class="close">×</button></div><div class="zoom-area" id="zoomArea"><img id="zoomImage" alt="放大的行政法筆記"></div></div>

  <script>
    const TOTAL=30,$=id=>document.getElementById(id);
    const home=$('home'),viewer=$('viewer'),image=$('noteImage'),slider=$('pageSlider'),loading=$('loading');
    let pageNum=Math.min(TOTAL,Math.max(1,Number(localStorage.getItem('exam-notes:admin:page'))||1));
    let touchX=null,renderToken=0;
    const pageUrl=n=>`assets/admin-pages/page-${String(n).padStart(2,'0')}.jpg`;

    function updateControls(){
      $('cur').textContent=pageNum;slider.value=pageNum;$('prev').disabled=pageNum===1;$('next').disabled=pageNum===TOTAL;
      $('zoomLabel').textContent=`第 ${pageNum} / ${TOTAL} 頁`;localStorage.setItem('exam-notes:admin:page',pageNum);
    }
    function preload(n){if(n<1||n>TOTAL)return;const img=new Image();img.src=pageUrl(n)}
    function showPage(n){
      pageNum=Math.min(TOTAL,Math.max(1,Number(n)||1));updateControls();
      const token=++renderToken;loading.classList.remove('hidden');$('loadSub').textContent=`正在準備第 ${pageNum} 頁…`;
      const loader=new Image();
      loader.onload=()=>{if(token!==renderToken)return;image.src=loader.src;image.alt=`行政法筆記第 ${pageNum} 頁`;loading.classList.add('hidden');preload(pageNum-1);preload(pageNum+1)};
      loader.onerror=()=>{if(token!==renderToken)return;$('loadSub').textContent='此頁載入失敗，請重新整理再試一次。'};
      loader.src=pageUrl(pageNum);
    }
    function go(d){showPage(pageNum+d)}
    function showHome(){viewer.classList.add('hidden');home.classList.remove('hidden');$('zoom').classList.add('hidden')}
    function openAdmin(){home.classList.add('hidden');viewer.classList.remove('hidden');showPage(pageNum)}
    function openZoom(){$('zoomImage').src=pageUrl(pageNum);$('zoomImage').alt=`放大的行政法筆記第 ${pageNum} 頁`;$('zoom').classList.remove('hidden');$('zoomArea').scrollTo({top:0,left:Math.max(0,(1432-window.innerWidth)/2)})}

    $('adminBtn').onclick=openAdmin;
    document.querySelectorAll('.subject:not(.ready)').forEach(b=>b.onclick=()=>{$('emptyTitle').textContent=`${b.dataset.subject}筆記尚未上傳`;$('empty').classList.remove('hidden')});
    $('emptyClose').onclick=()=>$('empty').classList.add('hidden');$('empty').onclick=e=>{if(e.target===$('empty'))$('empty').classList.add('hidden')};
    $('back').onclick=showHome;$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
    slider.oninput=e=>{$('cur').textContent=e.target.value};slider.onchange=e=>showPage(e.target.value);
    $('zoomBtn').onclick=openZoom;image.ondblclick=openZoom;$('zoomClose').onclick=()=>$('zoom').classList.add('hidden');
    $('stage').addEventListener('touchstart',e=>touchX=e.changedTouches[0]?.clientX??null,{passive:true});
    $('stage').addEventListener('touchend',e=>{if(touchX==null)return;const dx=(e.changedTouches[0]?.clientX??touchX)-touchX;touchX=null;if(Math.abs(dx)>55)go(dx<0?1:-1)},{passive:true});
    window.addEventListener('keydown',e=>{if(!$('zoom').classList.contains('hidden')){if(e.key==='Escape')$('zoom').classList.add('hidden');return}if(viewer.classList.contains('hidden'))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);if(e.key==='Escape')showHome()});
    updateControls();
  </script>
</body>
</html>
