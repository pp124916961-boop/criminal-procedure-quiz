<script>const QUESTIONS=[{"source":"114年一般警察特考四等－法學知識第1題","chapter":"基本權總論","q":"依司法院大法官解釋之意旨，下列何者非各該憲法基本權利之保障範圍？","opts":["依憲法之訴訟權保障，人民於其權利遭受侵害時，得依正當法律程序請求法院救濟","基於憲法第11條關於講學自由之規定，保障大學自治，大學得不設軍事室","基於憲法之服公職權，公務人員依法銓敘取得之官等俸級","本於憲法之平等權，人民受他人歧視時應得依法向其請求民事賠償"],"ans":3,"law":"基本權保障範圍","exp":"平等權主要拘束國家公權力；私人間歧視是否產生民事賠償請求，須有私法或特別法依據，不能直接由憲法第7條導出。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第2題","chapter":"生存權","q":"依司法院大法官解釋，下列何者與生存權的保障無關？","opts":["有關工資、工作時間、休息、休假、退休、職業災害補償等勞工勞動條件之最低標準","依三七五減租條例訂定之農地租約中，承租人全年家庭生活費用之認定標準","藥害救濟制度中，對於受藥害者給予補償的範圍界定","公立學校教職員退休後再任公立學校教職員，其重行退休時的年資計算標準"],"ans":3,"law":"憲法第15條生存權","exp":"退休後再任之年資計算主要涉及公法上財產利益與制度形成，與維持最低生存保障的生存權較無直接關係。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第3題","chapter":"結社自由／政黨","q":"依憲法增修條文及相關法律規定，政黨的行為如危害中華民國的存在，而擬聲請解散之，應由何機關提出？何機關審理？","opts":["內政部提出、行政院審理","內政部提出、憲法法庭審理","行政院提出、最高行政法院審理","行政院提出、憲法法庭審理"],"ans":1,"law":"憲法增修條文第5條、政黨法","exp":"政黨違憲解散案件由主管機關內政部聲請，憲法法庭審理。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第6題","chapter":"居住自由","q":"有關憲法居住自由之保障，下列敘述何者錯誤？","opts":["憲法上的居住自由強調的是住宅的不可侵犯性","都市更新事項僅涉及人民財產權保障，與居住自由無涉","居住自由的保護法益，係保障生活空間的隱私權","人民的居住自由不能衍生出擁有住宅權利"],"ans":1,"law":"憲法第10條","exp":"都市更新可能同時影響住宅生活空間，因此除財產權外，也可能涉及居住自由。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第7題","chapter":"秘密通訊自由","q":"依據司法院釋字第631號解釋意旨，下列何者可能侵害憲法保障之秘密通訊自由？","opts":["檢調機關掛線監聽前未依法申請監聽票","警察徵用人民私人通訊設備未依法補償其費用","公立學校禁止學生攜帶手機到校","郵政公司要求寄件者切結包裹內不含爆裂物"],"ans":0,"law":"憲法第12條、釋字第631號","exp":"通訊監察直接介入通訊內容與過程，須符合嚴格法律及程序要件。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第8題","chapter":"宗教自由","q":"下列何者違反國家對宗教之中立及寬容原則？","opts":["甲為天主教會設立之私立中學，教育部依法對其所屬教師參加教學研習核發補助金","乙因宗教因素拒絕手持殺傷性武器，因此向內政部申請服替代役獲准","丙為全台知名廟宇，當地政府為推廣觀光，而將丙廟宇之介紹收錄於由其觀光局所管理之導覽網站","丁為地方政府首長，本身為虔誠佛教徒，因此長期以公費供奉其轄區內特定寺廟，並於主持會議時向下屬宣傳教義"],"ans":3,"law":"憲法第13條、宗教中立","exp":"以公費長期供奉特定宗教並在公務會議宣傳教義，逾越國家對宗教應保持中立之界線。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第9題","chapter":"平等權","q":"下列何種分類標準，從未在我國釋憲實務中被審查？","opts":["生理性別","宗教信仰","種族","面貌五官"],"ans":3,"law":"憲法第7條平等權","exp":"考試當年度釋憲實務已處理性別、宗教及種族等分類；本題答案為面貌五官。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第10題","chapter":"訴訟權","q":"人民對於確定終局裁判所適用之法令，經司法院解釋宣告違憲，釋憲聲請人據以提起再審之訴者，其再審最長期間5年之計算，應否扣除聲請案繫屬司法院大法官審理之期間？","opts":["不應扣除","應予扣除","由檢察官定執行刑","視情形而定"],"ans":1,"law":"憲法第16條、釋憲救濟","exp":"為使釋憲聲請人獲得有效救濟，相關期間計算應扣除案件繫屬憲法審判之期間。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第11題","chapter":"遷徙自由","q":"有關憲法第10條保障遷徙自由之敘述，下列何者正確？","opts":["外國人合法進入我國國境後，不受遷徙自由保障","強制合法入境之大陸地區人民出境，與遷徙自由保障無涉","對在國內無戶籍之我國國民進入國境，予以限制，與憲法保障遷徙自由之意旨不符","國家為確保稅收，依法限制欠稅者出境，與憲法保障遷徙自由之意旨並無牴觸"],"ans":3,"law":"憲法第10條、釋字第345號等","exp":"依法對達一定條件之欠稅者限制出境，實務曾認在合於比例原則時不牴觸遷徙自由。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第12題","chapter":"平等權／參政權","q":"有關立法院立法委員選舉，各政黨依得票率選出之當選名單中婦女之席次數，下列敘述何者正確？","opts":["不得低於2分之1","應過半數","應與男性當選人之席位相同","不得低於3分之2"],"ans":0,"law":"憲法增修條文第4條","exp":"全國不分區及僑居國外國民立委，各政黨當選名單中婦女不得低於二分之一。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第13題","chapter":"受教權","q":"按人民受教育之權利，依其憲法規範基礎之不同，可區分為「受國民教育之權利」及「受國民教育以外教育之權利」。有關前述二種權利，下列敘述何者正確？","opts":["此二種權利皆兼有義務之性質","只有「受國民教育之權利」兼有義務之性質","只有受「國民教育以外教育之權利」兼有義務之性質","此二種權利皆僅有權利之性質"],"ans":1,"law":"憲法第21條","exp":"憲法第21條將國民教育同時規定為人民之權利與義務；國民教育以外教育則不具有同樣義務性。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第14題","chapter":"一般行為自由","q":"吊銷駕駛執照處分，可能影響駕駛何種權利？","opts":["平等權","人身自由","居住遷徙自由","一般行為自由"],"ans":3,"law":"憲法第22條一般行為自由","exp":"駕車屬一般行為自由的一種實現方式，吊銷駕照可能限制此項自由。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第22題","chapter":"新聞採訪自由／一般行為自由","q":"依司法院大法官解釋，記者跟追採訪所涉及之憲法保障，下列敘述何者錯誤？","opts":["行動自由雖為憲法所保障，尚非不得以法律或法律明確授權之命令予以適當之限制","限制新聞採訪者進行跟追，涉及記者行動自由之限制","只要在公共場域，被跟追者就沒有不受侵擾之行動自由","大眾所關切並具一定公益性之事務，而具有新聞價值，如須以跟追方式進行採訪，倘依社會通念認非不能容忍者，即具正當理由"],"ans":2,"law":"釋字第689號","exp":"即使身處公共場域，個人仍享有不受持續侵擾之行動自由與隱私利益。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"114年一般警察特考四等－法學知識第31題","chapter":"思想自由","q":"下列何種基本權利不容國家以任何理由侵犯？","opts":["言論自由","遷徙自由","思想自由","結社自由"],"ans":2,"law":"憲法第22條思想自由","exp":"人民內在精神、思想形成領域受絕對保障；言論、遷徙及結社等外部自由則得在憲法要件下受限制。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=401&code=114060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第4題","chapter":"一般行為自由／法律保留","q":"警察機關依行政命令限制人民之行動自由，與下列何者有違？","opts":["法律保留原則","法律明確性原則","比例原則","平等原則"],"ans":0,"law":"法律保留原則","exp":"限制人民自由權利之重要事項，不得僅以欠缺法律依據的行政命令為之。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第5題","chapter":"人身自由／提審","q":"依憲法第8條及相關規定，有關提審制度，下列敘述何者錯誤？","opts":["有關我國人身自由受法院提審制度之法律保障，目前已有提審法加以具體規定","所謂「至遲應於24小時內移送」之時限，應扣除因交通障礙或其他不可抗力之事由所生不得已之遲滯，以及在途解送等時間","人民被法院以外之任何機關逮捕、拘禁時，其本人或他人均得向逮捕、拘禁所在地之地方法院聲請提審","法院對於提審之聲請，不得拒絕，但得先令逮捕拘禁之機關查覆之"],"ans":3,"law":"憲法第8條、提審法","exp":"提審制度強調迅速的司法審查，法院不得先以命拘禁機關查覆作為拖延審查之前置。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第6題","chapter":"言論自由／商業性言論","q":"菸害防制法禁止以茶會、餐會、說明會、品嚐會、演唱會、演講會、體育或公益等活動，或其他類似之宣傳方式，促銷菸品或為菸品廣告。依大法官解釋意旨，下列敘述何者正確？","opts":["該規定過度限制菸品業者之商業言論，違反比例原則，違憲","對同樣損害人體健康之檳榔及酒類並無類似規定，故該規定違反平等原則，違憲","該規定針對菸品業者之表意人身分所為之分類及差別待遇，與追求國民健康之目的間有合理關聯，合憲","該規定係為追求特別重要之公共利益目的，其與目的之達成間具直接及絕對必要關聯，合憲"],"ans":2,"law":"憲法第11條商業性言論、平等權","exp":"釋憲實務容許為維護國民健康，對菸品促銷及廣告施以較嚴格限制。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第7題","chapter":"秘密通訊自由","q":"下列何者非屬對秘密通訊自由之限制？","opts":["監獄管理人員以維護監獄安全紀律為由，閱讀刪除受刑人之郵件","通訊主管機關依法過濾性交易網頁資訊並限制未成年人存取","法院依刑事訴訟法裁定限制辯護人與被告互通書信","戒嚴時期最高司令官依戒嚴法拆閱、扣留或沒收郵信電報"],"ans":1,"law":"憲法第12條","exp":"過濾公開網頁內容主要涉及資訊接近、言論或網路使用，而不是特定人彼此秘密通訊內容遭介入。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第8題","chapter":"宗教自由","q":"依據司法院釋字第460號及第490號解釋意旨，下列何者不在憲法對宗教信仰自由之保障範圍內？","opts":["國家不對宗教活動收益課稅","個人拒絕信仰任何宗教之自由","各宗教信仰於國家法律前一律平等","教會對捐助財產之自由處分權"],"ans":0,"law":"憲法第13條","exp":"宗教自由並不當然導出宗教活動收益免稅之憲法權利。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第9題","chapter":"集會自由","q":"因不可預見之重大緊急事故而擬舉行偶發性集會，下列敘述何者正確？","opts":["仍須6日前事先申請","仍應於2日前提出申請","不受6日前申請之限制","不予許可"],"ans":2,"law":"憲法第14條、集會遊行法","exp":"偶發性集會因事先無從預見，不受通常六日前申請期限的限制。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第10題","chapter":"平等權","q":"關於憲法平等權，下列敘述何者錯誤？","opts":["憲法第7條規定之禁止歧視事由僅屬例示規定，並不以此為限","「等者等之，不等者不等之」，依此法理絕對禁止任何差別對待","平等並非指絕對式、機械式、齊頭式平等","平等係保障人民在法律上地位之實質平等"],"ans":1,"law":"憲法第7條","exp":"平等原則禁止無正當理由的差別待遇，而不是絕對禁止所有差別待遇。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第11題","chapter":"財產權／公益徵收","q":"依司法院大法官解釋，有關公益徵收，下列敘述何者錯誤？","opts":["國家為開發工業區，以徵收方式取得土地後，將其售予私人，係屬公益徵收之類型","國家得基於非公用之其他公益目的，徵收人民財產","國家以利用土地資源、促進地區發展並利建設經費取得之目的，徵收興辦交通事業所必須以外之毗鄰土地，係屬違憲","依法徵收大眾捷運系統需用之土地，得於同一計畫中辦理聯合開發"],"ans":3,"law":"憲法第15條財產權、公益徵收","exp":"徵收本身須符合公共利益與必要性；不能因徵收捷運需用地，就當然將聯合開發納入同一徵收計畫。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第12題","chapter":"工作權／職業自由","q":"依司法院大法官解釋意旨，有關憲法保障工作權及職業自由的敘述，下列何者錯誤？","opts":["憲法第15條規定人民之工作權應予保障，係指人民得自由選擇工作及職業，以維持生計","勞動基準法關於最低工資之規定，係為落實憲法保障人民工作權意旨而制定之法律","人民開設電子遊藝場之營業自由，同時受到憲法工作權及財產權之保障","擔任公益、非營利或無給職性質之人民團體理事、監事等職業，並不屬於憲法工作權所保障之範疇"],"ans":3,"law":"憲法第15條、釋字第659號等","exp":"職業自由不因公益、非營利或無給職性質即排除於工作權保障範圍。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第13題","chapter":"參政權／平等權","q":"有關非政黨推薦之總統、副總統候選人，須依總統副總統選舉罷免法滿足連署門檻及繳交保證金之規定，下列敘述何者錯誤？","opts":["該規定影響人民受憲法保障之被選舉權","其規範目的係為防止人民任意參與總統、副總統之選舉，耗費社會資源","繳交保證金不當限制未受政黨推薦之總統、副總統候選人之被選舉權","連署門檻之限制，尚未造成不合理之差別待遇，不違反選舉平等原則"],"ans":2,"law":"釋字第468號","exp":"保證金制度與連署門檻在該解釋中未被認定為對被選舉權的不當限制。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"113年一般警察特考四等－法學知識第15題","chapter":"受教權","q":"依憲法第160條第2項規定，已逾學齡而未受基本教育之國民，一律接受下列何項教育？","opts":["基本教育","基礎教育","進修教育","補習教育"],"ans":3,"law":"憲法第160條第2項","exp":"憲法明文規定已逾學齡未受基本教育之國民，一律受補習教育。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=113060&q=1&s=0506&t=Q"},{"source":"112年一般警察特考四等－法學知識第2題","chapter":"受教權","q":"下列關於實施國民教育之具體規定，何者未見諸憲法及增修條文？","opts":["學齡國民之基本教育、已逾學齡而未受基本教育之國民之補習教育，一律免費","6歲至15歲之國民，應受國民教育","各級政府應廣設獎學金名額，以扶助學行俱優無力升學之學生","國民教育之經費應優先編列"],"ans":1,"law":"憲法第160條、增修條文第10條","exp":"憲法本文原規定6歲至12歲應受基本教育；九年國教的6至15歲制度並非以同一文字直接寫入憲法及增修條文。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第5題","chapter":"人身自由／軍事審判","q":"依憲法及司法院大法官解釋意旨，有關軍事審判制度，下列敘述何者錯誤？","opts":["軍事審判乃基於國家安全與軍事需要，對軍人之犯罪行為所設立之特別訴訟程序","憲法明文規定現役軍人應受軍事審判","非現役軍人不受軍事審判之保障，包括不受軍事檢察官之刑事訴追","非現役軍人不論平時或戰時，皆不受軍事審判"],"ans":1,"law":"憲法第9條","exp":"憲法第9條是以『人民除現役軍人外，不受軍事審判』作消極規定，並非明文命令現役軍人一律應受軍事審判。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第6題","chapter":"講學自由／大學自治","q":"依司法院大法官解釋，學術自由之保障，應自大學組織與其他建制方面，加以確保，此屬學理上所稱之何種基本權功能？","opts":["程序保障功能","制度保障功能","受益功能","參與功能"],"ans":1,"law":"憲法第11條、大學自治","exp":"透過大學組織與制度設計確保學術自由，屬制度性保障功能。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第7題","chapter":"宗教自由","q":"從憲法第13條信仰宗教自由可導出「宗教中立」與「宗教平等」原則，關於其原則之內涵，下列敘述何者錯誤？","opts":["國家不得制定法律限制人民之宗教行為自由","國家不得對特定宗教之教義給予優劣評價","國家不得在政府機關網頁宣傳特定宗教之教義","國家不得在政府機關網頁批評特定宗教之教義違反科學理論"],"ans":0,"law":"憲法第13條","exp":"內在信仰受高度保障，但宗教外部行為仍可能在符合憲法第23條要件下受到法律限制。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第8題","chapter":"結社自由","q":"人民團體法規定，特定職業團體之理事長，「由理事就常務理事中選舉一人為理事長，其不設常務理事者，就理事中互選之。」依司法院釋字第733號解釋，上述規定違反下列何項？","opts":["私法自治與平等原則","結社自由與平等原則","私法自治與比例原則","結社自由與比例原則"],"ans":3,"law":"憲法第14條、釋字第733號","exp":"強制限定人民團體理事長之產生方式，過度干預團體內部自主，違反結社自由與比例原則。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第9題","chapter":"平等權","q":"依司法院大法官解釋，關於憲法第7條平等權之保障，下列敘述何者錯誤？","opts":["依據兩岸關係條例，大陸地區配偶設有戶籍滿10年始得擔任公務員之規定，並未違反平等","依據所得稅法，以未滿20歲或滿60歲以上作為減除免稅額限制要件之規定，違反平等","於軍事審判遭受冤獄之受害人不適用冤獄賠償法規定，違反平等","依據原住民族工作權保障法及政府採購法，要求達一定規模之政府採購得標廠商需進用一定比例原住民之規定，違反平等"],"ans":3,"law":"憲法第7條","exp":"原住民進用比例屬為落實原住民族保障所設之優惠性差別待遇，並非當然違反平等。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第10題","chapter":"財產權","q":"共有人請求分割共有物，係受下列何種憲法權利之保障？","opts":["財產權","契約自由","結社自由","一般行為自由"],"ans":0,"law":"憲法第15條財產權","exp":"共有物分割請求關係到所有權人對財產之使用、收益與處分，屬財產權保障。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第11題","chapter":"工作權／表現自由","q":"A直轄市自治條例規定，以藝文表演為職業之街頭藝人，須經該市主管機關核發表演許可證，始得在該市之公共空間從事藝文表演。有關上開規定，下列敘述何者正確？","opts":["此規定僅限制街頭藝人從事工作之地點，尚不構成對職業自由之限制","此規定構成對職業自由之限制，但職業自由之限制僅能以法律定之，故違反法律保留原則","此規定不構成對表現自由之限制","此規定構成對職業自由之限制，其得授權地方行政機關對此限制事宜訂定自治規則為具體規範"],"ans":3,"law":"釋字第806號、法律保留","exp":"地方自治事項涉及居民自由權利限制時，可由自治條例規範，或由自治條例明確授權自治規則具體化。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第12題","chapter":"訴訟權","q":"訴訟權旨在確保人民之權利受侵害時，享有依法向法院提起適時審判的請求權，包含聽審、公正程序、公開審判請求權及下列何者？","opts":["社會福利請求權","經濟資源分配權","程序上之平等權","人性尊嚴保障權"],"ans":2,"law":"憲法第16條","exp":"訴訟權包括人民在司法程序中獲得公平、平等程序待遇的保障。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第13題","chapter":"受教權","q":"憲法上有關國民受教育之規定，下列敘述何者錯誤？","opts":["人民受國民教育既係權利也是義務","人民受基本教育，免納學費","6歲至15歲之學齡兒童，一律受基本教育","國家對於全國公私立教育文化機關，有監督之權"],"ans":2,"law":"憲法第21條、第160條","exp":"憲法本文的基本教育年齡文字為6歲至12歲；現行九年國教制度來自法律制度擴充，不能把6至15歲說成憲法本文原文。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第15題","chapter":"人格權","q":"有關人格權，下列敘述何者錯誤？","opts":["人格權為維護個人主體性及人格自由發展所必要","人格權的發展沒有年齡、性別的限制","人格權不包含知悉自己身世的權利","人格權與人性尊嚴有密切關聯"],"ans":2,"law":"憲法第22條人格權","exp":"知悉自身血統、身世等身分資訊，可能涉及人格權與人格自主之保障。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第16題","chapter":"資訊隱私權","q":"甲私立醫院將前往看診之乙病人的病歷，提供給丙研究機構作為研究之用，下列敘述何者錯誤？","opts":["乙可以向甲主張基本權的第三人效力","甲將病歷提供給丙，因存有公共利益目的，符合比例原則","乙的資訊自決權受到甲的侵害","甲之行為違反蒐集資料之目的而侵害乙的隱私權"],"ans":1,"law":"憲法第22條資訊隱私權、基本權第三人效力","exp":"存在公益目的不代表手段當然符合比例原則，仍須審查必要性與衡量個人資訊自主。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"112年一般警察特考四等－法學知識第17題","chapter":"概括基本權","q":"下列何者並非憲法明文列舉之基本權？","opts":["講學自由","環境權","請願權","秘密通訊自由"],"ans":1,"law":"憲法第22條","exp":"環境權並非憲法本文逐條明文列舉的基本權；其保障基礎須由相關憲法規範與解釋建構。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=112070&q=1&s=0605&t=Q"},{"source":"111年一般警察特考四等－法學知識第2題","chapter":"集會自由","q":"下列何者依法須事先申請集會遊行之許可？","opts":["大型廟會","宗教遶境活動","室外婚喪活動","政黨室外跨年晚會"],"ans":3,"law":"憲法第14條、集會遊行法","exp":"宗教、民俗、婚喪喜慶等法定例外不需申請；政黨一般室外跨年活動不當然屬例外。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=111070&q=1&s=0605&t=Q"},{"source":"111年一般警察特考四等－法學知識第10題","chapter":"人格權／隱私權／言論自由","q":"甲得其妻乙同意，於甲之臉書上公開乙泡湯時所拍攝之上半身裸照，並註明：「老婆，妳最美」。請問本例不涉及下列何項人民基本權利？","opts":["乙之人格自由","乙之資訊隱私權","甲之言論自由","乙之身體自由"],"ans":3,"law":"憲法第11條、第22條","exp":"公開照片涉及表意、人格與資訊隱私，但並未對乙的人身自由或身體行動自由施加拘束。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=111070&q=1&s=0605&t=Q"},{"source":"111年一般警察特考四等－法學知識第15題","chapter":"居住遷徙自由","q":"依司法院大法官解釋，關於憲法第10條居住遷徙自由之保障，不包含下列何者？","opts":["選擇其居住處所之自由","後備軍人不向國家申報其居住處所遷移之自由","依個人意願旅行及移居各地之權利","於居住處所營私人生活之自由"],"ans":1,"law":"憲法第10條","exp":"後備軍人依法申報居住遷移屬兵役管理義務，不能由遷徙自由導出拒絕申報的權利。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=111070&q=1&s=0605&t=Q"},{"source":"111年一般警察特考四等－法學知識第16題","chapter":"概括基本權","q":"依歷年司法院大法官解釋，下列何者並非憲法第22條所保障之未列舉權利？","opts":["隱私權","姓名權","新聞自由","性行為自由"],"ans":2,"law":"憲法第11條、第22條","exp":"新聞自由主要由憲法第11條言論及出版自由體系保障；其餘選項均曾由第22條未列舉權利加以保障。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=111070&q=1&s=0605&t=Q"},{"source":"111年一般警察特考四等－法學知識第17題","chapter":"平等權","q":"依司法院大法官解釋意旨，關於憲法第7條之規定，下列敘述何者正確？","opts":["保障主體僅限於「中華民國人民」，故其屬國民權之類型","於法律明文規定之範圍內，法人得主張平等權","在本質上合適之範圍內，法人亦得主張平等權","非中華民國人民是否得主張平等權，應適用互惠原則進一步加以判斷"],"ans":2,"law":"憲法第7條","exp":"法人若依基本權性質適合，也可成為平等權主體；平等權並非僅限自然人。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=111070&q=1&s=0605&t=Q"},{"source":"111年一般警察特考四等－法學知識第19題","chapter":"工作權／職業自由","q":"依司法院大法官解釋，關於專門職業及技術人員，下列敘述何者錯誤？","opts":["專門職業及技術人員執業資格，應經考試院依法考選銓定","某項職業屬於專門職業之認定，應以法律定之","關於某項職業是否為專門職業之認定，立法機關有完全形成自由","專門職業及技術人員應具備經由現代教育或訓練之培養過程所獲得之特殊學識或技能"],"ans":2,"law":"憲法第15條、第86條","exp":"立法者對專門職業之界定仍受憲法工作權、比例原則與考試權制度界線拘束，並非有完全不受審查的形成自由。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=404&code=111070&q=1&s=0605&t=Q"},{"source":"111年司法人員特考四等－法學知識與英文第3題","chapter":"人身自由","q":"依憲法第8條及相關大法官解釋意旨，關於人身自由，下列敘述何者錯誤？","opts":["除現行犯之逮捕與拘禁外，僅限於警察機關始得依法定程序執行逮捕與拘禁","憲法第8條第1項所稱之警察機關，並不限於組織法上形式意義之「警察」","違警罰法之前數度遭大法官宣告違憲，主因就是該法諸多條文牴觸憲法第8條有關人身自由保障之規定","憲法第8條第1項所稱之司法機關，包括檢察機關"],"ans":0,"law":"憲法第8條","exp":"憲法所稱警察機關採實質意義，不限於組織法上警察；依法有拘捕權限之機關不只形式上的警察機關。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=202&code=111130&q=1&s=0206&t=Q"},{"source":"111年司法人員特考四等－法學知識與英文第4題","chapter":"宗教自由","q":"依據司法院釋字第573號解釋之意旨，關於憲法對宗教信仰自由之保障，下列敘述何者錯誤？","opts":["人民所從事之宗教行為與其內心宗教信念無法截然二分，均應受憲法絕對之保障","宗教團體就其財產之處分，同時受憲法財產權與信仰自由之保障","宗教性結社，就其內部組織結構、人事及財政管理應享有自主權","國家對宗教應謹守中立及寬容原則，不得對特定之宗教加以獎勵或禁制"],"ans":0,"law":"憲法第13條、釋字第573號","exp":"內在信仰受絕對保障，但宗教外部行為並非一律不受法律限制。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=202&code=111130&q=1&s=0206&t=Q"},{"source":"111年司法人員特考四等－法學知識與英文第5題","chapter":"平等權／工作權","q":"關於原住民族工作權保障法規定，依政府採購法得標之廠商，於國內員工總人數逾100人者，應於履約期間僱用原住民，其人數不得低於總人數百分之一，下列敘述何者錯誤？","opts":["此為立法者對原住民所為之優惠性差別待遇","此規定將影響得標廠商之營業自由","此規定符合憲法增修條文第10條保障原住民地位之精神","此規定違反憲法第7條平等原則之要求"],"ans":3,"law":"憲法第7條、第15條、增修條文第10條","exp":"原住民族進用保障具有扶助弱勢、落實實質平等之目的，實務並未認定其違反平等原則。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=202&code=111130&q=1&s=0206&t=Q"},{"source":"111年司法人員特考四等－法學知識與英文第8題","chapter":"新聞採訪自由／一般行為自由","q":"依司法院釋字第689號解釋意旨，社會秩序維護法對新聞採訪者之跟追行為有一定的限制，旨在衡平跟追者的新聞採訪自由與被跟追者之何種自由？","opts":["結社自由","言論自由","遷徙自由","一般行為自由"],"ans":3,"law":"釋字第689號","exp":"跟追採訪限制在新聞採訪自由與被跟追人的一般行為自由、隱私利益間進行衡量。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=202&code=111130&q=1&s=0206&t=Q"},{"source":"106年普通考試－法學知識與英文第5題","chapter":"訴訟權","q":"依據司法院釋字第574號解釋，下列何者為憲法第16條訴訟權之核心內容？","opts":["訴訟審級制度","律師強制代理制度","符合正當法律程序之法院救濟","提起上訴之要件"],"ans":2,"law":"憲法第16條、釋字第574號","exp":"訴訟權核心是人民權利受侵害時，得請求法院依正當法律程序為公平有效救濟；審級與上訴要件則有立法形成空間。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=409&code=106090&q=1&s=0211&t=Q"},{"source":"106年普通考試－法學知識與英文第6題","chapter":"參政權／平等權","q":"總統副總統選舉罷免法規定，非政黨推薦之總統與副總統候選人須取得一定人數的連署並繳交保證金。依司法院釋字第468號解釋，下列敘述何者正確？","opts":["關於繳交保證金之規定，過度限制候選人之財產權，違憲","關於繳交保證金之規定，立法者享有不受限制之形成空間，合憲","關於連署之規定，未違反平等原則，合憲","關於連署之規定，過度限制人民之被選舉權，違憲"],"ans":2,"law":"釋字第468號","exp":"對非政黨推薦候選人設連署門檻，目的在避免選舉資源被恣意耗用，該解釋認其未違反平等原則。","url":"https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=409&code=106090&q=1&s=0211&t=Q"}];</script><script src="https://law-quiz-hub.pp124916961.chatgpt.site/wrong-history.js?v=1"></script><script>
