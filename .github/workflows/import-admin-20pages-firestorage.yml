name: Import 20 administrative law notes from Firestorage

on:
  push:
    paths:
      - '.github/workflows/import-admin-20pages-firestorage.yml'

permissions:
  contents: write

jobs:
  import-admin-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser downloader
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Download exact administrative law ZIP from Firestorage
        env:
          SHARE_URL: 'https://firestorage.ai/ja/f/SBjYuKwtGNX4'
          EXPECTED_NAME: '行政法.zip'
          EXPECTED_SIZE: '4722506'
          EXPECTED_SHA256: 'e3c1a3c96d385d885f1aee0395a12dbc8ca697224c91ed558f24c4347cdb7715'
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from urllib.parse import urljoin

          share = os.environ['SHARE_URL']
          name = os.environ['EXPECTED_NAME']
          out = Path('.tmp/admin-20.zip')
          out.parent.mkdir(parents=True, exist_ok=True)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(accept_downloads=True)
              page.goto(share, wait_until='domcontentloaded', timeout=120000)
              try:
                  page.wait_for_load_state('networkidle', timeout=30000)
              except Exception:
                  pass

              candidates = [
                  page.get_by_text(name, exact=True),
                  page.locator(f'a:has-text("{name}")'),
                  page.locator(f'text={name}')
              ]
              locator = None
              for c in candidates:
                  try:
                      if c.count() > 0:
                          locator = c.first
                          locator.wait_for(state='visible', timeout=10000)
                          break
                  except Exception:
                      continue
              if locator is None:
                  print('PAGE TITLE:', page.title())
                  print('PAGE URL:', page.url)
                  print('BODY PREVIEW:', page.locator('body').inner_text()[:5000])
                  raise RuntimeError(f'Could not find file link: {name}')

              href = None
              try:
                  href = locator.get_attribute('href')
              except Exception:
                  pass
              if not href:
                  try:
                      href = locator.locator('xpath=ancestor-or-self::a[1]').get_attribute('href')
                  except Exception:
                      pass

              downloaded = False
              try:
                  with page.expect_download(timeout=120000) as di:
                      locator.click()
                  di.value.save_as(str(out))
                  downloaded = True
              except Exception as first_error:
                  if href:
                      target = page.url if href == '#' else href
                      if not target.startswith('http'):
                          target = urljoin(page.url, target)
                      r = page.request.get(target, timeout=120000)
                      if r.ok:
                          body = r.body()
                          if body[:2] == b'PK':
                              out.write_bytes(body)
                              downloaded = True
                  if not downloaded:
                      print('PAGE TITLE:', page.title())
                      print('PAGE URL:', page.url)
                      print('CANDIDATE HREF:', href)
                      print('BODY PREVIEW:', page.locator('body').inner_text()[:5000])
                      raise first_error
              browser.close()

          data = out.read_bytes()
          size = len(data)
          sha = hashlib.sha256(data).hexdigest()
          print('Downloaded size:', size)
          print('Downloaded sha256:', sha)
          assert size == int(os.environ['EXPECTED_SIZE']), (size, os.environ['EXPECTED_SIZE'])
          assert sha == os.environ['EXPECTED_SHA256'], (sha, os.environ['EXPECTED_SHA256'])
          assert data[:2] == b'PK', 'Not a ZIP file'
          PY

      - name: Move old pages 31 and 32 to 51 and 52
        run: |
          set -e
          test -f exam-notes/assets/admin-pages/page-31.svg
          test -f exam-notes/assets/admin-pages/page-32.jpg
          test ! -e exam-notes/assets/admin-pages/page-51.svg
          test ! -e exam-notes/assets/admin-pages/page-52.jpg
          mv exam-notes/assets/admin-pages/page-31.svg exam-notes/assets/admin-pages/page-51.svg
          mv exam-notes/assets/admin-pages/page-32.jpg exam-notes/assets/admin-pages/page-52.jpg

      - name: Extract 20 original JPG pages as 31 through 50
        run: |
          python - <<'PY'
          import re, zipfile
          from pathlib import Path

          zpath = Path('.tmp/admin-20.zip')
          outdir = Path('exam-notes/assets/admin-pages')
          outdir.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(zpath) as z:
              names = [n for n in z.namelist() if not n.endswith('/')]
              assert len(names) == 20, f'Expected 20 files, got {len(names)}: {names}'

              numbered = []
              for name in names:
                  m = re.search(r'\((\d+)\)', Path(name).name)
                  assert m, f'Could not determine numeric order from filename: {name}'
                  n = int(m.group(1))
                  assert 1 <= n <= 20, f'Unexpected page number {n} in {name}'
                  data = z.read(name)
                  assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9', f'Not a complete JPEG: {name}'
                  numbered.append((n, name, data))

              nums = sorted(n for n, _, _ in numbered)
              assert nums == list(range(1, 21)), f'Expected filenames numbered 1-20, got {nums}'

              for n, name, data in sorted(numbered):
                  target_page = 30 + n
                  target = outdir / f'page-{target_page:02d}.jpg'
                  target.write_bytes(data)
                  print(f'{name} -> {target} ({len(data)} bytes)')
          PY

      - name: Update Administrative Law total and override
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('exam-notes/config.js')
          s = p.read_text(encoding='utf-8')
          old = "    admin: Object.freeze({\n      name: '行政法',\n      total: 32,\n      directory: 'assets/admin-pages',\n      prefix: 'page-',\n      defaultExtension: 'jpg',\n      // 只有不是一般 JPG 的特殊頁面才需要列在這裡。\n      overrides: Object.freeze({\n        31: 'page-31.svg'\n      })\n    })"
          new = "    admin: Object.freeze({\n      name: '行政法',\n      total: 52,\n      directory: 'assets/admin-pages',\n      prefix: 'page-',\n      defaultExtension: 'jpg',\n      // 只有不是一般 JPG 的特殊頁面才需要列在這裡。\n      overrides: Object.freeze({\n        51: 'page-51.svg'\n      })\n    })"
          if old not in s:
              if new in s:
                  print('Administrative Law config is already updated.')
              else:
                  raise SystemExit('Could not safely locate the existing Administrative Law config block.')
          else:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify final administrative law page layout
        run: |
          python - <<'PY'
          from pathlib import Path
          d = Path('exam-notes/assets/admin-pages')
          for n in range(1, 31):
              assert (d / f'page-{n:02d}.jpg').exists(), f'Missing page {n}'
          for n in range(31, 51):
              p = d / f'page-{n:02d}.jpg'
              assert p.exists(), f'Missing inserted page {n}'
              b = p.read_bytes()
              assert b[:2] == b'\xff\xd8' and b[-2:] == b'\xff\xd9', f'Invalid JPEG page {n}'
          assert (d / 'page-51.svg').exists(), 'Moved old page 31 is missing at page 51'
          p52 = d / 'page-52.jpg'
          assert p52.exists(), 'Moved old page 32 is missing at page 52'
          b = p52.read_bytes()
          assert b[:2] == b'\xff\xd8' and b[-2:] == b'\xff\xd9', 'Page 52 is not a complete JPEG'
          assert not (d / 'page-31.svg').exists(), 'Old page-31.svg should have been moved'
          print('Verified: new pages 31-50, old 31->51, old 32->52')
          PY

      - name: Remove one-time import workflow and temp files
        run: |
          rm -rf .tmp
          rm -f .github/workflows/import-admin-20pages-firestorage.yml

      - name: Commit administrative law pages 31 through 52
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Insert 20 administrative law notes at pages 31-50'
          git push
