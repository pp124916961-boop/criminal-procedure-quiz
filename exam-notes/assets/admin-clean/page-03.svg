<svg xmlns="http://www.w3.org/2000/svg" width="1432" height="2023" viewBox="0 0 1432 2023">
<rect width="100%" height="100%" fill="#fffdfa"/>
<style>text{font-family:'Noto Sans CJK TC','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;dominant-baseline:hanging} .b{font-weight:700} .r{fill:#c83333} .k{fill:#1e1d1b} .g{fill:#766f67}</style>
<text x="190" y="180" font-size="40" fill="#1e1d1b" text-anchor="start">2、移轉要件</text>
<line x1="470" y1="190" x2="470" y2="520" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="470" y1="190" x2="498" y2="190" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="470" y1="520" x2="498" y2="520" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="515" y="170" font-size="35" fill="#1e1d1b" text-anchor="start">委任委託</text>
<line x1="700" y1="185" x2="700" y2="335" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="700" y1="185" x2="728" y2="185" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="700" y1="335" x2="728" y2="335" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="745" y="165" font-size="33" fill="#c83333" text-anchor="start">依法規</text>
<text x="745" y="225" font-size="33" fill="#c83333" text-anchor="start">應公告 and 登報</text>
<text x="745" y="285" font-size="33" fill="#c83333" text-anchor="start">委任託行為</text>
<text x="515" y="390" font-size="35" fill="#1e1d1b" text-anchor="start">委託私人</text>
<text x="515" y="435" font-size="30" fill="#1e1d1b" text-anchor="start">（行政委託）</text>
<line x1="700" y1="395" x2="700" y2="620" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="700" y1="395" x2="728" y2="395" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="700" y1="620" x2="728" y2="620" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="745" y="380" font-size="33" fill="#c83333" text-anchor="start">依法規</text>
<text x="745" y="440" font-size="33" fill="#c83333" text-anchor="start">應公告 and 登報</text>
<text x="745" y="500" font-size="33" fill="#c83333" text-anchor="start">委託行為</text>
<text x="745" y="560" font-size="33" fill="#c83333" text-anchor="start">締約</text>
<text x="130" y="720" font-size="42" fill="#1e1d1b" text-anchor="start">（四）競合</text>
<line x1="280" y1="790" x2="280" y2="965" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="280" y1="790" x2="308" y2="790" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="280" y1="965" x2="308" y2="965" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="330" y="785" font-size="35" fill="#1e1d1b" text-anchor="start">均有管轄：</text>
<text x="555" y="785" font-size="34" fill="#c83333" text-anchor="start">受理在先 → H 協議</text>
<text x="330" y="875" font-size="35" fill="#1e1d1b" text-anchor="start">有爭議</text>
<circle cx="400" cy="900" r="58" fill="none" stroke="#c83333" stroke-width="3"/>
<line x1="470" y1="900" x2="930" y2="900" stroke="#c83333" stroke-width="4" stroke-linecap="round"/>
<line x1="930" y1="900" x2="916.7191434362364" y2="908.9229394782627" stroke="#c83333" stroke-width="4" stroke-linecap="round"/>
<line x1="930" y1="900" x2="916.7191434362364" y2="891.0770605217373" stroke="#c83333" stroke-width="4" stroke-linecap="round"/>
<text x="960" y="855" font-size="31" fill="#c83333" text-anchor="start">
<tspan x="960" dy="0">共同上級</tspan>
<tspan x="960" dy="36">指定</tspan>
</text>
<text x="1165" y="855" font-size="31" fill="#c83333" text-anchor="start">
<tspan x="1165" dy="0">→ 各該上級</tspan>
<tspan x="1165" dy="36">協議</tspan>
</text>
<text x="160" y="1020" font-size="46" fill="#c83333" text-anchor="start">☆</text>
<text x="210" y="1020" font-size="34" fill="#c83333" text-anchor="start">人民得申請指定</text>
<text x="160" y="1085" font-size="46" fill="#c83333" text-anchor="start">☆</text>
<text x="210" y="1085" font-size="34" fill="#c83333" text-anchor="start">向共同上級 or 各該上級其一</text>
<text x="160" y="1150" font-size="46" fill="#c83333" text-anchor="start">☆</text>
<text x="210" y="1150" font-size="34" fill="#c83333" text-anchor="start">指定後人民不能不服</text>
<text x="160" y="1215" font-size="46" fill="#c83333" text-anchor="start">☆</text>
<text x="210" y="1215" font-size="34" fill="#c83333" text-anchor="start">10 日內決定</text>
<text x="140" y="1390" font-size="40" fill="#1e1d1b" text-anchor="start">（五）H 義務</text>
<line x1="450" y1="1370" x2="450" y2="1515" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="450" y1="1370" x2="478" y2="1370" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="450" y1="1515" x2="478" y2="1515" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="495" y="1360" font-size="34" fill="#1e1d1b" text-anchor="start">管轄有無之</text>
<text x="700" y="1360" font-size="34" fill="#c83333" text-anchor="start">應職權調查</text>
<text x="495" y="1440" font-size="34" fill="#1e1d1b" text-anchor="start">通知人民，</text>
<text x="675" y="1440" font-size="34" fill="#c83333" text-anchor="start">移送義務</text>
<text x="140" y="1630" font-size="40" fill="#1e1d1b" text-anchor="start">（六）不停止後轉</text>
<line x1="450" y1="1610" x2="450" y2="1795" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="450" y1="1610" x2="478" y2="1610" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<line x1="450" y1="1795" x2="478" y2="1795" stroke="#1e1d1b" stroke-width="4" stroke-linecap="round"/>
<text x="495" y="1595" font-size="33" fill="#c83333" text-anchor="start">因法規 or 事實變更，喪失管轄</text>
<text x="1050" y="1595" font-size="27" fill="#1e1d1b" text-anchor="start">（不是其他無管轄）</text>
<text x="495" y="1695" font-size="34" fill="#c83333" text-anchor="start">當事人 ＋ 後 H 同意</text>
<line x1="490" y1="1745" x2="920" y2="1745" stroke="#c83333" stroke-width="3" stroke-linecap="round"/>
</svg>