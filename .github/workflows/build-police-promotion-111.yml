name: Build 111 Police Promotion Admin Law

on:
  push:
    paths:
      - '.github/workflows/build-police-promotion-111.yml'
      - 'scripts/build_police_promotion_111.py'
      - 'scripts/reuse_template_police_promotion_111.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q pandas pyarrow
      - name: Build 111 police promotion admin law originals
        run: python scripts/build_police_promotion_111.py
      - name: Reuse fixed quiz program
        run: python scripts/reuse_template_police_promotion_111.py
      - name: Verify
        run: |
          python - <<'PY'
          import json,pathlib,base64,gzip
          root=pathlib.Path('police-promotion-111-admin-law')
          q=json.load(open(root/'questions.json',encoding='utf-8'))
          b=json.load(open(root/'build-summary.json',encoding='utf-8'))
          r=json.load(open(root/'template-reuse-summary.json',encoding='utf-8'))
          assert len(q)==50
          assert b['original_questions_unedited'] is True
          assert r['program_reused'] is True and r['question_count']==50
          parts=['p1.txt','p2.txt','p2b.txt','p3.txt','p4.txt','p5.txt','p6.txt']
          html=gzip.decompress(base64.b64decode(''.join((root/n).read_text() for n in parts))).decode()
          assert q[0]['question'] in html and q[-1]['question'] in html
          assert html.find('id="qSource"') < html.find('id="qTitle"')
          print('verified')
          PY
      - name: Commit generated quiz
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add police-promotion-111-admin-law
          git diff --cached --quiet && exit 0
          git commit -m 'Build 111 police promotion admin-law original quiz'
          git push
