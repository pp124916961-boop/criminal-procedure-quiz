name: Build Constitution Rights 50

on:
  push:
    paths:
      - '.github/workflows/build-constitution-rights-50.yml'
      - 'scripts/reuse_template_constitution_rights_50.py'
      - 'constitution-rights-50/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse police-promotion quiz program
        run: python scripts/reuse_template_constitution_rights_50.py
      - name: Verify exact program family
        run: |
          python - <<'PY'
          import json,pathlib,base64,gzip
          root=pathlib.Path('constitution-rights-50')
          q=json.load(open(root/'questions.json',encoding='utf-8'))
          s=json.load(open(root/'template-reuse-summary.json',encoding='utf-8'))
          assert len(q)==50
          assert s['matches_promotion_admin_law_program'] is True
          assert s['persistent_wrong_history'] is True
          parts=['p1.txt','p2.txt','p2b.txt','p3.txt','p4.txt','p5.txt','p6.txt']
          html=gzip.decompress(base64.b64decode(''.join((root/n).read_text() for n in parts))).decode()
          assert q[0]['question'] in html and q[-1]['question'] in html
          assert html.find('id="qSource"') < html.find('id="qTitle"')
          assert 'wrong-history.js?v=1' in html
          assert 'wrong-history.css?v=1' in html
          assert 'QuizWrongHistory?.mount' in html
          assert 'quizId:"constitution-rights-50"' in html
          assert 'wrongHistory.capture(state)' in html
          assert 'wrongHistory.newRound(state)' in html
          assert 'prevBtn' in html and 'nextBtn' in html
          assert 'retryWrong' in html
          assert 'jump' in html
          print('verified promotion-template constitution quiz')
          PY
      - name: Commit generated quiz
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add constitution-rights-50
          git diff --cached --quiet && exit 0
          git commit -m 'Build Constitution quiz with police-promotion program'
          git push
