<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402"><rect width="100%" height="100%" fill="#fff"/><style>
.t{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#121212;font-weight:400}
.r{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#e71c1c;font-weight:400}
.l{stroke:#121212;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}
.rl{stroke:#e71c1c;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style><text x="75" y="105" font-size="42" class="t" text-anchor="start" dominant-baseline="hanging">十二、送達</text><text x="120" y="235" font-size="35" class="t" text-anchor="start" dominant-baseline="hanging">（一）送達人</text><line x1="350" y1="220" x2="350" y2="385" class="l" stroke-width="3"/><line x1="350" y1="220" x2="374" y2="220" class="l" stroke-width="3"/><line x1="350" y1="345" x2="374" y2="345" class="l" stroke-width="3"/><text x="385" y="200" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">H承辦人</text><text x="560" y="200" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging">（行政H的）</text><text x="385" y="325" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">郵務員</text><text x="385" y="365" font-size="26" class="t" text-anchor="start" dominant-baseline="hanging">（被動郵政H）</text><line x1="670" y1="300" x2="670" y2="420" class="l" stroke-width="3"/><line x1="670" y1="300" x2="693" y2="300" class="l" stroke-width="3"/><line x1="670" y1="400" x2="693" y2="400" class="l" stroke-width="3"/><text x="710" y="285" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">一般</text><text x="710" y="385" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">掛號：</text><text x="815" y="385" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">人民權益重大影響</text><text x="115" y="520" font-size="35" class="t" text-anchor="start" dominant-baseline="hanging">（二）受送達人</text><text x="170" y="620" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">原則</text><line x1="300" y1="595" x2="300" y2="820" class="l" stroke-width="3"/><line x1="300" y1="595" x2="324" y2="595" class="l" stroke-width="3"/><line x1="300" y1="690" x2="324" y2="690" class="l" stroke-width="3"/><line x1="300" y1="785" x2="324" y2="785" class="l" stroke-width="3"/><text x="335" y="575" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">法代</text><text x="335" y="670" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">H、法人、非法人團代表人 or 管理人</text><text x="335" y="765" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging">外國法人（在臺有事務所）代表 or 管理人</text><path d="M910 565 C955 590 955 790 910 815" class="rl" stroke-width="2.5"/><text x="975" y="650" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">僅送對一人</text><text x="1000" y="700" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">即可</text><text x="170" y="895" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">例外</text><line x1="300" y1="865" x2="300" y2="1080" class="l" stroke-width="3"/><line x1="300" y1="865" x2="324" y2="865" class="l" stroke-width="3"/><line x1="300" y1="945" x2="324" y2="945" class="l" stroke-width="3"/><line x1="300" y1="1045" x2="324" y2="1045" class="l" stroke-width="3"/><text x="335" y="845" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">代理人：</text><text x="485" y="845" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">H認有必要，得送本人</text><text x="335" y="925" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">無行為能力人：</text><text x="560" y="925" font-size="27" class="r" text-anchor="start" dominant-baseline="hanging">沒說法代前，都是送無行為能力人</text><text x="335" y="1025" font-size="26" class="t" text-anchor="start" dominant-baseline="hanging">第三人（同居、受僱、處所收郵人、送達人指定代收人）</text><text x="115" y="1135" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">※ 未成年人受送達效力</text><line x1="250" y1="1180" x2="250" y2="1300" class="l" stroke-width="3"/><line x1="250" y1="1180" x2="272" y2="1180" class="l" stroke-width="3"/><line x1="250" y1="1280" x2="272" y2="1280" class="l" stroke-width="3"/><text x="285" y="1160" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">本人為受送達</text><text x="520" y="1160" font-size="34" class="t" text-anchor="start" dominant-baseline="hanging">×</text><text x="575" y="1160" font-size="26" class="t" text-anchor="start" dominant-baseline="hanging">§69，無行為能力應向父母送達</text><text x="285" y="1260" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">未成年人幫父母收送達</text><text x="650" y="1260" font-size="34" class="r" text-anchor="start" dominant-baseline="hanging">✓</text><text x="710" y="1260" font-size="26" class="t" text-anchor="start" dominant-baseline="hanging">§73 有辨別事理能力可以代收</text><text x="90" y="1340" font-size="34" class="t" text-anchor="start" dominant-baseline="hanging">（三）送達處所</text><line x1="350" y1="1330" x2="350" y2="1390" class="l" stroke-width="3"/><line x1="350" y1="1330" x2="370" y2="1330" class="l" stroke-width="3"/><line x1="350" y1="1360" x2="370" y2="1360" class="l" stroke-width="3"/><line x1="350" y1="1390" x2="370" y2="1390" class="l" stroke-width="3"/><text x="380" y="1318" font-size="24" class="t" text-anchor="start" dominant-baseline="hanging">一般受達人：住所、事務、營業處、會晤處</text><text x="380" y="1350" font-size="23" class="r" text-anchor="start" dominant-baseline="hanging">H、法人、非法人團：機關的所在地、事務、營業處</text><text x="380" y="1380" font-size="24" class="t" text-anchor="start" dominant-baseline="hanging">受達人就業處所</text></svg>