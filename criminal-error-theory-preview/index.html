<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>錯誤論原題｜四回測驗（資料校對預覽）</title>
<style>
:root{--bg:#f4f6fa;--ink:#1c293a;--navy:#17365d;--border:#e0e6ee;--ok:#16825b;--bad:#be3c45}*{box-sizing:border-box}body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0}main{max-width:920px;margin:auto;padding:16px 12px 60px}.page{display:none}.page.show{display:block}.panel{background:white;border:1px solid var(--border);border-radius:17px;padding:18px;margin:12px 0;box-shadow:0 6px 22px #102e4a0a}header{background:var(--navy);border-radius:18px;padding:22px;color:white}header h1{margin:0 0 8px;font-size:clamp(22px,4vw,30px)}header p{margin:0;line-height:1.7;color:#dbe6f7}.warn{background:#fff8e9;border-left:4px solid #e6ac44;padding:13px 15px;line-height:1.7;border-radius:10px}.back{padding:7px 11px;border:0;background:#e8eff8;color:#17365d;border-radius:9px;font-weight:650;margin:0 0 10px;cursor:pointer}.row{display:flex;flex-wrap:wrap;gap:9px}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}button{font:inherit;cursor:pointer}.btn{background:var(--navy);color:white;border:0;border-radius:12px;min-height:44px;padding:10px 14px;font-weight:700}.btn.alt{background:#e8eef7;color:#17365d}.btn:disabled{opacity:.45;cursor:default}.round{width:calc(50% - 6px);text-align:left;background:white;border:1px solid var(--border);padding:18px;border-radius:16px}.round b{display:block;font-size:20px;margin-bottom:6px}.muted{color:#667487;font-size:13px;line-height:1.65}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;border:1px solid var(--border);padding:10px 3px;border-radius:10px}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:#667487}.progress{height:9px;background:#e8eef4;border-radius:99px;margin:13px 0;overflow:hidden}.progress div{height:100%;background:#2b69cb;width:0}.qtitle{font-weight:750;line-height:1.85;font-size:21px;white-space:pre-wrap}.source{background:#f7f8fc;color:#56657a;padding:9px 11px;font-size:13px;line-height:1.8;border-radius:9px;margin:10px 0}.option{display:flex;align-items:flex-start;text-align:left;gap:11px;width:100%;border:1.5px solid var(--border);border-radius:12px;padding:13px;margin:9px 0;background:white;line-height:1.7}.option:disabled{cursor:default}.option.ok{background:#e9f7f0;border-color:#47a17b}.option.bad{background:#fff1f1;border-color:#d77b80}.option .letter{background:#f0f3f8;border-radius:7px;min-width:26px;text-align:center;font-weight:800;padding:2px}.jump{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.jump button{border:1px solid var(--border);border-radius:8px;padding:7px 2px;background:white;font-size:12px}.jump button.active{outline:2px solid #2463c5}.jump button.ok{background:#d8f2e5;color:#075b3d}.jump button.bad{background:#ffe0e3;color:#a31730}.resultWrong{padding:12px 0;border-bottom:1px solid var(--border);line-height:1.65}.link{color:#2157aa;text-decoration:underline}.tag{font-size:12px;font-weight:700;background:#edf3ff;color:#254b80;padding:5px 9px;border-radius:99px}.small{font-size:13px}.control{margin-top:15px;display:flex;gap:8px}.control>*{flex:1}@media(max-width:550px){.round{width:100%}.stats{grid-template-columns:repeat(2,1fr)}.qtitle{font-size:19px}.jump{grid-template-columns:repeat(10,1fr)}}
</style></head><body><main>
<section id="home" class="page show">
<header><h1>刑法總則｜錯誤論原題測驗</h1><p>沿用警察法規測驗的核心操作方向：單選自動前進、可回上一題、交卷、作答統計及錯題紀錄。每題保留原題出處。</p></header>
<div class="panel"><div class="warn"><b>資料校對預覽，尚非正式 200 題版本。</b><div id="progressNote">正在載入題庫…</div>設定目標是 4 回 × 50 題；目前不會用自編題或重複題湊足空缺。</div></div>
<div class="panel"><h3>選擇回合</h3><div class="row" id="rounds"></div></div>
<div class="panel"><button class="btn alt" id="historyButton">錯題記錄及重點複習</button><p class="muted">作答資料存於目前瀏覽器，不會與「偏菜」原站自動同步；此頁也尚未接入原站。</p></div>
</section>
<section id="quiz" class="page"><button class="back" id="quizBack">回前頁</button>
<div class="panel"><div class="flex"><b id="roundTitle"></b><span class="tag" id="modeLabel">單選</span></div>
<div class="stats" style="margin-top:12px"><div class="stat"><strong id="done">0</strong><span>已作答</span></div><div class="stat"><strong id="correct">0</strong><span>答對</span></div><div class="stat"><strong id="wrong">0</strong><span>答錯</span></div><div class="stat"><strong id="rate">0%</strong><span>正確率</span></div></div><div class="progress"><div id="bar"></div></div>
<div class="flex"><b id="counter"></b><button class="btn alt small" id="submit">交卷</button></div></div>
<div class="panel"><div class="source" id="source"></div><div class="qtitle" id="stem"></div><div id="options"></div><div id="ansinfo" class="muted"></div>
<div class="control"><button class="btn alt" id="prev">上一題</button><button class="btn" id="next">下一題</button></div><div class="jump" id="jump" style="margin-top:16px"></div></div>
</section>
<section id="result" class="page"><button class="back" id="resultBack">回前頁</button><div class="panel"><h2>交卷結果</h2><div id="resultStats"></div><div class="row" style="margin-top:12px"><button class="btn" id="reviewWrong">重測本回錯題</button><button class="btn alt" id="retry">重新作答</button></div><div id="wrongList"></div></div></section>
<section id="history" class="page"><button class="back" id="historyBack">回前頁</button><div class="panel"><h2>錯題記錄及重點複習</h2><div id="historyList"></div></div></section>
<div class="muted" style="text-align:center;margin-top:14px">來源：歷屆正式國考題庫與公開原卷索引。題庫內容及答案需逐題以正式公告核對。</div>
</main><script>
"use strict";
const KEY="criminal-error-theory-draft-v1";
let DATA=[],round=1,order=[],idx=0,answers={},review=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hist=()=>{try{return JSON.parse(localStorage.getItem(KEY+"-history"))||[]}catch(e){return []}};
function save(){localStorage.setItem(KEY+"-round-"+round,JSON.stringify({order,idx,answers,review}))}
function page(name){for(const p of document.querySelectorAll(".page"))p.classList.toggle("show",p.id===name);window.scrollTo(0,0)}
function eq(a,b){return String(a||"").split("").sort().join("")===String(b||"").split("").sort().join("")}
function setRounds(){const div=$("rounds");div.innerHTML="";for(let n=1;n<=4;n++){let c=DATA.filter(x=>x.round===n).length;let b=document.createElement("button");b.className="round";b.innerHTML="<b>第 "+n+" 回</b><span class='muted'>目前 "+c+"／50 題（尚未完稿）</span>";b.disabled=!c;b.onclick=()=>start(n);div.appendChild(b)}}
function start(n,ids,redo=false){round=n;review=!!ids;const pool=DATA.filter(q=>q.round===n).map(q=>q.id);let old=null;try{old=JSON.parse(localStorage.getItem(KEY+"-round-"+round))}catch(e){}
if(!redo&&!ids&&old&&old.order?.every(id=>DATA.some(q=>q.id===id))){order=old.order;idx=old.idx||0;answers=old.answers||{};review=old.review||false}else{order=ids||pool;idx=0;answers={};save()}page("quiz");render()}
function cur(){return DATA.find(q=>q.id===order[idx])}
function counts(){let d=0,c=0,w=0;for(const id of order){if(Object.hasOwn(answers,id)){d++;const q=DATA.find(x=>x.id===id);if(q&&eq(answers[id],q.answer))c++;else w++}}return{d,c,w}}
function render(){const q=cur();if(!q){page("home");return}idx=Math.max(0,Math.min(idx,order.length-1));let m=q.answer.length>1;let s=counts();$("roundTitle").textContent="第 "+round+" 回｜"+(review?"錯題重測":"原題測驗");$("modeLabel").textContent=m?"多選":"單選";$("counter").textContent="第 "+(idx+1)+" / "+order.length+" 題";$("done").textContent=s.d;$("correct").textContent=s.c;$("wrong").textContent=s.w;$("rate").textContent=s.d?Math.round(100*s.c/s.d)+"%":"0%";$("bar").style.width=(s.d/order.length*100)+"%";
$("stem").textContent=q.stem;$("source").innerHTML="<b>原題出處：</b>"+esc(q.source)+(q.link?" ｜ <a class='link' target='_blank' rel='noopener noreferrer' href='"+esc(q.link)+"'>查核原始資料</a>":"");
let list=$("options");list.innerHTML="";for(let i=0;i<4;i++){let a="ABCD"[i],b=document.createElement("button");b.className="option";if(Object.hasOwn(answers,q.id)){if(q.answer.includes(a))b.classList.add("ok");if(answers[q.id].includes(a)&&!q.answer.includes(a))b.classList.add("bad");b.disabled=true}else{b.onclick=()=>choose(a)}b.innerHTML="<span class='letter'>"+a+"</span><span>"+esc(q.options[i])+"</span>";list.appendChild(b)}
$("ansinfo").textContent=Object.hasOwn(answers,q.id)?"已作答｜你的答案："+answers[q.id]+"；正確答案："+q.answer+"。":(m?"多選題請選擇全部正確選項後確認":"單選作答後自動進入下一題");$("prev").disabled=idx===0;$("next").textContent=idx===order.length-1?"交卷":"下一題";$("jump").innerHTML="";order.forEach((id,i)=>{let x=DATA.find(q=>q.id===id),b=document.createElement("button");b.textContent=i+1;b.className=(i===idx?"active ":"")+(!Object.hasOwn(answers,id)?"":eq(answers[id],x.answer)?"ok":"bad");b.onclick=()=>{idx=i;save();render()};$("jump").appendChild(b)})}
function choose(a){let q=cur();if(Object.hasOwn(answers,q.id))return;if(q.answer.length>1){let selected=window.prompt("多選題請輸入全部答案字母（例如 AC）",a);if(!selected)return;let z=[...new Set(selected.toUpperCase().replace(/[^ABCD]/g,"").split(""))].sort().join("");if(!z)return;answers[q.id]=z}else{answers[q.id]=a}save();render();if(q.answer.length===1&&idx<order.length-1){const old=q.id;setTimeout(()=>{if(cur()?.id===old&&Object.hasOwn(answers,old)){idx++;save();render()}},250)}}
function move(d){if(d>0&&idx===order.length-1){submit();return}idx=Math.max(0,Math.min(idx+d,order.length-1));save();render()}
function submit(){if(!order.length)return;const s=counts();if(s.d<order.length&&!confirm("尚有 "+(order.length-s.d)+" 題未作答，確定交卷嗎？"))return;
const wrongIds=order.filter(id=>{const q=DATA.find(x=>x.id===id);return !Object.hasOwn(answers,id)||!eq(answers[id],q.answer)});const result={date:new Date().toLocaleString("zh-TW"),round,wrongIds,count:order.length,correct:s.c,review};let h=hist();h.unshift(result);localStorage.setItem(KEY+"-history",JSON.stringify(h.slice(0,80)));$("resultStats").innerHTML="<p>答對："+s.c+" 題｜答錯或未作答："+wrongIds.length+" 題｜正確率："+Math.round(s.c/order.length*100)+"%</p>";$("wrongList").innerHTML=wrongIds.map(id=>{let q=DATA.find(x=>x.id===id);return "<div class='resultWrong'><b>原題："+esc(q.source)+"</b><div>"+esc(q.stem)+"</div><span class='muted'>你的答案："+esc(answers[id]||"未作答")+"｜正解："+esc(q.answer)+"</span></div>"}).join("");$("reviewWrong").disabled=!wrongIds.length;$("reviewWrong").onclick=()=>start(round,wrongIds,true);page("result")}
function showHistory(){$("historyList").innerHTML=hist().map((x,i)=>"<div class='resultWrong'><b>"+esc(x.date)+"｜第"+x.round+"回"+(x.review?"（重測）":"")+"</b><p class='muted'>答錯或未作答 "+x.wrongIds.length+"／"+x.count+" 題｜題庫 ID："+x.wrongIds.join("、")+"</p></div>").join("")||"<p class='muted'>尚未有交卷紀錄。</p>";page("history")}
$("quizBack").onclick=()=>{save();page("home")};$("resultBack").onclick=()=>page("home");$("historyBack").onclick=()=>page("home");$("historyButton").onclick=showHistory;$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("submit").onclick=submit;$("retry").onclick=()=>start(round,null,true);
fetch("questions.json").then(r=>{if(!r.ok)throw Error("題庫無法載入");return r.json()}).then(data=>{DATA=data.questions||[];setRounds();$("progressNote").textContent="目前已收錄 "+DATA.length+"／200 題原題候選。每回仍不足 50 題，題源及答案尚需官方逐題複核。"}).catch(e=>{$("progressNote").textContent=e.message;$("rounds").textContent="題庫無法載入，請確認同資料夾內有 questions.json。"});
</script></body></html>
