</style><text x="80" y="105" font-size="40" class="t" text-anchor="start" dominant-baseline="hanging">（四）送達方式</text><text x="820" y="125" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">（郵局圖識 X）</text><line x1="150" y1="245" x2="150" y2="1060" class="l" stroke-width="3"/><line x1="150" y1="245" x2="174" y2="245" class="l" stroke-width="3"/><line x1="150" y1="375" x2="174" y2="375" class="l" stroke-width="3"/><line x1="150" y1="520" x2="174" y2="520" class="l" stroke-width="3"/><line x1="150" y1="760" x2="174" y2="760" class="l" stroke-width="3"/><line x1="150" y1="1045" x2="174" y2="1045" class="l" stroke-width="3"/><text x="190" y="220" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">補充：</text><text x="325" y="220" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">辨別事理 同居</text><text x="590" y="220" font-size="25" class="t" text-anchor="start" dominant-baseline="hanging">（共同生活者）</text><text x="780" y="220" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">、受僱、</text><rect x="900" y="210" width="170" height="52" fill="none" stroke="#121212" stroke-width="2"/><text x="910" y="215" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">處所收郵人</text><text x="190" y="350" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">留置：</text><text x="325" y="350" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">上述不收，放在應送達處所</text><text x="190" y="495" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">寄存</text><text x="190" y="535" font-size="25" class="t" text-anchor="start" dominant-baseline="hanging">（補充性）</text><line x1="335" y1="485" x2="335" y2="630" class="l" stroke-width="3"/><line x1="335" y1="485" x2="357" y2="485" class="l" stroke-width="3"/><line x1="335" y1="590" x2="357" y2="590" class="l" stroke-width="3"/><text x="370" y="465" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">存：地方自治H、PH、郵政H</text><text x="370" y="570" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">保存</text><circle cx="510" cy="590" r="31" fill="none" stroke="#e71c1c" stroke-width="2"/><text x="482" y="570" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">3月</text><text x="560" y="570" font-size="25" class="t" text-anchor="start" dominant-baseline="hanging">（訴訟文書：2月）</text><rect x="835" y="480" width="245" height="110" fill="none" stroke="#121212" stroke-width="2"/><text x="850" y="493" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">送達即生效</text><text x="850" y="540" font-size="24" class="r" text-anchor="start" dominant-baseline="hanging">≠10日（≠行政訴訟）</text><text x="190" y="690" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">公示</text><line x1="310" y1="680" x2="310" y2="920" class="l" stroke-width="3"/><line x1="310" y1="680" x2="332" y2="680" class="l" stroke-width="3"/><line x1="310" y1="745" x2="332" y2="745" class="l" stroke-width="3"/><line x1="310" y1="810" x2="332" y2="810" class="l" stroke-width="3"/><line x1="310" y1="890" x2="332" y2="890" class="l" stroke-width="3"/><text x="345" y="660" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">送達處不明</text><text x="345" y="725" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging">治外法權人住所送達而無效</text><text x="345" y="790" font-size="26" class="t" text-anchor="start" dominant-baseline="hanging">外國 or 境外 不能以囑託 or 預計無效</text><text x="345" y="870" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">處所變更不陳明</text><text x="860" y="690" font-size="34" class="r" text-anchor="start" dominant-baseline="hanging">→</text><line x1="910" y1="650" x2="910" y2="800" class="l" stroke-width="3"/><line x1="910" y1="650" x2="930" y2="650" class="l" stroke-width="3"/><line x1="910" y1="745" x2="930" y2="745" class="l" stroke-width="3"/><text x="940" y="630" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">H依申請</text><text x="940" y="725" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">職權認有</text><text x="940" y="765" font-size="24" class="r" text-anchor="start" dominant-baseline="hanging">必要程度為必要</text><text x="260" y="970" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">② 生效日</text><line x1="480" y1="940" x2="480" y2="1160" class="l" stroke-width="3"/><line x1="480" y1="940" x2="502" y2="940" class="l" stroke-width="3"/><line x1="480" y1="1035" x2="502" y2="1035" class="l" stroke-width="3"/><line x1="480" y1="1130" x2="502" y2="1130" class="l" stroke-width="3"/><text x="520" y="920" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">20日：</text><text x="650" y="920" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">一般情形，最後刊登日</text><text x="520" y="1015" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">60日：</text><text x="650" y="1015" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">外國、境外之久不送達</text><text x="520" y="1110" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">即刻：</text><text x="650" y="1110" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">同一人久不後 再久不</text><text x="180" y="1210" font-size="31" class="t" text-anchor="start" dominant-baseline="hanging">囑託</text><line x1="300" y1="1195" x2="300" y2="1375" class="l" stroke-width="3"/><line x1="300" y1="1195" x2="320" y2="1195" class="l" stroke-width="3"/><line x1="300" y1="1240" x2="320" y2="1240" class="l" stroke-width="3"/><line x1="300" y1="1285" x2="320" y2="1285" class="l" stroke-width="3"/><line x1="300" y1="1330" x2="320" y2="1330" class="l" stroke-width="3"/><line x1="300" y1="1375" x2="320" y2="1375" class="l" stroke-width="3"/><text x="335" y="1178" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging">外國境外：</text><text x="520" y="1178" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">駐外領事館</text><text x="335" y="1225" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging">駐外人員：</text><text x="520" y="1225" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">外交部</text><text x="335" y="1270" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging">軍人：</text><text x="520" y="1270" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">軍事H or 長官</text><text x="335" y="1315" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging">治外法權人：</text><text x="520" y="1315" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">外交部</text><text x="335" y="1360" font-size="27" class="t" text-anchor="start" dominant-baseline="hanging">監所人：</text><text x="520" y="1360" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">監所長官</text></svg>