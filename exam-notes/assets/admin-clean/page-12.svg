<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402"><rect width="100%" height="100%" fill="#fff"/><style>
.t{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#121212;font-weight:400}
.r{font-family:'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;fill:#e71c1c;font-weight:400}
.l{stroke:#121212;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}
.rl{stroke:#e71c1c;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style><text x="85" y="125" font-size="39" class="t" text-anchor="start" dominant-baseline="hanging">（六）當事人權利</text><line x1="355" y1="140" x2="355" y2="430" class="l" stroke-width="3"/><line x1="355" y1="140" x2="379" y2="140" class="l" stroke-width="3"/><line x1="355" y1="235" x2="379" y2="235" class="l" stroke-width="3"/><line x1="355" y1="330" x2="379" y2="330" class="l" stroke-width="3"/><line x1="355" y1="425" x2="379" y2="425" class="l" stroke-width="3"/><text x="390" y="120" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">陳述意見</text><text x="390" y="215" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">提出證據</text><text x="390" y="310" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">經主持同意之辯論權</text><text x="390" y="405" font-size="31" class="r" text-anchor="start" dominant-baseline="hanging">程序中聲明異議權</text><text x="85" y="520" font-size="39" class="t" text-anchor="start" dominant-baseline="hanging">（七）聽證紀錄</text><line x1="390" y1="525" x2="390" y2="825" class="l" stroke-width="3"/><line x1="390" y1="525" x2="414" y2="525" class="l" stroke-width="3"/><line x1="390" y1="625" x2="414" y2="625" class="l" stroke-width="3"/><line x1="390" y1="720" x2="414" y2="720" class="l" stroke-width="3"/><line x1="390" y1="815" x2="414" y2="815" class="l" stroke-width="3"/><text x="425" y="505" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">應作成，得錄音影輔助</text><text x="425" y="605" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">當場閱簽；未當場指定時日閱簽</text><text x="425" y="700" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">陳述異同拒簽，記明事由</text><text x="425" y="795" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">紀錄經載有異議，</text><text x="720" y="795" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">有理</text><text x="785" y="795" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">應補</text><text x="875" y="795" font-size="28" class="r" text-anchor="start" dominant-baseline="hanging">無理</text><text x="940" y="795" font-size="28" class="t" text-anchor="start" dominant-baseline="hanging">應記明</text><text x="85" y="900" font-size="37" class="t" text-anchor="start" dominant-baseline="hanging">（八）終結及後續</text><line x1="375" y1="905" x2="375" y2="1020" class="l" stroke-width="3"/><line x1="375" y1="905" x2="399" y2="905" class="l" stroke-width="3"/><line x1="375" y1="1005" x2="399" y2="1005" class="l" stroke-width="3"/><text x="410" y="888" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">充分陳述 可決定</text><text x="715" y="888" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">應終結</text><text x="410" y="988" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">H後續必要 再為聽證</text><text x="85" y="1080" font-size="37" class="t" text-anchor="start" dominant-baseline="hanging">（九）應聽證</text><text x="245" y="1125" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">（強制）</text><line x1="375" y1="1075" x2="375" y2="1295" class="l" stroke-width="3"/><line x1="375" y1="1075" x2="399" y2="1075" class="l" stroke-width="3"/><line x1="375" y1="1150" x2="399" y2="1150" class="l" stroke-width="3"/><line x1="375" y1="1225" x2="399" y2="1225" class="l" stroke-width="3"/><text x="410" y="1055" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging">人民申請</text><text x="585" y="1055" font-size="35" class="r" text-anchor="start" dominant-baseline="hanging">×</text><text x="640" y="1055" font-size="27" class="r" text-anchor="start" dominant-baseline="hanging">（但行政罰法有）</text><text x="410" y="1135" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">都更計畫</text><text x="410" y="1210" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">土地徵收有爭議</text><text x="185" y="1310" font-size="30" class="t" text-anchor="start" dominant-baseline="hanging">得：</text><text x="270" y="1305" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging">VA、行政計畫、訂定命令</text><text x="675" y="1305" font-size="25" class="t" text-anchor="start" dominant-baseline="hanging">（VV、陳情、指導 X）</text><text x="410" y="1350" font-size="27" class="r" text-anchor="start" dominant-baseline="hanging">（重大影響）</text><text x="115" y="1370" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging">☆ 聽證後，免除訴願及其先行程序</text></svg>