name: Import social order notes (diagnostic)
on:
  push:
    paths:
      - '.github/workflows/import-social-notes-20261105.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find share service API base and download response
        run: |
          set -euo pipefail
          curl -LsS 'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js' -o /tmp/page.js
          python3 - <<'PY' > exam-notes/assets/social-transfer-diagnostic.txt
          import re
          s=open('/tmp/page.js').read()
          print('size',len(s))
          for pat in ['async function v()','async function ez(e)','https://','api.firestorage','/api','const f=','var f=','let f=','NEXT_PUBLIC','downloadUrl','downloadURL','await o.json()','url:']:
              print('\n===',pat,'===\n')
              occ=list(re.finditer(re.escape(pat),s,re.I))
              print('matches',len(occ))
              for m in occ[:7]:
                  print(s[max(0,m.start()-700):m.end()+1500])
                  print('---')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-notes/assets/social-transfer-diagnostic.txt
          git commit -m 'Find note sharing API endpoints [skip ci]'
          git push
