name: Verify Constitution Hard Official Answers
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-constitution-hard-answers.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf
      - name: Verify MoEx answer tables
        run: |
          python - <<'PY'
          import io,json,re,urllib.request
          from pypdf import PdfReader
          q=json.load(open('constitution-rights-100-hard/questions.json',encoding='utf-8'))
          groups={}
          for x in q:
            if 'wwwq.moex.gov.tw' in x['answer_url']:
              groups.setdefault(x['answer_url'],[]).append(x)
          def fetch(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            return urllib.request.urlopen(req,timeout=45).read()
          def parse_answers(data):
            parsed={}
            for page in PdfReader(io.BytesIO(data)).pages:
              txt=page.extract_text(extraction_mode='layout') or ''
              lines=[ln.strip() for ln in txt.splitlines()]
              for i,line in enumerate(lines):
                if not line.startswith('題號'): continue
                nums=[int(x) for x in re.findall(r'第(\d+)題',line)]
                if not nums: continue
                j=i+1
                while j<len(lines) and not lines[j]: j+=1
                if j>=len(lines) or not lines[j].startswith('答案'): continue
                ans=re.findall(r'(?<![A-Z])([ABCD])(?![A-Z])',lines[j])
                # The final row of a 75-question paper still prints placeholders for 76-80.
                # Pair only the answers actually present.
                parsed.update(dict(zip(nums,ans)))
            return parsed
          total=0
          for url,items in groups.items():
            parsed=parse_answers(fetch(url))
            missing=[]; bad=[]
            for x in items:
              n=x['q_no']; total+=1
              if n not in parsed: missing.append((n,x['source']))
              elif parsed[n]!=x['answer']: bad.append((n,x['answer'],parsed[n],x['source']))
            print(url,'checked',len(items),'missing',missing,'bad',bad)
            if missing or bad:
              raise SystemExit('official answer verification failed')
          assert total==92,total
          print('VERIFIED_MOEX_ANSWERS',total)
          PY
