name: Import police education and police-duty note images
on:
  push:
    paths:
      - '.github/workflows/import-police-education-and-duty-notes-20261106.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve all eight original PNG note images
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile

          base='https://api.firestorage.ai/dev/file/shares/SBNlMZNxT4fQ'
          archive_id='01a1ac7dceb1735ba326b843664ab81c'
          listing_req=urllib.request.Request(base+'/files?maxResults=1000', headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(listing_req,timeout=45) as resp: listing=json.load(resp)
          files=listing.get('files',[])
          if not any(f.get('fileId')==archive_id for f in files):
              raise RuntimeError('The uploaded image bundle was not found at the verified share')
          req=urllib.request.Request(base+'/files/'+archive_id+'/download',data=b'',headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as resp: download=json.load(resp)
          url=download.get('downloadUrl')
          if not url: raise RuntimeError('Archive download authorization missing')
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=180) as resp:
              archive=resp.read()
          if len(archive)<14000000: raise RuntimeError('Archive unexpectedly small')
          dest=pathlib.Path('exam-notes/assets/police-law')
          for n in range(1,4):
              if not (dest/('page-%02d.png'%n)).is_file():
                  raise RuntimeError('Existing social-order page missing: '+str(n))
          expected=['page-%02d.png'%n for n in range(4,12)]
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              if z.testzip() is not None: raise RuntimeError('Corrupt ZIP')
              manifest=json.loads(z.read('manifest.json'))
              if [x['file'] for x in manifest]!=expected: raise RuntimeError('Wrong image ordering')
              for m in manifest:
                  filename=m['file']
                  data=z.read(filename)
                  if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data)<1000000:
                      raise RuntimeError('Damaged PNG image: '+filename)
                  if hashlib.sha256(data).hexdigest()!=m['sha256']:
                      raise RuntimeError('SHA mismatch for '+filename)
                  (dest/filename).write_bytes(data)
                  print(filename, len(data),m['source'],'OK')

          cfg_path=pathlib.Path('exam-notes/config.js')
          config=cfg_path.read_text('utf-8')
          old="      total: 3,\n      directory: 'assets/police-law',"
          new="""      total: 11,
                chapters: Object.freeze([
                  Object.freeze({ name: '社會秩序維護法｜時效 1–3 頁', start: 1 }),
                  Object.freeze({ name: '警察教育條例｜重點 4–7 頁', start: 4 }),
                  Object.freeze({ name: '警職法與子法｜時效 8–11 頁', start: 8 })
                ]),
                directory: 'assets/police-law',"""
          if config.count(old)!=1: raise RuntimeError('Police-law config unexpectedly changed')
          cfg_path.write_text(config.replace(old,new,1),'utf-8')

          page_path=pathlib.Path('exam-notes/index.html')
          html=page_path.read_text('utf-8')
          style="""
          .chapter-nav{display:flex;align-items:center;gap:8px;margin:0 0 7px}
          .chapter-nav label{white-space:nowrap;font-size:12px;color:var(--muted);font-weight:700}
          .chapter-nav select{flex:1;min-width:0;max-width:100%;height:33px;background:#fffdf9;color:var(--ink);border:1px solid var(--border);border-radius:9px;font:600 12px/1.3 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;padding:2px 7px}
          """
          anchor='</style>'
          if html.count(anchor)!=1: raise RuntimeError('Expected HTML style end not found')
          html=html.replace(anchor,style+'\n'+anchor,1)
          anchor='<section class="controls"><div class="pager">'
          replacement='<section class="controls"><div id="chapterNav" class="chapter-nav hidden"><label for="chapterSelect">筆記單元</label><select id="chapterSelect" aria-label="跳至筆記單元"></select></div><div class="pager">'
          if html.count(anchor)!=1: raise RuntimeError('Expected pager controls not found')
          html=html.replace(anchor,replacement,1)
          anchor='function storageKey(key){'
          extra="""function setupChapters(key){
           const chapters=(SUBJECTS[key]||{}).chapters||[];
           const nav=$('chapterNav'), sel=$('chapterSelect');
           nav.classList.toggle('hidden',chapters.length===0);
           sel.innerHTML='';
           chapters.forEach(c=>{const option=document.createElement('option');option.value=String(c.start);option.textContent=c.name;sel.append(option)});
           syncChapter();
          }
          function syncChapter(){
           if(!activeKey)return;
           const chapters=(SUBJECTS[activeKey]||{}).chapters||[];
           let current=null;
           chapters.forEach(c=>{if(pageNum>=c.start)current=c.start});
           if(current!==null)$('chapterSelect').value=String(current);
          }
          """
          if html.count(anchor)!=1: raise RuntimeError('Expected JS storage function not found')
          html=html.replace(anchor,extra+anchor,1)
          anchor="slider.value=pageNum;$('prev').disabled="
          if html.count(anchor)!=1: raise RuntimeError('Expected pager update not found')
          html=html.replace(anchor,"slider.value=pageNum;syncChapter();$('prev').disabled=",1)
          anchor="applySubjectUI(key);home.classList.add('hidden');"
          if html.count(anchor)!=1: raise RuntimeError('Expected subject open routine not found')
          html=html.replace(anchor,"applySubjectUI(key);setupChapters(key);home.classList.add('hidden');",1)
          anchor="renderSubjects();$('back').addEventListener("
          if html.count(anchor)!=1: raise RuntimeError('Expected init routine not found')
          html=html.replace(anchor,"$('chapterSelect').addEventListener('change',e=>showPage(e.target.value));renderSubjects();$('back').addEventListener(",1)
          page_path.write_text(html,'utf-8')
          print('Updated index with jump-to-chapter selector (police-law only)')
          PY
      - name: Check configuration, JavaScript and files
        run: |
          set -euo pipefail
          node --check exam-notes/config.js
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('exam-notes/index.html').read_text('utf-8')
          scripts=[x for x in re.findall(r'<script(?: [^>]*)?>([\s\S]*?)</script>',text) if x.strip()]
          assert len(scripts)==1,len(scripts)
          pathlib.Path('/tmp/notes-inline.js').write_text(scripts[0])
          files=sorted(pathlib.Path('exam-notes/assets/police-law').glob('page-*.png'))
          assert len(files)==11,[x.name for x in files]
          print('Verified 11 pages:',[x.name for x in files])
          assert '警察教育條例｜重點' in pathlib.Path('exam-notes/config.js').read_text('utf-8')
          PY
          node --check /tmp/notes-inline.js
      - name: Publish images and preserve existing notes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-notes/config.js exam-notes/index.html exam-notes/assets/police-law
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Add police education and police-powers note images; chapter navigation [skip ci]'
            git push
          fi
