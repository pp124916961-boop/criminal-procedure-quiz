<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#efe8db">
  <title>考試筆記</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Iansui&display=swap');
    :root{--paper:#fffdf7;--desk:#d5c9b9;--ink:#24211e;--red:#b93f36;--blue:#a9cddd;--line:#d6e5ea;--muted:#736b63;--border:#d3c7b8}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;color:var(--ink);background:#eee7dc;font-family:"Iansui","Klee One","DFKai-SB","標楷體",cursive}button,input{font:inherit}.hidden{display:none!important}
    #home{height:100dvh;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));display:grid;place-items:center;background:radial-gradient(circle at 15% 8%,#fff 0,transparent 27%),linear-gradient(145deg,#f6f0e6,#e7dccd)}
    .home-card{width:min(520px,100%);height:min(740px,100%);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(8px,1.7vh,15px)}.brand{display:flex;align-items:center;gap:13px}.mark{width:50px;height:50px;border-radius:16px;background:#292622;color:#fff;display:grid;place-items:center;font-size:27px;box-shadow:0 10px 24px #544b4030}.eyebrow{margin:0;color:var(--red);font:900 10px/1.2 system-ui;letter-spacing:.16em}.brand h1{margin:3px 0 0;font-size:clamp(30px,5.3vh,44px);line-height:1}
    .subjects{display:grid;grid-template-rows:repeat(6,minmax(42px,1fr));gap:clamp(6px,1vh,10px);min-height:0}.subject{border:1px solid var(--border);border-radius:16px;background:#fffdf9e8;padding:0 18px;display:flex;align-items:center;text-align:left;font-size:clamp(17px,2.45vh,21px);font-weight:700;color:var(--ink);box-shadow:0 6px 18px #3a2c2110;cursor:pointer}.subject:active{transform:scale(.987)}.subject.ready{border-color:#c7a89b;background:#fff8f3}.arrow{margin-left:auto;color:#9c9084;font-size:27px}.tag{margin-left:auto;background:#ecd9d1;color:var(--red);font:800 11px system-ui;border-radius:99px;padding:4px 8px}.subject.ready .arrow{margin-left:8px}.foot{text-align:center;color:var(--muted);font-size:11px;margin:0}
    #viewer{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--desk)}.viewer-head{height:62px;padding:max(7px,env(safe-area-inset-top)) 10px 6px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:#fffdf9fa;border-bottom:1px solid var(--border);z-index:4}.viewer-title{text-align:center}.viewer-title p{margin:0;color:var(--red);font:900 9px system-ui;letter-spacing:.14em}.viewer-title h2{margin:2px 0 0;font-size:22px;line-height:1}.icon{width:40px;height:40px;border:1px solid var(--border);border-radius:13px;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:27px;cursor:pointer}
    .stage{position:relative;min-height:0;overflow:hidden;display:grid;place-items:center;padding:8px;background:linear-gradient(#d8d0c5,#c8bcac)}.sheet-frame{position:relative;width:820px;height:1120px;transform-origin:center;flex:none}.note-sheet{position:absolute;inset:0;width:820px;height:1120px;overflow:hidden;padding:50px 54px 44px 68px;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 42px,#edb5b5 43px,#edb5b5 45px,transparent 46px),repeating-linear-gradient(0deg,transparent 0,transparent 39px,var(--line) 40px,var(--line) 41px);box-shadow:0 9px 30px #372b201f;color:var(--ink);font-size:25px;line-height:1.55;letter-spacing:.015em}.note-sheet:before{content:"";position:absolute;left:14px;top:55px;width:16px;height:16px;border:3px solid #c7baa9;border-radius:50%;box-shadow:0 150px 0 -3px var(--paper),0 150px 0 0 #c7baa9,0 300px 0 -3px var(--paper),0 300px 0 0 #c7baa9,0 450px 0 -3px var(--paper),0 450px 0 0 #c7baa9,0 600px 0 -3px var(--paper),0 600px 0 0 #c7baa9,0 750px 0 -3px var(--paper),0 750px 0 0 #c7baa9,0 900px 0 -3px var(--paper),0 900px 0 0 #c7baa9}.note-sheet.compact{font-size:22px;line-height:1.43}.note-sheet.dense{font-size:20px;line-height:1.36}.note-sheet.sparse{font-size:27px;line-height:1.62}.page-kicker{position:absolute;right:43px;top:24px;color:#8c8176;font:700 15px system-ui;letter-spacing:.12em}.note-sheet h3{margin:0 0 13px;font-size:37px;line-height:1.15;letter-spacing:.03em;border-bottom:4px double var(--ink);display:inline-block}.note-sheet h4{font-size:28px;margin:12px 0 5px;line-height:1.25}.note-sheet p{margin:5px 0}.note-sheet ul{margin:4px 0 8px;padding-left:1.35em}.note-sheet li{margin:1px 0}.red{color:var(--red);font-weight:700}.em{border-bottom:3px solid var(--red)}.box{margin:9px 0;padding:10px 15px;border:2px solid var(--ink);border-radius:9px;background:#ffffff9c}.soft{background:#f3eadbba;border-color:#bdaa92}.warn{background:#fff0eb;border-color:var(--red)}.arrowline{margin:9px 0;text-align:center;font-size:24px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{font-size:.85em}.note-table{width:100%;border-collapse:collapse;margin:9px 0;background:#fffefa}.note-table th,.note-table td{border:2px solid var(--ink);padding:6px 8px;vertical-align:top;text-align:left}.note-table th{background:#f0e4d2;color:var(--red)}.check{list-style:none;padding-left:0!important}.check li:before{content:"✓";color:var(--red);font-weight:900;margin-right:.45em}.formula{display:inline-block;padding:3px 9px;border:2px solid var(--red);border-radius:7px;color:var(--red);font-weight:700;transform:rotate(-1deg)}.scribble{transform:rotate(-.6deg);display:inline-block}
    .controls{background:#fffdf9fc;border-top:1px solid var(--border);padding:8px 11px calc(8px + env(safe-area-inset-bottom));z-index:4}.pager{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center}.nav{height:39px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}.nav:disabled{opacity:.34}.counter{min-width:80px;text-align:center;color:var(--muted);font:500 13px system-ui}.counter strong{color:var(--ink);font-size:18px}.slide{display:grid;grid-template-columns:22px 1fr 28px;align-items:center;gap:7px;margin-top:7px}.edge{font:700 10px system-ui;text-align:center;color:var(--muted)}#pageSlider{appearance:none;-webkit-appearance:none;width:100%;height:23px;background:transparent;margin:0}#pageSlider::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:#d9cfc4}#pageSlider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--red);border:2px solid white;margin-top:-7.5px;box-shadow:0 2px 7px #0003}#pageSlider::-moz-range-track{height:5px;border-radius:99px;background:#d9cfc4}#pageSlider::-moz-range-thumb{width:18px;height:18px;border:2px solid white;border-radius:50%;background:var(--red)}
    .modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#1f1b187f;padding:22px;backdrop-filter:blur(5px)}.modal-card{width:min(340px,100%);background:#fffdf9;border-radius:22px;padding:24px;text-align:center;box-shadow:0 18px 55px #42302422}.modal-card h3{margin:0 0 8px;font-size:21px}.modal-card p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.55}.ok{width:100%;height:44px;border:0;border-radius:13px;background:var(--ink);color:#fff;font-weight:700}
    #zoom{position:fixed;inset:0;z-index:30;background:#171615;display:grid;grid-template-rows:50px minmax(0,1fr)}.zoom-bar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;background:#201f1e}.zoom-label{font:700 12px system-ui}.close{width:38px;height:38px;border:0;border-radius:11px;background:#353331;color:#fff;font-size:26px}.zoom-area{overflow:auto;-webkit-overflow-scrolling:touch;padding:16px;touch-action:pan-x pan-y pinch-zoom}.zoom-sheet{position:relative;width:820px;height:1120px;margin:0 auto}
    @media(max-height:610px){.home-card{gap:6px}.mark{width:42px;height:42px}.brand h1{font-size:28px}.subjects{gap:5px}.subject{font-size:15px;border-radius:13px}.foot{display:none}.viewer-head{height:54px}.controls{padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom))}.nav{height:34px}.slide{margin-top:3px}}
    @media(prefers-reduced-motion:no-preference){.note-sheet{animation:pageIn .2s ease-out}@keyframes pageIn{from{opacity:.4;transform:translateX(8px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <main id="home">
    <section class="home-card">
      <header class="brand"><div class="mark">筆</div><div><p class="eyebrow">EXAM NOTES</p><h1>考試筆記</h1></div></header>
      <nav class="subjects" aria-label="科目">
        <button class="subject" data-subject="憲法">憲法<span class="arrow">›</span></button>
        <button class="subject" data-subject="警察法規">警察法規<span class="arrow">›</span></button>
        <button class="subject" data-subject="警察勤務">警察勤務<span class="arrow">›</span></button>
        <button class="subject" data-subject="刑事訴訟法">刑事訴訟法<span class="arrow">›</span></button>
        <button class="subject" data-subject="刑法">刑法<span class="arrow">›</span></button>
        <button class="subject ready" id="adminBtn">行政法<span class="tag">30 頁</span><span class="arrow">›</span></button>
      </nav>
      <p class="foot">行政法已整理；其他科目可於之後加入。</p>
    </section>
  </main>

  <main id="viewer" class="hidden">
    <header class="viewer-head">
      <button id="back" class="icon" aria-label="返回首頁">‹</button>
      <div class="viewer-title"><p>考試筆記</p><h2>行政法</h2></div>
      <button id="zoomBtn" class="icon" aria-label="放大閱讀">＋</button>
    </header>
    <section class="stage" id="stage"><div class="sheet-frame" id="frame"></div></section>
    <section class="controls">
      <div class="pager"><button id="prev" class="nav">上一頁</button><div class="counter"><strong id="cur">1</strong> / 30</div><button id="next" class="nav">下一頁</button></div>
      <div class="slide"><span class="edge">1</span><input id="pageSlider" type="range" min="1" max="30" value="1" step="1" aria-label="快速跳頁"><span class="edge">30</span></div>
    </section>
  </main>

  <div id="empty" class="modal hidden"><div class="modal-card"><h3 id="emptyTitle">筆記尚未上傳</h3><p>這個科目的筆記之後上傳後，可以直接接進來。</p><button id="emptyClose" class="ok">知道了</button></div></div>
  <div id="zoom" class="hidden"><div class="zoom-bar"><span id="zoomLabel" class="zoom-label">第 1 / 30 頁</span><button id="zoomClose" class="close">×</button></div><div class="zoom-area" id="zoomArea"><div id="zoomSheet" class="zoom-sheet"></div></div></div>

  <script>
    const pages=[
      {k:"行政法 NO.1",t:"一、法例",c:"compact",b:`
        <div class="box warn"><b>行政程序法的功能：</b><span class="red">保障人民權益</span></div>
        <h4>行政程序的範圍</h4>
        <p>行政處分（VA）／行政契約（VV）／法規命令／行政計畫／行政指導／陳情。</p>
        <h4>行政主體</h4>
        <ul><li>國家、地方自治團體。</li><li>其他行政主體：公法人、行政法人。</li><li><span class="red">準行政主體</span>：受託行使公權力的個人或團體。</li></ul>
        <h4>程序排除</h4>
        <p>得依「人」或「事項」排除；但若涉及<span class="em">身分改變或重大權益</span>，仍應注意程序保障。</p>
        <h4>裁量瑕疵</h4>
        <div class="cols"><div class="box"><b>外部界線</b><br>裁量逾越</div><div class="box"><b>內部界線</b><br>裁量濫用／怠惰</div></div>
        <p class="mini red">記憶：目的要正當、事實要正確，不能把「得裁量」當成「可不處理」。</p>`},
      {k:"行政法 NO.2",t:"二、管轄",c:"dense",b:`
        <div class="formula">管轄法定 ＋ 管轄恆定</div>
        <h4>管轄變更</h4>
        <ul><li>因組織法規變更，原機關喪失管轄權。</li><li>原機關或承受機關應公告；原則上自公告日起第 3 日生效，另定日期者從其規定。</li><li>有爭議時，由共同上級機關決定。</li></ul>
        <table class="note-table mini"><tr><th>類型</th><th>層級／對象</th><th>誰的名義</th><th>救濟管轄</th></tr>
          <tr><td>委任</td><td>同一行政主體，上下隸屬</td><td>受委任機關</td><td>受委任機關之上級</td></tr>
          <tr><td>委託</td><td>無隸屬關係機關</td><td>受委託機關</td><td>受委託機關之上級</td></tr>
          <tr><td>委辦</td><td>上級交地方自治團體</td><td>地方自治團體</td><td>依法定監督關係</td></tr>
          <tr><td>行政委託</td><td>私人／團體行使公權力</td><td>受託者</td><td>原委託機關</td></tr>
        </table>
        <p class="red">判斷順序：先看有沒有隸屬，再看是不是把公權力交給私人。</p>`},
      {k:"行政法 NO.3",t:"管轄（續）",c:"dense",b:`
        <h4>委任／委託的共同要件</h4>
        <ul class="check"><li>依法規授權。</li><li>公告並刊登政府公報或新聞紙。</li><li>以受委任／受委託者名義行使。</li></ul>
        <div class="box warn">行政委託除上列事項外，通常另有<span class="red">締結委託契約</span>。</div>
        <h4>管轄競合</h4>
        <p>機關間先協議 → 協議不成，由共同上級指定 → 人民也可申請指定。</p>
        <div class="arrowline">申請指定 → <span class="red">10 日內</span>決定 → 對指定結果不得聲明不服</div>
        <h4>無管轄時的處理</h4>
        <p>仍有調查與協助義務；應將案件移送有管轄權機關，並通知當事人。</p>
        <h4>不停止、逕行移轉</h4>
        <p>法規或事實變更而喪失管轄時，如當事人與承受機關同意，得由原機關繼續處理，以維程序經濟。</p>`},
      {k:"行政法 NO.4",t:"三、職務協助",c:"compact",b:`
        <h4>何時「得」請求協助？</h4>
        <ul><li>法規上或事實上不能自行執行。</li><li>不能自行調查必要事實。</li><li>所需資料由他機關持有。</li><li>由他機關辦理較經濟、迅速。</li><li>其他職務上有必要。</li></ul>
        <p>原則以<span class="red">書面</span>請求；情況急迫時得先以其他方式，事後補正。</p>
        <div class="cols"><div class="box"><b>應拒絕</b><br>依法不得提供、顯然逾越權限等。</div><div class="box"><b>得拒絕</b><br>將嚴重妨礙自身職務或有正當理由。</div></div>
        <h4>拒絕的爭議</h4>
        <div class="arrowline">請求機關異議 → 共同上級決定<br><span class="mini">無共同上級時，由被請求機關的上級決定</span></div>
        <p>必要費用得由被請求機關請求負擔；數額爭議由共同上級決定。</p>`},
      {k:"行政法 NO.5",t:"四、當事人",c:"compact",b:`
        <h4>誰是當事人？</h4>
        <p>在申請、行政處分、行政契約、行政指導、陳情等程序中，權利或法律上利益可能受影響的人。</p>
        <h4>當事人能力</h4>
        <ul><li>自然人。</li><li>法人。</li><li>設有代表人或管理人的非法人團體。</li><li>行政機關。</li></ul>
        <h4>行政程序行為能力</h4>
        <ul><li>有行為能力的自然人。</li><li>法人、團體的代表人或管理人。</li><li>行政機關首長、代理人或受權人。</li></ul>
        <div class="box warn">第三人權益可能受行政程序影響時，機關得依職權或申請，通知其<span class="red">參加程序</span>，視為當事人。</div>
        <p class="mini">先分清楚：「能不能成為當事人」與「能不能自己做程序行為」是兩件事。</p>`},
      {k:"行政法 NO.6",t:"五、代理人",c:"dense",b:`
        <ul class="check"><li>每一當事人原則最多委任 <span class="red">3 人</span>。</li><li>首次為程序行為時，應提出委任書。</li><li>法規或程序性質不許代理者，不得代理。</li></ul>
        <h4>代理權</h4>
        <p>代理人原則得獨立為程序行為；複代理須經本人同意。</p>
        <div class="box">一般委任推定包含全部程序行為；但<span class="red">撤回申請、拋棄權利、和解等重大處分</span>，須特別授權。</div>
        <p>代理權撤回，須通知行政機關後始生效。本人死亡、喪失行為能力，或法定代理人變更，通常不使代理權當然消滅。</p>
        <h4>選定／指定當事人</h4>
        <p>多數有共同利益者，可由其中選定當事人；必要時機關得指定。</p>
        <div class="formula">選定或指定人數：1～5 人</div>`},
      {k:"行政法 NO.7",t:"輔佐人與迴避",c:"dense",b:`
        <h4>輔佐人</h4>
        <p>當事人或代理人經行政機關許可，於確有必要時得偕同輔佐人到場；其陳述視為當事人陳述，但當事人即時撤銷者除外。</p>
        <h4>公務員迴避</h4>
        <table class="note-table mini"><tr><th>方式</th><th>重點</th></tr>
          <tr><td>自行迴避</td><td>本人／配偶／親屬為當事人；曾任代理人、輔佐人；曾為證人或鑑定人等。</td></tr>
          <tr><td>申請迴避</td><td>有偏頗之虞時，當事人得提出具體事實申請。</td></tr>
          <tr><td>命令迴避</td><td>上級機關或長官依職權命其迴避。</td></tr>
          <tr><td>停止程序</td><td>迴避決定前，原則停止；急迫處置不在此限。</td></tr>
        </table>
        <p>申請遭駁回者，得於 <span class="red">5 日內</span>提請上級機關覆決；上級原則於 10 日內決定。</p>
        <p class="mini red">現為證人、鑑定人的情形，仍要回到是否足以影響公正來判斷。</p>`},
      {k:"行政法 NO.8",t:"六、程序開始與調查證據",c:"compact",b:`
        <h4>程序怎麼開始？</h4>
        <div class="cols"><div class="box"><b>依職權</b><br>機關主動開始</div><div class="box"><b>依申請</b><br>人民書面或言詞申請</div></div>
        <p>言詞申請應作成紀錄，讓申請人閱覽或向其朗讀後簽名；不必另行送達該紀錄。</p>
        <h4>調查原則</h4>
        <ul class="check"><li>機關依職權調查證據，不受當事人主張拘束。</li><li>對當事人有利與不利事項一律注意。</li><li>當事人得提出證據、申請調查或鑑定。</li><li>調查方法應合法、必要且合比例。</li></ul>
        <div class="box warn">重要調查經過要作成書面紀錄：時間、地點、對象、方法、結果都要能被事後檢驗。</div>`},
      {k:"行政法 NO.9",t:"七、資訊公開",c:"dense",b:`
        <table class="note-table mini"><tr><th></th><th>行政程序法：閱卷</th><th>政府資訊公開法</th></tr>
          <tr><td>主體</td><td>當事人／利害關係人</td><td>一般人民</td></tr>
          <tr><td>目的</td><td>主張或維護法律上利益</td><td>知的權利、政府透明</td></tr>
          <tr><td>時點</td><td>行政程序進行中</td><td>不限特定程序</td></tr>
          <tr><td>內容</td><td>卷宗、資料、抄錄或複製</td><td>申請提供、閱覽、複製</td></tr>
          <tr><td>期限</td><td>依法定程序即時處理</td><td>原則 15 日，必要時得延長</td></tr>
          <tr><td>救濟</td><td>程序中決定，原則隨實體處分救濟</td><td>拒絕公開可直接依法救濟</td></tr>
        </table>
        <h4>得限制或拒絕的典型情形</h4>
        <ul><li>國防、外交、重大公共安全。</li><li>個人隱私、營業秘密。</li><li>刑事偵查、行政決定前內部擬稿。</li><li>公開將妨害公益或第三人正當權益。</li></ul>
        <p class="red">原則公開，例外限制；可以分離的部分應分離後提供。</p>`},
      {k:"行政法 NO.10",t:"程序外接觸／期間",c:"dense",b:`
        <h4>程序外接觸</h4>
        <p>機關內部意見交換與程序外第三人接觸不同；對案件結果可能有影響的外部接觸，應<span class="red">作成紀錄並公開</span>，避免暗箱影響。</p>
        <h4>期間怎麼算？</h4>
        <ul><li>以日、星期、月或年定期間，始日通常不算入。</li><li>末日為星期日、國定假日或休息日，以次日為末日。</li><li>採取不利處分的期間規定，應從嚴解釋。</li></ul>
        <h4>回復原狀</h4>
        <div class="box warn">因天災或不可歸責事由遲誤不變期間：障礙消滅後 <span class="red">10 日內</span>申請，並同時補行程序行為；遲誤已逾 1 年者，不得申請。</div>
        <h4>處理期間</h4>
        <p>法規未規定時，原則 2 個月；必要時得延長 2 個月並通知。不可抗力期間不計入。</p>`},
      {k:"行政法 NO.11",t:"八、費用與聽證",c:"compact",b:`
        <h4>程序費用</h4>
        <p>行政程序所需費用原則由行政機關負擔；因人民利益所生的特別必要費用，法律另有依據時得向其收取。</p>
        <p>證人、鑑定人得請領日費、旅費及合理報酬。</p>
        <h4>聽證前</h4>
        <ul class="check"><li>通知當事人與已知利害關係人。</li><li>書面載明時間、場所、事由、主要程序與不到場效果。</li><li>必要時公告周知。</li><li>得先舉行預備聽證，整理爭點與證據。</li></ul>
        <h4>聽證主持</h4>
        <p>由主持人維持秩序、指揮程序、決定發言順序與證據調查。</p>
        <div class="box">原則<span class="red">公開</span>；涉及國安、隱私、營業秘密或有妨害公益之虞時，得全部或一部不公開。</div>`},
      {k:"行政法 NO.12",t:"聽證（續）",c:"dense",b:`
        <h4>當事人的程序權</h4>
        <ul><li>陳述意見、提出證據。</li><li>經主持人許可，詢問其他當事人、證人、鑑定人。</li><li>對程序決定當場聲明異議。</li></ul>
        <h4>聽證紀錄</h4>
        <p>應記載到場者、主張、證據與重要程序；當事人閱覽後簽名。拒絕簽名或要求更正時，也要註明。</p>
        <h4>終結與再開</h4>
        <p>調查完畢後終結；有必要補充重要事實或證據時，得再開聽證。</p>
        <div class="box warn">法律明定應聽證者，才是法定聽證；人民提出申請，不代表機關當然必須舉行。</div>
        <p>經法定聽證作成之行政處分，法律有特別規定時，得免除訴願或其他先行程序，直接進入行政訴訟。</p>`},
      {k:"行政法 NO.13",t:"陳述意見",c:"compact",b:`
        <div class="formula">陳述意見 ≠ 聽證</div>
        <p>陳述意見是較簡易的程序保障；聽證則有完整主持、調查、辯論與紀錄程序。</p>
        <h4>何時要給機會？</h4>
        <p>行政機關作成限制或剝奪人民自由、權利的行政處分前，原則上應給處分相對人陳述意見的機會。</p>
        <h4>可以省略的例外</h4>
        <ul><li>大量同種類處分。</li><li>情況急迫，來不及先行通知。</li><li>依法定事實作成，無裁量餘地。</li><li>限制自由或權利程度顯然輕微。</li><li>相對人已於其他程序充分陳述。</li></ul>
        <p>得以書面陳述；言詞陳述時，機關應作成紀錄並請陳述人簽名或蓋章。</p>`},
      {k:"行政法 NO.14",t:"九、送達",c:"compact",b:`
        <h4>送達機關</h4>
        <p>行政機關自行送達，或交由郵政機關辦理。</p>
        <h4>送達給誰？</h4>
        <ul><li>有代理人者，原則向代理人送達。</li><li>無程序行為能力者，向法定代理人送達。</li><li>法人或團體，向代表人或管理人送達。</li><li>行政機關，向其首長或受領文書人員送達。</li></ul>
        <div class="box">未成年人若已具有辨別事理能力，於不妨害權益的範圍內，可直接受領；否則仍應向法定代理人送達。</div>
        <h4>送達處所</h4>
        <p>住居所、事務所或營業所；也可於應送達人就業處所送達。當事人陳明送達代收人者，向代收人送達。</p>`},
      {k:"行政法 NO.15",t:"送達方法",c:"dense",b:`
        <table class="note-table mini"><tr><th>方法</th><th>要件與效力</th></tr>
          <tr><td>補充送達</td><td>本人不在，交給有辨別事理能力的同居人、受僱人或接收郵件人員。</td></tr>
          <tr><td>留置送達</td><td>應受領人無正當理由拒收，得將文書留置於送達處所。</td></tr>
          <tr><td>寄存送達</td><td>不能補充或留置時，寄存於送達地自治、警察或郵政機關，並製作通知書。</td></tr>
        </table>
        <div class="box warn">行政程序的寄存送達原則上<span class="red">寄存當日發生效力</span>，文書保存 3 個月。與行政訴訟文書的規定要分開記。</div>
        <h4>公示送達</h4>
        <p>處所不明、在國外無法送達，或其他法定原因時，得依申請或職權為公示送達。</p>
        <p>國內：公告日起原則 20 日生效；國外：原則 60 日；後續同類公示送達，依規定可能自次日起生效。</p>`},
      {k:"行政法 NO.16",t:"送達（續）",c:"compact",b:`
        <h4>送達時間</h4>
        <p>星期日、國定假日及日出前、日沒後，原則不得送達；但應受送達人不拒絕或有急迫情形者例外。</p>
        <h4>公示送達 vs. 公告</h4>
        <table class="note-table mini"><tr><th>公示送達</th><th>公告</th></tr><tr><td>對特定人送達，只是因無法個別交付而公開。</td><td>對不特定人發生公示效果。</td></tr></table>
        <p>送達證書屬證明方法；公示送達應將公告文與相關資料記載在卷。</p>
        <h4>期間起算例</h4>
        <div class="box">8/26 收到文書 → 8/27 是第 1 日。<br><span class="red">送達當日發生效力，期間從次日起算。</span></div>
        <p>在外國或特定區域送達時，得囑託駐外機構、相關機關或依條約協助。</p>`},
      {k:"行政法 NO.17",t:"電子送達／救濟教示",c:"compact",b:`
        <h4>電子送達</h4>
        <ul><li>經應受送達人同意，得以電子文件送達。</li><li>須可確認內容完整、來源及收受時間。</li><li>進入指定資訊系統或電子位址時，視為送達。</li></ul>
        <h4>救濟教示</h4>
        <p>行政處分應告知：<span class="red">救濟方法、期間、受理機關</span>。以言詞作成者，也應以適當方式教示。</p>
        <div class="box">法律另定特別救濟途徑時，依特別規定；不能只照一般訴願格式處理。</div>
        <h4>教示錯誤或欠缺</h4>
        <p>機關得補正或更正，並自更正通知送達之次日起重新計算適當期間；人民因信賴錯誤教示而遲誤者，依法給予保護。</p>`},
      {k:"行政法 NO.18",t:"教示錯誤的期間",c:"compact",b:`
        <h4>教示寫得比法定期間長</h4>
        <div class="box soft">例：法定 5 日，卻告知 10 日。<br>人民在錯誤教示期間內提起，應考量其正當信賴；機關更正後，依更正教示計算。</div>
        <h4>教示寫得比法定期間短</h4>
        <div class="box soft">例：法定 10 日，卻告知 5 日。<br>不得因此縮短人民依法享有的期間；更正後應保障完整救濟機會。</div>
        <h4>完全沒有教示</h4>
        <p>不得讓人民因機關欠缺教示而喪失權利；但信賴保護並非無限期，仍有最長 <span class="red">1 年</span>的界線。</p>
        <div class="formula">核心：錯誤不能由人民買單</div>
        <p class="mini">考題常把「處分生效」和「救濟期間是否受保護」混在一起，務必分開判斷。</p>`},
      {k:"行政法 NO.19",t:"十、行政立法",c:"dense",b:`
        <table class="note-table mini"><tr><th>類型</th><th>效力方向</th><th>重點</th></tr>
          <tr><td>法規命令</td><td>直接對外</td><td>依法律授權，規定一般抽象事項。</td></tr>
          <tr><td>行政規則</td><td>原則對內</td><td>組織、作業、解釋性或裁量基準。</td></tr>
          <tr><td>解釋性規則</td><td>間接對外</td><td>統一法律解釋，仍不拘束法院。</td></tr>
          <tr><td>裁量基準</td><td>間接對外</td><td>統一裁量，受平等原則與自我拘束。</td></tr>
        </table>
        <h4>法規命令訂定程序</h4>
        <ul class="check"><li>提出草案，載明授權依據。</li><li>公告預告並讓人民陳述意見。</li><li>必要時舉行聽證。</li><li>依法須上級核定者，完成核定。</li><li>發布後始對外生效。</li></ul>
        <p>軍事、外交、國家秘密等法定事項，得排除部分一般程序。</p>
        <p class="red">人民也可用書面向主管機關提出法規命令的訂定或修正建議。</p>`},
      {k:"行政法 NO.20",t:"行政規則的發布與效力",c:"compact",b:`
        <h4>一般行政規則</h4>
        <p>下達所屬下級機關或屬官即發生內部效力。</p>
        <h4>解釋性規則／裁量基準</h4>
        <p>除下達外，通常還應由首長簽署並<span class="red">登載政府公報發布</span>，使人民可預見行政實務。</p>
        <div class="cols"><div class="box"><b>解釋性規則</b><br>原則溯及法規生效時適用，但不得破壞正當信賴。</div><div class="box"><b>裁量基準</b><br>規範未來裁量；機關須保留個案調整空間。</div></div>
        <p>純內部規則自下達生效；具間接對外效果者，還要重視公開。</p>
        <div class="box warn">最高行政法院觀點：是否「發布」不當然決定規則本身的所有效力；仍要看規則性質、下達及個案適用是否合法。</div>`},
      {k:"行政法 NO.21",t:"解釋變更與審查",c:"compact",b:`
        <h4>解釋性規則變更</h4>
        <table class="note-table mini"><tr><th>案件狀態</th><th>處理方向</th></tr><tr><td>已確定案件</td><td>原則維持法安定性；除非法律另有救濟。</td></tr><tr><td>尚未終結</td><td>適用合法的新解釋，但須衡量信賴保護。</td></tr></table>
        <p>新解釋若較不利，尤其要檢查人民是否已基於舊解釋作成不可回復的安排。</p>
        <h4>審查方式</h4>
        <ul><li>立法監督：法規命令依法送立法院。</li><li>行政監督：上級機關審查合法性與適當性。</li><li>司法審查：法院可審查授權、程序與內容。</li></ul>
        <div class="box warn">應舉行聽證卻漏未舉行，屬重要程序瑕疵。<br>行政規則<span class="red">不拘束法院</span>；合法有效的法律與法規命令則不同。</div>`},
      {k:"行政法 NO.22",t:"十一、行政處分",c:"compact",b:`
        <h4>定義拆解</h4>
        <div class="box"><span class="red">行政機關</span>就<span class="red">公法上具體事件</span>所為的決定或措施，具有<span class="red">單方、對外、直接發生法律效果</span>。</div>
        <h4>常見分類</h4>
        <ul><li>要式／不要式。</li><li>羈束／裁量。</li><li>命令／形成／確認。</li><li>授益／負擔。</li></ul>
        <h4>形式</h4>
        <p>得以書面、言詞或其他方式作成；相對人有正當理由要求，或經聽證作成時，通常應以書面並記明理由。</p>
        <p>書面行政處分應依法送達；一般處分則得以公告或其他適當方式使相對人知悉。</p>
        <div class="formula">先看法律效果，再看名稱</div>`},
      {k:"行政法 NO.23",t:"行政處分的構成要件效力",c:"dense",b:`
        <h4>構成要件效力</h4>
        <p>行政處分有效存在時，其他機關原則上須把它當作既存法律狀態的前提；除非依法撤銷、廢止或確認無效。</p>
        <p>例：專利核准、商標登記、獎勵資格等，常成為後續行政決定的前提。</p>
        <h4>一般處分</h4>
        <p>雖非以姓名逐一指定，仍可由<span class="red">人、物、時間或空間範圍</span>具體確定對象。</p>
        <table class="note-table mini"><tr><th></th><th>個別行政處分</th><th>一般處分</th></tr>
          <tr><td>對象</td><td>特定人</td><td>可得確定的一群人／物</td></tr>
          <tr><td>事由</td><td>具體事件</td><td>具體事件</td></tr>
          <tr><td>方式</td><td>原則個別送達</td><td>可公告或適當方式通知</td></tr>
        </table>
        <p class="red">一般處分不是法規命令：前者仍處理「具體事件」，後者才是一般抽象規範。</p>`},
      {k:"行政法 NO.24",t:"暫時行政處分",c:"compact",b:`
        <p>機關在事實或法律關係尚待最終確認前，先作成過渡性決定。</p>
        <div class="box soft">例：建築補助先核 3,000 萬，最終審定為 2,400 萬；前決定只是暫時安排，最後處分會取代它。</div>
        <p class="red">暫時處分 ≠ 附期限處分，也不同於法院的暫時權利保護。</p>
        <h4>兩種情形</h4>
        <table class="note-table mini"><tr><th></th><th>終局性</th><th>非終局性</th></tr>
          <tr><td>效力</td><td>可獨立決定部分法律關係</td><td>等待最終處分取代</td></tr>
          <tr><td>信賴</td><td>視其外觀與保留程度</td><td>信賴通常較弱</td></tr>
          <tr><td>救濟</td><td>有直接法律效果即可爭訟</td><td>看是否已獨立侵害權利</td></tr>
        </table>
        <p>暫時性的不利處分仍須有法律依據，不能只因「暫時」就放寬法律保留。</p>`},
      {k:"行政法 NO.25",t:"第三人效力處分",c:"compact",b:`
        <h4>兩種方向</h4>
        <div class="cols"><div class="box"><b>授益相對人</b><br>同時使第三人受不利益</div><div class="box"><b>負擔相對人</b><br>同時使第三人受利益</div></div>
        <p>例：建築執照、都市計畫、土地徵收、政府採購、環評許可等，常同時影響相對人與鄰人、競爭者或公益團體。</p>
        <h4>判斷重點</h4>
        <ul class="check"><li>第三人受影響的是反射利益，還是法律所保護的利益？</li><li>法規是否兼有保護第三人的目的？</li><li>第三人是否具有訴訟權能？</li></ul>
        <div class="box warn">第三人同意若只是行政處分的法定要件，仍不會把單方處分變成行政契約。</div>`},
      {k:"行政法 NO.26",t:"重複處分與第二次裁決",c:"dense",b:`
        <table class="note-table mini"><tr><th></th><th>重複處分</th><th>第二次裁決</th></tr>
          <tr><td>機關是否重新實體審查</td><td>否</td><td>是</td></tr>
          <tr><td>是否產生新規制</td><td>否，只是重申</td><td>是，形成新行政處分</td></tr>
          <tr><td>救濟期間</td><td>不重新起算</td><td>對新處分重新起算</td></tr>
          <tr><td>典型文字</td><td>「前處分仍維持」</td><td>重新調查後准駁</td></tr>
        </table>
        <div class="box">重複處分只是<span class="red">資訊通知</span>，沒有新的法律效果，因此不能藉此讓已逾期的救濟期間復活。</div>
        <p>若符合行政程序法第 128 條等重開程序要件，機關重新審查並作成決定，才可能是第二次裁決。</p>
        <p class="red">分類問題與「處分是否合法」是不同層次，考題不要混答。</p>`},
      {k:"行政法 NO.27",t:"協力行政處分",c:"compact",b:`
        <h4>廣義</h4>
        <p>行政處分完成前，需要人民或其他行政機關參與的多階段形成過程。</p>
        <h4>狹義</h4>
        <p>以相對人的申請、同意或協力為處分成立要件；最後仍由機關單方作成行政處分。</p>
        <table class="note-table mini"><tr><th></th><th>協力行政處分</th><th>行政契約</th></tr>
          <tr><td>意思結構</td><td>最後是機關單方決定</td><td>雙方意思合致</td></tr>
          <tr><td>人民行為</td><td>申請／同意是法定要件</td><td>是契約成立要素</td></tr>
          <tr><td>救濟</td><td>行政處分撤銷／課予義務</td><td>契約給付或確認訴訟</td></tr>
        </table>
        <p>多階段行政處分中，前機關的同意常只是<span class="red">內部參與</span>；多階段行政程序則可能由不同機關各自作成行政處分。</p>`},
      {k:"行政法 NO.28",t:"多階段救濟與違法性繼承",c:"dense",b:`
        <h4>多階段行政處分</h4>
        <p>最終對外行政處分由 B 機關作成，A 機關的同意只是內部階段。人民原則對 B 處分救濟，法院得一併審查 A 的參與是否合法。</p>
        <h4>多階段行政程序</h4>
        <p>A、B 各自對外作成行政處分，就各處分分別救濟；不能只起訴 B，就當然把已確定的 A 全部拉進來審查。</p>
        <div class="cols"><div class="box"><b>構成要件效力</b><br>後機關先把前處分當成有效前提</div><div class="box"><b>違法性繼承</b><br>特定情況下，前階段違法影響後處分</div></div>
        <div class="box warn">例：財政機關確認欠稅 → 內政機關限制出境。要先辨識兩機關是否各自作成對外處分，再決定救濟對象。</div>
        <p class="red">考試陷阱：有前後關係，不等於一定可以在後處分訴訟中全面審查前處分。</p>`},
      {k:"行政法 NO.29",t:"十二、行政處分的附款",c:"compact",b:`
        <h4>五種附款</h4>
        <ul><li><span class="red">期限</span>：效果自某時起或至某時止。</li><li><span class="red">條件</span>：不確定事實成就時，效果發生或消滅。</li><li><span class="red">負擔</span>：另命相對人作為、不作為或忍受。</li><li><span class="red">保留廢止權</span>：符合保留內容時，機關得向後廢止。</li><li><span class="red">負擔保留</span>：保留日後增加或變更負擔。</li></ul>
        <div class="box warn">「保留」是保留<span class="red">廢止</span>，不是保留撤銷。撤銷處理違法處分；廢止處理合法處分。</div>
        <p>裁量行政處分原則可附款；羈束行政處分則須有法律明文，或附款是為確保法定要件履行。</p>
        <p>附款須與行政處分目的有正當合理關聯，不得違反不當聯結禁止。</p>`},
      {k:"行政法 NO.30",t:"負擔與條件的比較",c:"compact",b:`
        <table class="note-table mini"><tr><th></th><th>負擔</th><th>條件</th></tr>
          <tr><td>獨立性</td><td>本身是附加義務</td><td>不是獨立義務</td></tr>
          <tr><td>主處分效力</td><td>主處分先發生效力</td><td>視條件成就決定效力</td></tr>
          <tr><td>不履行</td><td>得強制執行；符合要件時廢止主處分</td><td>條件未成就，效果不發生或消滅</td></tr>
          <tr><td>救濟</td><td>原則可單獨對負擔爭訟</td><td>通常連同主處分爭執</td></tr>
        </table>
        <h4>最後整理</h4>
        <ul class="check"><li>行政契約也能約定條件、期限與附帶義務。</li><li>裁量處分可附款，但要合目的、合比例。</li><li>羈束處分原則不可任意附款。</li><li>附款與主處分可否分離，會影響救濟方式。</li></ul>
        <div class="box soft"><b>解題口訣：</b><br>先定性 → 查法律依據 → 看關聯性 → 看比例 → 最後判斷能否單獨救濟。</div>
        <p class="red scribble">行政法 30 頁整理完成 ✓</p>`}
    ];

    const $=id=>document.getElementById(id),TOTAL=pages.length;
    const home=$("home"),viewer=$("viewer"),frame=$("frame"),slider=$("pageSlider"),stage=$("stage");
    let pageNum=Math.min(TOTAL,Math.max(1,Number(localStorage.getItem("exam-notes:admin:page"))||1)),touchX=null;

    function sheetHTML(n){
      const p=pages[n-1];
      return `<article class="note-sheet ${p.c||""}" aria-label="行政法筆記第 ${n} 頁"><span class="page-kicker">${p.k}</span><h3>${p.t}</h3>${p.b}</article>`;
    }
    function fit(){
      const w=stage.clientWidth-16,h=stage.clientHeight-16,scale=Math.min(w/820,h/1120);
      frame.style.transform=`scale(${Math.max(.1,scale)})`;
    }
    function showPage(n){
      pageNum=Math.min(TOTAL,Math.max(1,Number(n)||1));
      frame.innerHTML=sheetHTML(pageNum);
      $("cur").textContent=pageNum;slider.value=pageNum;
      $("prev").disabled=pageNum===1;$("next").disabled=pageNum===TOTAL;
      $("zoomLabel").textContent=`第 ${pageNum} / ${TOTAL} 頁`;
      localStorage.setItem("exam-notes:admin:page",pageNum);fit();
    }
    function openAdmin(){home.classList.add("hidden");viewer.classList.remove("hidden");showPage(pageNum)}
    function showHome(){viewer.classList.add("hidden");home.classList.remove("hidden");$("zoom").classList.add("hidden")}
    function openZoom(){
      $("zoomSheet").innerHTML=sheetHTML(pageNum);$("zoom").classList.remove("hidden");
      $("zoomArea").scrollTo({top:0,left:0});
    }
    $("adminBtn").addEventListener("click",openAdmin);$("back").addEventListener("click",showHome);
    $("prev").addEventListener("click",()=>showPage(pageNum-1));$("next").addEventListener("click",()=>showPage(pageNum+1));
    slider.addEventListener("input",e=>showPage(e.target.value));
    $("zoomBtn").addEventListener("click",openZoom);$("zoomClose").addEventListener("click",()=>$("zoom").classList.add("hidden"));
    document.querySelectorAll(".subject:not(.ready)").forEach(btn=>btn.addEventListener("click",()=>{$("emptyTitle").textContent=btn.dataset.subject+"筆記尚未上傳";$("empty").classList.remove("hidden")}));
    $("emptyClose").addEventListener("click",()=>$("empty").classList.add("hidden"));
    stage.addEventListener("touchstart",e=>touchX=e.changedTouches[0].clientX,{passive:true});
    stage.addEventListener("touchend",e=>{if(touchX===null)return;const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>55)showPage(pageNum+(d<0?1:-1));touchX=null},{passive:true});
    window.addEventListener("keydown",e=>{if(viewer.classList.contains("hidden"))return;if(e.key==="ArrowLeft")showPage(pageNum-1);if(e.key==="ArrowRight")showPage(pageNum+1);if(e.key==="Escape")$("zoom").classList.add("hidden")});
    window.addEventListener("resize",fit);new ResizeObserver(fit).observe(stage);
  </script>
</body>
</html>
