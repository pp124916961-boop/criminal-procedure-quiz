"930" y="420" font-size="22" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">（≠送達）</text><text x="75" y="555" font-size="40" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">六、調查事實及證據</text><text x="120" y="650" font-size="34" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（一）職權調查主義</text><text x="480" y="650" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">（不受當事人拘束）</text><text x="120" y="755" font-size="32" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（二）有利不利一律注意原則</text><text x="610" y="755" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">→ 源自「依法行政原則」</text><text x="120" y="860" font-size="32" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（三）當事人為輔</text><path d="M380 845 V965" class="l" stroke-width="3"/><line x1="380" y1="845" x2="405" y2="845" class="l" stroke-width="3"/><line x1="380" y1="950" x2="405" y2="950" class="l" stroke-width="3"/><text x="420" y="828" font-size="30" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">得自行提證據</text><text x="420" y="933" font-size="29" class="r" text-anchor="start" dominant-baseline="hanging" font-weight="400">得向 H 申請 調查及證據</text><text x="120" y="1040" font-size="33" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">（四）手段</text><path d="M330 1015 V1265" class="l" stroke-width="3"/><line x1="330" y1="1015" x2="355" y2="1015" class="l" stroke-width="3"/><line x1="330" y1="1080" x2="355" y2="1080" class="l" stroke-width="3"/><line x1="330" y1="1145" x2="355" y2="1145" class="l" stroke-width="3"/><line x1="330" y1="1250" x2="355" y2="1250" class="l" stroke-width="3"/><text x="370" y="995" font-size="29" class="t" text-anchor="start" dominant-baseline="hanging" font-weight="400">詢問當事人：</text><text x="575" y="995" font-size="29" class="r" text-anchor=